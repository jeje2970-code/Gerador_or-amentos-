    st.textContent = kind === 'a4' ? '@media print { @page { size: A4; margin: 12mm; } }'
      : `@media print { @page { size: ${kind}mm auto; margin: 2mm; } body { background:#fff; } }`;
  },
  /* Abre a pré-visualização e prepara a impressão. render(opts) devolve o HTML. */
  preview({ title, render, controls = '', paper = 'a4', onMount, fileName }) {
    this.live = true; this.cur = { render, paper, title, fileName: fileName || title }; this.pdf = null;
    const canShare = FileOut.canShareFiles('application/pdf');
    const html = render();
    $('#print-root').innerHTML = html;
    document.body.classList.add(paper === 'a4' ? 'printing-doc' : 'printing-receipt');
    this.setPage(paper);
    const root = Modal.open({ title, size: paper === 'a4' ? 'max-w-4xl' : 'max-w-md',
      body: `${controls}<div id="print-preview" class="border border-zinc-200 rounded-xl overflow-x-auto bg-white ${paper === 'a4' ? '' : 'flex justify-center p-3'}">${html}</div>
        <p id="pdf-status" class="text-sm mt-3 rounded-xl bg-indigo-50 text-indigo-700 px-4 py-3">Preparando o PDF…</p>
        <p class="text-xs text-zinc-500 mt-2" id="pdf-note"></p>
        <div id="print-hint" class="hidden mt-3 rounded-xl bg-amber-50 text-amber-800 text-sm px-4 py-3">A janela de impressão não abriu. Use o botão <strong>Baixar</strong> ou <strong>Compartilhar</strong>: o PDF já está pronto.</div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Fechar</button><button class="btn btn-secondary" data-action="print-now">${icon('printer')} Imprimir</button><button class="btn btn-secondary" data-action="pdf-download" disabled>${icon('download')} Baixar PDF</button>${canShare ? `<button class="btn btn-primary" data-action="pdf-share" disabled>${icon('send')} Compartilhar</button>` : ''}`,
      onMount, onClose: () => { document.body.classList.remove('printing-doc', 'printing-receipt'); this.live = false; this.cur = null; this.pdf = null; this.pdfToken = (this.pdfToken || 0) + 1; clearTimeout(this.pdfTimer); this.setPage('a4'); } });
    this.schedulePdf(0);
    root._print = true;
    return root;
  },
  refresh() {
    if (!this.cur) { this.live = false; return; }
    const html = this.cur.render();
    const box = $('#print-preview'); if (box) box.innerHTML = html;
    $('#print-root').innerHTML = html;
    this.schedulePdf(500);
  },
  /* ---- PDF direto (sem janela de impressão): gera sozinho ao abrir e quando as opções mudam ---- */
  schedulePdf(delay) {
    clearTimeout(this.pdfTimer); this.pdf = null; this.setPdfState('busy');
    const token = this.pdfToken = (this.pdfToken || 0) + 1;
    this.pdfTimer = setTimeout(async () => {
      const c = this.cur; if (!c) return;
      try {
        const base = c.fileName + (Store.data.company.name ? ' - ' + Store.data.company.name : '');
        const out = await PdfOut.make(c.render(), c.paper, c.fileName);
        if (token !== this.pdfToken || !this.cur) return;
        this.pdf = { blob: out.blob, name: PdfOut.fileName(base), info: out };
        this.setPdfState('ready');
      } catch (e) { if (token === this.pdfToken) this.setPdfState('error'); }
    }, delay);
  },
  setPdfState(state) {
    const st = $('#pdf-status'); if (!st) return;
    const btns = $$('[data-action="pdf-share"],[data-action="pdf-download"]');
    const kb = b => b.size > 1048576 ? (b.size / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b.size / 1024)) + ' KB';
    const paper = this.cur ? this.cur.paper : 'a4';
    let cls = 'bg-indigo-50 text-indigo-700', txt = 'Preparando o PDF…', dis = true;
    if (state === 'ready' && this.pdf) {
      const i = this.pdf.info; dis = false; cls = 'bg-emerald-50 text-emerald-700';
      txt = paper === 'a4' ? `PDF pronto · A4 (210 × 297 mm) · ${i.pages} página${i.pages > 1 ? 's' : ''} · ${kb(this.pdf.blob)}`
        : `PDF pronto · cupom de ${paper} mm (${U.n2(i.wMm)} × ${U.n2(i.hMm)} mm) · ${kb(this.pdf.blob)}`;
    } else if (state === 'error') { cls = 'bg-amber-50 text-amber-800'; txt = 'Não consegui gerar o PDF neste aparelho. Use o botão Imprimir.'; }
    st.className = 'text-sm mt-3 rounded-xl px-4 py-3 ' + cls; st.textContent = txt;
    btns.forEach(b => { b.disabled = dis; });
    const note = $('#pdf-note');
    if (note) note.textContent = paper === 'a4' ? 'O arquivo sai em folha A4, pronto para enviar pelo WhatsApp, e-mail ou salvar. “Imprimir” abre a janela de impressão do aparelho.'
      : `O arquivo sai com a largura exata da bobina de ${paper} mm e a altura do próprio cupom. Para imprimir na bobina, use “Imprimir”.`;
  },
  async sharePdf() {
    if (!this.pdf) return;
    const r = await FileOut.shareBlob(this.pdf.name, this.pdf.blob, 'application/pdf');
    if (r === 'downloaded') Toast.show('Este aparelho não abriu a lista de compartilhar. O PDF foi baixado.', 'info');
  },
  downloadPdf() {
    if (!this.pdf) return;
    FileOut.download(this.pdf.name, this.pdf.blob);
    Toast.show('PDF baixado: ' + this.pdf.name, 'success');
  },
  open(d, tech = false) {
    this.opts = { pix: true, tech };
    this.preview({
      fileName: tech ? `Via do tecnico ${d.number || ''}`.trim() : `${KINDS[d.kind].label} ${d.number || 'rascunho'}`,
      title: tech ? 'Via do técnico (sem preços)' : 'Gerar PDF',
      render: () => this.html(Editor.active && Editor.draft && Editor.draft.id === d.id ? Editor.draft : d, this.opts),
      controls: tech ? '' : `<div class="grid sm:grid-cols-3 gap-3 mb-4">
          <div class="sm:col-span-3"><label class="label">Valores dos materiais no PDF</label><select class="input" data-doc="materialMode">${opts(this.MODES, d.materialMode || 'detailed')}</select></div>
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="w-4 h-4 rounded" data-doc="showPhotos" ${d.showPhotos !== false ? 'checked' : ''}> Incluir fotos do local</label>
          ${Pix.enabled() ? `<label class="flex items-center gap-2 text-sm"><input type="checkbox" class="w-4 h-4 rounded" data-print-opt="pix" checked> Incluir QR Code Pix</label>` : ''}</div>`
    });
  },
  receipt(d, payId) {
    const st = Store.data.settings;
    let width = st.receiptWidth || '80';
    const root = this.preview({
      title: 'Recibo de pagamento', fileName: `Recibo ${d.number}`, paper: width === 'a4' ? 'a4' : width,
      render: () => this.receiptHtml(d, payId, width),
      controls: `<div class="mb-3"><label class="label">Papel</label><select class="input" data-print-width>${opts([['58', 'Bobina 58 mm'], ['80', 'Bobina 80 mm'], ['a4', 'Folha A4']], width)}</select></div>`,
      onMount: r => r.addEventListener('input', e => { if (e.target.dataset.printWidth !== undefined) { width = e.target.value; this.switchPaper(width); } })
    });
    return root;
  },
  coupon(d) {
    let width = Store.data.settings.receiptWidth === 'a4' ? '80' : (Store.data.settings.receiptWidth || '80');
    this.preview({
      title: 'Cupom da venda (não fiscal)', fileName: `Cupom ${d.number}`, paper: width,
      render: () => this.couponHtml(d, width),
      controls: `<div class="mb-3"><label class="label">Papel</label><select class="input" data-print-width>${opts([['58', 'Bobina 58 mm'], ['80', 'Bobina 80 mm']], width)}</select></div>`,
      onMount: r => r.addEventListener('input', e => { if (e.target.dataset.printWidth !== undefined) { width = e.target.value; this.switchPaper(width); } })
    });
  },
  /* relatórios e extratos em A4 (fechamento de caixa, extrato do cliente, relatórios) */
  report(title, html) {
    this.preview({ title, fileName: title, render: () => `<div class="ps" style="--ac:#4f46e5">${html}</div>` });
  },
  switchPaper(w) {
    const paper = w === 'a4' ? 'a4' : w;
    this.cur.paper = paper;
    document.body.classList.toggle('printing-doc', paper === 'a4'); document.body.classList.toggle('printing-receipt', paper !== 'a4');
    this.setPage(paper); this.refresh();
    const box = $('#print-preview'); if (box) box.classList.toggle('flex', paper !== 'a4');
  },
  now(btn) {
    const prev = document.title;
    const d = Editor.active && Editor.draft ? Editor.draft : null;
    document.title = (d ? `${KINDS[d.kind].label} ${d.number || ''} - ` : '') + Store.data.company.name;
    let started = false;
    const onBefore = () => { started = true; };
    const finish = () => {
      document.title = prev; if (btn) btn.disabled = false;
      window.removeEventListener('afterprint', finish); window.removeEventListener('beforeprint', onBefore);
    };
    window.addEventListener('beforeprint', onBefore); window.addEventListener('afterprint', finish);
    if (btn) btn.disabled = true;
    Toast.show('Preparando a impressão… aguarde.', 'info');
    setTimeout(() => {
      try { window.print(); } catch (e) { started = false; }
      setTimeout(() => {
        if (started) return;
        finish();
        const hint = $('#print-hint');
        if (hint) hint.classList.remove('hidden');
      }, 2500);
    }, 60);
  }
};

/* ---- 09a-pix.js ---- */
/* ============================================================
   PIX "COPIA E COLA" E QR CODE (padrão BR Code do Banco Central)
   O código é um texto em blocos "ID + tamanho + valor" (formato EMV):
     00 versão "01" · 26 conta Pix (GUI br.gov.bcb.pix + chave) · 52 categoria "0000"
     53 moeda "986" (real) · 54 valor (opcional) · 58 país "BR" · 59 nome (até 25)
     60 cidade (até 15) · 62 identificador da cobrança (txid) · 63 CRC16 (conferência)
   É um Pix ESTÁTICO: o cliente paga direto na sua chave; o app não fica sabendo
   do pagamento sozinho — você confirma no banco e registra o recebimento.
   ============================================================ */
const Pix = {
  enabled() { const p = Store.data.settings.pix; return !!(p && p.enabled && p.key && p.name && p.city); },
  field: (id, v) => id + String(v.length).padStart(2, '0') + v,
  /* CRC16-CCITT (polinômio 0x1021, valor inicial 0xFFFF), exigido no campo 63 */
  crc16(s) {
    let crc = 0xFFFF;
    for (let i = 0; i < s.length; i++) {
      crc ^= s.charCodeAt(i) << 8;
      for (let b = 0; b < 8; b++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
    return crc.toString(16).toUpperCase().padStart(4, '0');
  },
  /* Normaliza a chave: celular vira +55DDDNÚMERO; CPF/CNPJ só números; e-mail minúsculo; aleatória como está. */
  normalizeKey(k) {
    const s = String(k || '').trim();
    if (!s) return '';
    if (s.includes('@')) return s.toLowerCase();
    if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s)) return s.toLowerCase();
    const d = U.digits(s);
    if (s.startsWith('+')) return '+' + d;
    if (d.length === 14) return d;                                   // CNPJ
    if (d.length === 11 && this.isCPF(d)) return d;                  // CPF
    if (d.length === 10 || d.length === 11) return '+55' + d;         // celular/telefone com DDD
    if (d.length === 12 || d.length === 13) return '+' + d;           // já com 55
    return s;
  },
  isCPF(d) {
    if (!/^\d{11}$/.test(d) || /^(\d)\1+$/.test(d)) return false;
    const calc = n => { let s = 0; for (let i = 0; i < n; i++) s += +d[i] * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
    return calc(9) === +d[9] && calc(10) === +d[10];
  },
  keyType(k) {
    const n = this.normalizeKey(k);
    if (!n) return '';
    if (n.includes('@')) return 'E-mail';
    if (n.startsWith('+')) return 'Celular';
    if (/^\d{11}$/.test(n)) return 'CPF';
    if (/^\d{14}$/.test(n)) return 'CNPJ';
    return 'Chave aleatória';
  },
  payload(amount, txid = '***') {
    const p = Store.data.settings.pix;
    const key = this.normalizeKey(p.key);
    const name = U.ascii(p.name).slice(0, 25).trim() || 'RECEBEDOR';
    const city = U.ascii(p.city).slice(0, 15).trim() || 'BRASIL';
    const tx = (String(txid).replace(/[^A-Za-z0-9]/g, '').slice(0, 25)) || '***';
    const f = this.field;
    let s = f('00', '01') + f('26', f('00', 'br.gov.bcb.pix') + f('01', key)) + f('52', '0000') + f('53', '986');
    if (amount && amount > 0) s += f('54', (Math.round(amount * 100) / 100).toFixed(2));
    s += f('58', 'BR') + f('59', name) + f('60', city) + f('62', f('05', tx)) + '6304';
    return s + this.crc16(s);
  },
  /* imagem do QR (data URL) gerada no próprio aparelho, sem internet */
  qr(text, cell = 6) {
    try {
      const q = qrcode(0, 'M'); q.addData(text); q.make();
      return q.createDataURL(cell, 2);
    } catch (e) { return ''; }
  },
  forDoc(d, amount) {
    const v = amount !== undefined ? amount : (Finance.isBillable(d) ? Finance.balance(d) : Finance.total(d));
    const code = this.payload(v, d.number || 'ORCAPRO');
    return { amount: v, code, img: this.qr(code) };
  },
  show(d, amount) {
    if (!this.enabled()) return Toast.show('Configure a chave Pix em Configurações.', 'error');
    const x = this.forDoc(d, amount);
    Modal.open({ title: 'Pagar com Pix', size: 'max-w-sm',
      body: `<div class="text-center">
        <img src="${x.img}" alt="QR Code Pix" class="mx-auto w-56 h-56" style="image-rendering:pixelated">
        <p class="text-2xl font-semibold tabular-nums mt-2">${U.money(x.amount)}</p>
        <p class="text-xs text-zinc-500">${U.esc(Store.data.settings.pix.name)} · ${U.esc(this.keyType(Store.data.settings.pix.key))}</p>
        <textarea class="input font-mono text-[11px] mt-3" rows="4" readonly id="pix-code">${U.esc(x.code)}</textarea>
        <p class="text-xs text-zinc-500 mt-2">Depois que o cliente pagar, confira no seu banco e registre o pagamento aqui.</p></div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Fechar</button><button class="btn btn-primary" data-action="pix-copy">${icon('copy')} Copiar código</button>` });
  },
  copy() {
    const ta = $('#pix-code'); if (!ta) return;
    ta.select();
    const ok = () => Toast.show('Código Pix copiado.', 'success');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, () => { try { document.execCommand('copy'); ok(); } catch (e) { Toast.show('Selecione e copie manualmente.', 'error'); } });
    else { try { document.execCommand('copy'); ok(); } catch (e) { Toast.show('Selecione e copie manualmente.', 'error'); } }
  }
};

/* ============================================================
   ENVIO: WhatsApp e e-mail com mensagem pronta
   O WhatsApp não aceita anexar arquivo por link; a mensagem leva o resumo,
   o total e o Pix copia e cola. O PDF pode ser enviado em seguida pelo
   botão PDF > Compartilhar/Salvar.
   ============================================================ */
const Share = {
  phone(d) { const c = Store.client(d.clientId); let p = U.digits(c ? c.phone : ''); if (p.length === 10 || p.length === 11) p = '55' + p; return p; },
  text(d) {
    const co = Store.data.company, who = docWho(d), net = Finance.netTotal(d), k = KINDS[d.kind].label;
    const lines = [`Olá${who ? ', ' + who.split(' ')[0] : ''}! Segue ${d.kind === 'orcamento' ? 'o' : d.kind === 'os' ? 'a' : 'o'} ${k.toLowerCase()} *${d.number || ''}* de ${co.name}.`, ''];
    if (d.scope) lines.push(d.scope.length > 300 ? d.scope.slice(0, 297) + '...' : d.scope, '');
    d.items.slice(0, 15).forEach(i => lines.push(`• ${U.n2(i.qty)} ${i.unit} ${i.name} — ${U.money(Pricing.lineTotal(i))}`));
    if (d.items.length > 15) lines.push(`• e mais ${d.items.length - 15} item(ns)`);
    const t = Pricing.totals(d);
    if (t.effectiveDiscount > 0) lines.push('', `Desconto: ${U.money(t.effectiveDiscount)}`);
    lines.push('', `*Total: ${U.money(net)}*`);
    if (d.kind === 'orcamento' && d.validUntil) lines.push(`Válido até ${U.fmtDate(d.validUntil)}.`);
    if (d.paymentTerms) lines.push(`Pagamento: ${d.paymentTerms}`);
    if (d.deadline) lines.push(`Prazo: ${d.deadline}`);
    const bal = Finance.isBillable(d) ? Finance.balance(d) : net;
    if (Finance.isBillable(d) && Finance.keptPaid(d) > 0) lines.push(`Já pago: ${U.money(Finance.keptPaid(d))} · Falta: ${U.money(bal)}`);
    if (Pix.enabled() && bal > 0) lines.push('', 'Pix copia e cola:', Pix.payload(bal, d.number || 'ORCAPRO'));
    if (co.phone) lines.push('', `${co.name} · ${co.phone}`);
    return lines.join('\n');
  },
  open(d) {
    const c = Store.client(d.clientId);
    Modal.open({ title: 'Enviar ao cliente', size: 'max-w-lg',
      body: `<label class="label">Mensagem (pode editar)</label><textarea class="input text-sm" rows="12" id="share-text">${U.esc(this.text(d))}</textarea>
        <p class="text-xs text-zinc-500 mt-2">${this.phone(d) ? `Vai para o WhatsApp de ${U.esc(c.name)} (${U.esc(c.phone)}).` : 'Cliente sem telefone: o WhatsApp vai pedir para escolher o contato.'} Para mandar o PDF junto, use o botão PDF e depois “Compartilhar”.</p>`,
      footer: `<button class="btn btn-secondary" data-action="share-email">${icon('mail')} E-mail</button><button class="btn btn-primary bg-emerald-600 hover:bg-emerald-700" data-action="share-wa">${icon('send')} WhatsApp</button>` });
  },
  mark(d) {
    const doc = Docs.get(d.id); if (!doc) return;
    Docs.event(doc, 'enviado', 'Mensagem pronta aberta');
    if (doc.kind === 'orcamento' && doc.status === 'Rascunho') { doc.status = 'Enviado'; Docs.event(doc, 'status', 'Rascunho → Enviado'); }
    doc.sentAt = U.now(); Store.save();
    if (Editor.active && Editor.draft && Editor.draft.id === d.id) { Editor.draft.status = doc.status; Editor.draft.events = U.clone(doc.events); const s = $('[data-doc="status"]'); if (s) s.value = doc.status; Editor.updateBadge(); Editor.refreshTimeline(); }
  },
  whatsapp(d) {
    const txt = $('#share-text').value, ph = this.phone(d);
    window.open(`https://wa.me/${ph}?text=${encodeURIComponent(txt)}`, '_blank');
    this.mark(d);
  },
  email(d) {
    const c = Store.client(d.clientId), txt = $('#share-text').value.replace(/\*/g, '');
    window.location.href = `mailto:${encodeURIComponent(c && c.email ? c.email : '')}?subject=${encodeURIComponent(`${KINDS[d.kind].label} ${d.number || ''} — ${Store.data.company.name}`)}&body=${encodeURIComponent(txt)}`;
    this.mark(d);
  },
  /* cobrança de atrasado (financeiro) */
  chargeText(docs, name) {
    const co = Store.data.company, total = Pricing.r2(U.sum(docs, d => Finance.balance(d)));
    const fee = Pricing.r2(U.sum(docs, d => Finance.lateFee(d)));
    const lines = [`Olá${name ? ', ' + name.split(' ')[0] : ''}! Tudo bem? Passando para lembrar do pagamento em aberto com ${co.name}:`, ''];
    docs.forEach(d => lines.push(`• ${d.number}: ${U.money(Finance.balance(d))}${Finance.nextDue(d) ? ` (venc. ${U.fmtDate(Finance.nextDue(d))})` : ''}`));
    lines.push('', `*Total: ${U.money(total)}*`);
    if (fee > 0) lines.push(`Multa e juros por atraso até hoje: ${U.money(fee)}.`);
    if (Pix.enabled()) lines.push('', 'Pix copia e cola:', Pix.payload(total, docs.length === 1 ? docs[0].number : 'COBRANCA'));
    lines.push('', 'Qualquer dúvida, estou à disposição. Obrigado!');
    return lines.join('\n');
  }
};

/* ---- 09b-pdf.js ---- */
/* ============================================================
   PDF DENTRO DO APP (sem janela de impressão)
   Por que existe: no celular, window.print() abre a tela de impressão do Android, que é lenta, pede
   para "Salvar como PDF" e não deixa escolher o tamanho do cupom. Aqui o app desenha o próprio documento
   numa imagem (html2canvas, embutida no app, funciona offline) e monta o arquivo PDF sozinho:
     - A4 (210 x 297 mm, margem de 12 mm) para orçamentos, pedidos, OS, recibos A4 e relatórios, em quantas páginas precisar;
     - largura exata da bobina (58 ou 80 mm) e altura do próprio cupom, em uma página só.
   O resultado é um Blob pronto para a folha de compartilhar (WhatsApp etc.) ou para baixar.
   ============================================================ */
const PdfOut = {
  PX_MM: 96 / 25.4,          // pixels de CSS por milímetro
  A4: { w: 210, h: 297, margin: 12 },
  MAX_CANVAS_PX: 14000,       // limite seguro de altura de canvas em celulares

  available() { return typeof window.html2canvas === 'function'; },

  /* Gera o PDF. paper: 'a4' | '58' | '80'. Devolve { blob, pages, wMm, hMm }. */
  async make(html, paper, title) {
    if (!this.available()) throw new Error('html2canvas ausente');
    const isA4 = paper === 'a4', k = this.PX_MM;
    const host = document.createElement('div');
    host.id = 'pdf-host'; host.className = 'pdf-host';
    host.style.cssText = 'position:fixed;left:-30000px;top:0;background:#fff;color:#18181b;padding-bottom:' + (isA4 ? 16 : 0) + 'px;' + (isA4 ? `width:${(this.A4.w - 2 * this.A4.margin) * k}px;` : 'width:max-content;');
    host.innerHTML = html;
    document.body.appendChild(host);
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      await this.imagesReady(host);
      const hostW = Math.ceil(host.getBoundingClientRect().width), hostH = Math.ceil(host.getBoundingClientRect().height);
      const scale = isA4 ? Math.max(1.2, Math.min(2, this.MAX_CANVAS_PX / hostH)) : 3;
      const atoms = isA4 ? this.atoms(host) : [];
      const full = await window.html2canvas(host, {
        scale, backgroundColor: '#ffffff', logging: false, useCORS: false, imageTimeout: 15000, width: hostW, height: hostH, windowWidth: hostW + 40,
        onclone: doc => {
          doc.documentElement.classList.remove('dark');
          const h = doc.getElementById('pdf-host'); if (h) { h.style.left = '0'; h.style.top = '0'; }
        }
      });
      const k2 = full.width / hostW;                  // escala real aplicada pelo html2canvas
      const parts = [];                               // cada item = uma página (JPEG)
      let wMm, hMm;
      if (isA4) {
        wMm = this.A4.w; hMm = this.A4.h;
        const pw = Math.round(wMm * k * k2), ph = Math.round(hMm * k * k2), m = this.A4.margin * k * k2;
        const limit = (hMm - 2 * this.A4.margin) * k;     // altura útil de cada página, em px de CSS
        const cuts = this.cuts(hostH, limit, atoms);
        for (let i = 0; i < cuts.length - 1; i++) {
          const y0 = cuts[i], y1 = cuts[i + 1], c = document.createElement('canvas');
          c.width = pw; c.height = ph;
          const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, pw, ph);
          g.drawImage(full, 0, Math.round(y0 * k2), full.width, Math.min(full.height - Math.round(y0 * k2), Math.round((y1 - y0) * k2)), m, m, full.width, Math.min(full.height - Math.round(y0 * k2), Math.round((y1 - y0) * k2)));
          parts.push(await this.jpeg(c, 0.9));
        }
      } else {
        wMm = Math.round(hostW / k * 10) / 10; hMm = Math.round(hostH / k * 10) / 10;
        [58, 80].forEach(n => { if (Math.abs(wMm - n) < 1) wMm = n; });   // largura exata da bobina
        parts.push(await this.jpeg(full, 0.95));
      }
      const blob = this.build(parts, wMm, hMm, title);
      return { blob, pages: parts.length, wMm, hMm };
    } finally { host.remove(); }
  },

  /* espera todas as imagens do documento (logo, fotos, QR Code) terminarem de carregar */
  imagesReady(root) {
    return Promise.all(Array.from(root.querySelectorAll('img')).map(im => im.complete ? Promise.resolve() : new Promise(r => { im.onload = im.onerror = r; })));
  },

  /* peças que não devem ser cortadas no meio: elementos sem filhos (linhas de texto), linhas de tabela, imagens e caixas */
  atoms(host) {
    const top = host.getBoundingClientRect().top, out = [];
    host.querySelectorAll('*').forEach(el => {
      const atomic = el.children.length === 0 || /^(TR|IMG)$/.test(el.tagName) || el.matches('.ps-box,.ps-photo,.ps-qr,.ps-sign,.ps-totals,.ps-lump');
      if (!atomic) return;
      const r = el.getBoundingClientRect();
      if (r.height > 1) out.push({ t: r.top - top, b: r.bottom - top });
    });
    return out;
  },

  /* posições (em px) onde cada página termina. Procura, de baixo para cima, uma linha que não atravesse nenhuma peça. */
  cuts(totalH, limit, atoms) {
    const cuts = [0]; let y = 0;
    while (totalH - y > limit + 0.5) {
      const maxC = y + limit, minC = y + limit * 0.5;
      let found = null;
      for (let c = maxC; c >= minC; c -= 2) {
        if (!atoms.some(a => a.t < c - 0.5 && a.b > c + 0.5)) { found = c; break; }
      }
      if (found !== null) { const up = Math.floor(found) - 2; if (up > minC && !atoms.some(a => a.t < up - 0.5 && a.b > up + 0.5)) found = up; }   // folga: não deixa o 1º pixel da próxima peça escapar para esta página
      y = found === null ? maxC : found; cuts.push(y);
    }
    cuts.push(totalH);
    return cuts;
  },

  jpeg(canvas, q) {
    return new Promise((res, rej) => canvas.toBlob(b => b ? b.arrayBuffer().then(buf => res({ data: new Uint8Array(buf), w: canvas.width, h: canvas.height })) : rej(new Error('jpeg')), 'image/jpeg', q));
  },

  /* Monta o arquivo PDF "na mão": 1 imagem JPEG por página, cobrindo a página inteira. */
  build(pages, wMm, hMm, title) {
    const enc = new TextEncoder(), chunks = []; let len = 0; const offs = [];
    const add = x => { const u = typeof x === 'string' ? enc.encode(x) : x; chunks.push(u); len += u.length; };
    const W = +(wMm * 72 / 25.4).toFixed(2), H = +(hMm * 72 / 25.4).toFixed(2);
    const asc = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7e]/g, '').replace(/[()\\]/g, '');
    const obj = (n, body) => { offs[n] = len; add(`${n} 0 obj\n${body}\nendobj\n`); };
    add('%PDF-1.4\n%âãÏÓ\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_, i) => `${4 + 3 * i} 0 R`).join(' ')}] >>`);
    obj(3, `<< /Title (${asc(title)}) /Producer (OrcaPro) /CreationDate (D:${new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)}Z) >>`);
    pages.forEach((p, i) => {
      const pg = 4 + 3 * i, ct = pg + 1, im = pg + 2, draw = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
      obj(pg, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
      obj(ct, `<< /Length ${draw.length} >>\nstream\n${draw}\nendstream`);
      offs[im] = len;
      add(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.data.length} >>\nstream\n`);
      add(p.data); add('\nendstream\nendobj\n');
    });
    const total = 4 + 3 * pages.length, xref = len;
    add(`xref\n0 ${total}\n0000000000 65535 f \n`);
    for (let n = 1; n < total; n++) add(String(offs[n]).padStart(10, '0') + ' 00000 n \n');
    add(`trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(chunks, { type: 'application/pdf' });
  },

  /* nome de arquivo seguro para o celular */
  fileName(base) {
    const s = String(base || 'documento').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
    return (s || 'documento') + '.pdf';
  }
};

/* ---- 10-pdv.js ---- */
/* ============================================================
   12. VENDA RÁPIDA (PDV / balcão)
   O carrinho vive só em memória até "Finalizar venda", que cria um documento
   do tipo "pdv" com status "Concluída" (baixa o estoque na hora).
   ============================================================ */
const PDV = {
  cart: [], q: '', cat: 'all', method: 'Pix', received: '', disc: 0, discType: 'value', customer: '', dueDate: '', discLabel: '', discAuto: false, segId: null,
  seg() { const g = sid(); return g !== 'all' ? Store.seg(g) : (Store.seg(this.segId) || Store.data.segments[0]); },
  reset() { this.cart = []; this.received = ''; this.disc = 0; this.discType = 'value'; this.customer = ''; this.dueDate = ''; this.discLabel = ''; this.discAuto = false; this.q = ''; this.cat = 'all'; this.method = 'Pix'; },
  doc() { return { items: this.cart, discount: this.disc, discountType: this.discType, finalOverride: null }; },
  client() { const nm = this.customer.trim().toLowerCase(); return nm ? Store.data.clients.find(c => c.name.toLowerCase() === nm) : null; },
  /* quanto deste produto já está no carrinho (para avisar falta de estoque) */
  inCart: id => U.sum(PDV.cart.filter(i => i.productId === id), i => Number(i.qty) || 0),

  renderProducts() {
    const box = $('#pdv-products'); if (!box) return;
    const seg = this.seg(), q = this.q.trim().toLowerCase();
    const list = Store.data.products.filter(p => !p.hasVariants && p.segmentId === seg.id && (this.cat === 'all' || p.category === this.cat) && (prodName(p) + ' ' + p.category).toLowerCase().includes(q))
      .sort((a, b) => prodName(a).localeCompare(prodName(b), 'pt'));
    box.innerHTML = list.length ? `<div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">${list.map(p => {
      const low = p.stock != null && p.minStock != null && p.stock <= p.minStock && p.stock > 0;
      return `<button class="text-left rounded-xl border border-zinc-200 bg-white p-3 shadow-sm hover:border-indigo-400 hover:shadow-md transition" data-action="pdv-add" data-id="${p.id}">
        <div class="text-sm font-medium text-zinc-900 line-clamp-2 min-h-[2.5rem]">${U.esc(prodName(p))}</div>
        <div class="mt-2 flex items-center justify-between gap-2"><span class="font-semibold tabular-nums">${U.money(Pricing.productPrice(p, seg))}</span>
        <span class="text-xs ${p.stock != null && p.stock <= 0 ? 'text-red-600' : low ? 'text-amber-600' : 'text-zinc-500'}">${p.stock == null ? '' : (p.stock <= 0 ? 'sem estoque' : U.n2(p.stock) + ' ' + U.esc(p.unit))}</span></div>
      </button>`;
    }).join('')}</div><div class="h-20 lg:hidden" aria-hidden="true"></div>` : emptyState('Nenhum item neste segmento', 'Cadastre produtos na aba Catálogo.');
  },
  lineWarn(it) {
    const p = it.productId && Store.product(it.productId);
    if (!p || p.stock == null) return '';
    const need = this.inCart(p.id);
    return need > p.stock + 0.0005 ? `<p class="text-xs text-amber-700 mt-1">Estoque: ${U.n2(p.stock)} ${U.esc(p.unit)} — vendendo ${U.n2(need)}</p>` : '';
  },
  renderCart() {
    const box = $('#pdv-cart'); if (!box) return;
    const cl = this.client(), credit = cl ? Finance.creditBalance(cl.id) : 0;
    if (this.method === 'Crédito' && credit <= 0.004) this.method = 'Pix';
    const rows = this.cart.map((it, i) => `
      <div class="py-3 border-t border-zinc-100 first:border-t-0" data-cart-row="${i}">
        <div class="flex justify-between gap-2"><div class="text-sm font-medium text-zinc-900">${U.esc(it.name)}</div>
          <button class="btn btn-ghost btn-sm text-red-600" data-action="pdv-del" data-i="${i}" aria-label="Remover">${icon('x')}</button></div>
        <div class="mt-2 flex items-center gap-2">
          <div class="flex items-center rounded-xl border border-zinc-300 bg-white">
            <button class="px-2 py-2 text-zinc-600 hover:bg-zinc-100 rounded-l-xl" data-action="pdv-dec" data-i="${i}" aria-label="Diminuir">${icon('minus')}</button>
            <input type="text" inputmode="decimal" data-num="q" class="w-14 text-center text-sm tabular-nums focus:outline-none py-1.5 bg-transparent" data-pdv-item="${i}" data-f="qty" value="${U.n2(it.qty)}" aria-label="Quantidade">
            <button class="px-2 py-2 text-zinc-600 hover:bg-zinc-100 rounded-r-xl" data-action="pdv-inc" data-i="${i}" aria-label="Aumentar">${icon('plus')}</button>
          </div>
          <span class="text-xs text-zinc-400">×</span>
          <input type="text" inputmode="decimal" data-num="dec" class="input !w-24 !py-1.5 tabular-nums" data-pdv-item="${i}" data-f="price" value="${U.dec(it.price)}" aria-label="Preço unitário">
          <div class="ml-auto font-semibold tabular-nums text-sm" data-line-total>${U.money(Pricing.lineTotal(it))}</div>
        </div>
        <div data-line-warn>${this.lineWarn(it)}</div>
      </div>`).join('');
    const methods = this.methodsHtml(credit);
    const session = CashBox.current(this.seg().id);
    box.innerHTML = `
      <div class="flex items-center justify-between mb-2"><h2 class="font-semibold text-zinc-900">Carrinho</h2>
        ${this.cart.length ? `<button class="text-xs text-zinc-500 hover:text-red-600" data-action="pdv-clear">Limpar</button>` : ''}</div>
      <div>${rows || '<p class="text-sm text-zinc-500 py-6 text-center">Toque em um produto para adicionar.</p>'}</div>
      <div class="mt-3 pt-3 border-t border-zinc-100 space-y-3">
        <div class="flex items-center justify-between gap-2"><label class="label !mb-0 !text-sm">Desconto</label>
          <div class="flex gap-1.5"><select class="input !w-[4.5rem] !px-2 !py-1.5" data-pdv="discType">${opts([['value', 'R$'], ['percent', '%'], ['total', 'Total']], this.discType)}</select>
          <input type="text" inputmode="decimal" data-num="dec" class="input !w-24 !py-1.5 tabular-nums" data-pdv="disc" value="${this.disc ? U.dec(this.disc) : ''}" aria-label="Valor do desconto"></div></div>
        <div class="rounded-xl bg-zinc-900 text-white px-4 py-3 flex items-center justify-between"><span class="text-sm">Total</span><span class="text-xl font-semibold tabular-nums" id="pdv-total"></span></div>
        <div><label class="label">Nome do cliente ${this.method === 'Fiado' ? '(obrigatório no fiado)' : '(opcional)'}</label>
          <input class="input" list="pdv-clients" data-pdv="customer" value="${U.esc(this.customer)}" placeholder="Digite ou escolha um cliente" autocomplete="off">
          <datalist id="pdv-clients">${Store.data.clients.map(c => `<option value="${U.esc(c.name)}">`).join('')}</datalist></div>
        <div><label class="label">Forma de pagamento</label><div class="flex flex-wrap gap-2" id="pdv-methods">${methods}</div></div>
        ${this.method === 'Dinheiro' ? `<div class="grid grid-cols-2 gap-3 items-end"><div><label class="label">Valor entregue pelo cliente</label>
          <input type="text" inputmode="decimal" data-num="dec" class="input tabular-nums" data-pdv="received" value="${U.esc(this.received)}" placeholder="Exato"></div>
          <div><p class="text-xs text-zinc-500">Troco</p><p class="text-lg font-semibold tabular-nums text-emerald-700" id="pdv-change"></p></div></div>
          ${session ? '' : `<p class="text-xs text-zinc-500">Dica: abra o <a href="#/financeiro" data-nav data-action="fin-goto-caixa" class="text-indigo-600 underline">caixa do balcão</a> para conferir o dinheiro no fim do dia.</p>`}` : ''}
        ${this.method === 'Pix' && Pix.enabled() ? `<button class="btn btn-secondary w-full" data-action="pdv-pix" ${this.cart.length ? '' : 'disabled'}>${icon('qr')} Mostrar QR Code Pix</button>` : ''}
        ${this.method === 'Fiado' ? `<div><label class="label">Data de pagamento (vencimento)</label><input type="date" class="input" data-pdv="dueDate" value="${this.dueDate}" min="${U.today()}"><p class="text-xs text-orange-700 mt-1">A venda entra em “A receber” até essa data e pode ser quitada depois no Financeiro.</p></div>`
          : this.method === 'Crédito' ? `<p class="text-xs text-indigo-700">Usa o saldo a favor do cliente. Se o crédito não cobrir tudo, escolha outra forma.</p>`
          : `<p class="text-xs text-emerald-700">Pix, cartão e dinheiro são considerados pagos na hora.</p>`}
        <button class="btn btn-primary w-full py-3" data-action="pdv-finish" ${this.cart.length ? '' : 'disabled'}>${icon('check')} Finalizar venda</button>
      </div>`;
    this.refreshTotals();
  },
  methodsHtml(credit) {
    const mlist = [...METHODS, ...(credit > 0.004 ? ['Crédito'] : []), 'Fiado'];
    const mlabel = m => (m === 'Fiado' ? 'Fiado / Pendente' : m === 'Crédito' ? `Crédito (${U.money(credit)})` : m);
    return mlist.map(m => `<button class="btn btn-sm ${this.method === m ? 'bg-zinc-900 text-white' : 'btn-secondary'}" data-action="pdv-method" data-m="${m}">${mlabel(m)}</button>`).join('');
  },
  refreshTotals() {
    const t = Pricing.totals(this.doc());
    const a = $('#pdv-total'); if (a) a.textContent = U.money(t.total);
    const c = $('#pdv-change');
    if (c) { const rec = this.received === '' ? t.total : U.num(this.received) || 0; c.textContent = U.money(Math.max(0, Pricing.r2(rec - t.total))); }
    const fab = $('#pdv-fab');
    if (fab) { fab.classList.toggle('hidden', !this.cart.length); fab.innerHTML = `${icon('cart')} ${this.cart.length} · ${U.money(t.total)}`; }
  },
  /* digitação no carrinho: atualiza total da linha e da venda a cada dígito, sem redesenhar */
  onItemInput(t) {
    const i = +t.dataset.pdvItem, it = this.cart[i]; if (!it) return;
    if (t.value.trim() === '') return;
    Pricing.applyChange(it, t.dataset.f, t.value);
    const row = $(`[data-cart-row="${i}"]`);
    if (row) { $('[data-line-total]', row).textContent = U.money(Pricing.lineTotal(it)); $$('[data-cart-row]').forEach(r => { const k = +r.dataset.cartRow; $('[data-line-warn]', r).innerHTML = this.lineWarn(this.cart[k]); }); }
    this.refreshTotals();
  },
  onItemChange(t) {
    const i = +t.dataset.pdvItem, it = this.cart[i]; if (!it) return;
    Pricing.applyChange(it, t.dataset.f, t.value);
    if (it.qty <= 0) this.cart.splice(i, 1);
    this.renderCart();
  },
  /* ao sair do campo de nome: se o cliente tem desconto fixo, aplica sozinho */
  onCustomer() {
    const c = this.client(), pct = c ? Number(c.discountPct) || 0 : 0, wasAuto = this.discAuto;
    if (wasAuto) { this.disc = 0; this.discType = 'value'; this.discLabel = ''; this.discAuto = false; }
    if (pct > 0) {
      if (this.disc > 0) Toast.show(`Este cliente tem desconto fixo de ${U.pct(pct)}, mas já existe um desconto nesta venda. Nada foi alterado.`, 'info');
      else { this.discType = 'percent'; this.disc = pct; this.discLabel = c.discountLabel || 'Desconto do cliente'; this.discAuto = true; Toast.show(`Desconto fixo de ${U.pct(pct)} do cliente aplicado.`, 'success'); }
    }
    const credit = c ? Finance.creditBalance(c.id) : 0;
    if (credit > 0.004) Toast.show(`${c.name} tem ${U.money(credit)} de crédito para usar.`, 'info');
    /* atualiza só os campos afetados: redesenhar o carrinho inteiro aqui "engoliria" o toque no botão Finalizar */
    const di = $('[data-pdv="disc"]'), dt = $('[data-pdv="discType"]'), mb = $('#pdv-methods');
    if (di) di.value = this.disc ? U.dec(this.disc) : ''; if (dt) dt.value = this.discType;
    if (this.method === 'Crédito' && credit <= 0.004) { this.method = 'Pix'; this.renderCart(); return; }
    if (mb) mb.innerHTML = this.methodsHtml(credit);
    this.refreshTotals();
  },
  onInput(t) {
    const k = t.dataset.pdv;
    if (k === 'disc') { this.disc = Math.max(0, U.num(t.value) || 0); this.discAuto = false; }
    else if (k === 'discType') { this.discType = t.value; this.discAuto = false; }
    else if (k === 'customer') this.customer = t.value;
    else if (k === 'dueDate') this.dueDate = t.value;
    else if (k === 'received') this.received = t.value;
    this.refreshTotals();
  },
  add(id) {
    const p = Store.product(id), seg = this.seg(); if (!p) return;
    const ex = this.cart.find(i => i.productId === id);
    if (ex) ex.qty += 1; else this.cart.push(Pricing.itemFromProduct(p, seg, 1));
    if (p.stock != null && this.inCart(id) > p.stock + 0.0005) Toast.show(`${prodName(p)}: só ${U.n2(Math.max(0, p.stock))} em estoque.`, 'warn');
    this.renderCart();
  },
  showPix() {
    const t = Pricing.totals(this.doc()).total;
    if (t <= 0) return;
    Pix.show({ number: 'BALCAO' }, t);
  },
  finish(force) {
    if (!this.cart.length) return;
    if (!Validate.form($('#pdv-cart'))) return;
    const seg = this.seg(), d = Docs.blank('pdv', seg.id);
    d.items = U.clone(this.cart); d.discount = this.disc; d.discountType = this.discType; d.discountLabel = this.discLabel; d.status = 'Concluída';
    const name = this.customer.trim();
    let client = this.client();
    const t = Pricing.totals(d);
    if (t.total <= 0) return Toast.show('O total da venda precisa ser maior que zero.', 'error');
    if (!force) {
      const short = Stock.shortages(d.items, d);
      if (short.length) {
        return Modal.confirm({ title: 'Vender sem estoque?', confirmLabel: 'Vender mesmo assim',
          message: `Estoque insuficiente:<br>${short.map(x => `• ${U.esc(prodName(x.product))}: tem ${U.n2(x.avail)}, vendendo ${U.n2(x.need)}`).join('<br>')}<br><br>Se continuar, o estoque fica negativo. Confira a contagem depois.`,
          onConfirm: () => this.finish(true) });
      }
    }
    const method = this.method;
    let change = 0, note = '';
    if (method === 'Fiado') {
      if (!name) return Toast.show('Informe o nome de quem vai pagar depois.', 'error');
      if (!this.dueDate) return Toast.show('Informe a data de pagamento do fiado.', 'error');
      d.dueDate = this.dueDate;
    } else if (method === 'Crédito') {
      if (!client || Finance.creditBalance(client.id) < t.total - 0.004) return Toast.show('O crédito do cliente não cobre a venda. Escolha outra forma.', 'error');
    } else if (method === 'Dinheiro') {
      const rec = this.received === '' ? t.total : U.num(this.received) || 0;
      if (rec < t.total - 0.004) return Toast.show('O valor entregue é menor que o total.', 'error');
      change = Pricing.r2(rec - t.total); note = change > 0 ? `Entregue ${U.money(rec)} · troco ${U.money(change)}` : '';
    }
    if (method === 'Fiado' && !client) { client = Seed.clientDefaults({ id: U.uid('cli'), name }); Store.data.clients.push(client); }
    d.clientId = client ? client.id : ''; d.customerName = name;
    d.number = Store.nextNumber('pdv');
    if (method !== 'Fiado') Finance.addPayment(d, { amount: t.total, method, date: U.today(), note });
    const saved = Docs.save(d);
    this.reset(); this.renderCart(); this.renderProducts();
    Modal.open({ title: 'Venda concluída', size: 'max-w-sm',
      body: `<div class="text-center py-2"><div class="mx-auto w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mb-3">${icon('check', 'w-6 h-6')}</div>
        <p class="text-sm text-zinc-500">${U.esc(saved.number)} · ${method === 'Fiado' ? 'Fiado / Pendente' : method}</p>
        ${name ? `<p class="text-sm text-zinc-800 mt-1">${U.esc(name)}</p>` : ''}${method === 'Fiado' ? `<p class="text-sm text-orange-700 mt-1">Vence em ${U.fmtDate(saved.dueDate)}</p>` : ''}
        <p class="text-3xl font-semibold tabular-nums mt-1">${U.money(t.total)}</p>
        ${change > 0 ? `<p class="mt-3 text-sm text-zinc-500">Troco</p><p class="text-xl font-semibold text-emerald-700 tabular-nums">${U.money(change)}</p>` : ''}</div>`,
      footer: `<button class="btn btn-secondary" data-action="pdv-coupon" data-id="${saved.id}">${icon('receipt')} Cupom</button><button class="btn btn-primary" data-action="modal-close">Nova venda</button>` });
  }
};

const Pay = {
  openReceive(docId) {
    const d = Docs.get(docId); if (!d) return;
    const bal = Finance.balance(d), who = docWho(d), credit = d.clientId ? Finance.creditBalance(d.clientId) : 0;
    const fee = Finance.isOverdue(d) ? Finance.lateFee(d) : 0;
    const methods = METHODS.map(m => [m, m]); if (credit > 0.004) methods.push(['Crédito', `Crédito do cliente (${U.money(credit)})`]);
    const root = Modal.open({ title: `Receber — ${d.number}`, size: 'max-w-md',
      body: `<p class="text-sm text-zinc-500 mb-4">${who ? U.esc(who) + ' · ' : ''}Saldo pendente: <strong class="text-zinc-900" id="pay-bal">${U.money(bal)}</strong></p>
        ${fee > 0.004 ? `<label class="flex items-start gap-2 text-sm mb-4 rounded-xl bg-red-50 text-red-800 px-3 py-2"><input type="checkbox" name="withFee" class="w-4 h-4 mt-0.5 rounded">
          <span>Cobrar multa e juros de ${U.money(fee)} (${Finance.daysLate(d)} dia(s) de atraso)</span></label>` : ''}
        <div class="grid grid-cols-2 gap-3">
          <div><label class="label">Valor deste recebimento</label>${numInput('name="amount"', bal)}</div>
          <div><label class="label">Forma</label><select class="input" name="method">${opts(methods, 'Pix')}</select></div>
          <div class="col-span-2"><label class="label">Data</label><input type="date" class="input" name="date" value="${U.today()}"></div>
          <div class="col-span-2"><label class="label">Observação</label><input class="input" name="note" placeholder="Opcional"></div>
        </div>
        ${Pix.enabled() ? `<button class="btn btn-secondary w-full mt-3" data-action="pay-pix">${icon('qr')} Mostrar QR Code Pix</button>` : ''}`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="pay-save">Registrar recebimento</button>`,
      onMount: r => r.addEventListener('input', e => {
        if (e.target.name !== 'withFee') return;
        const v = Pricing.r2(bal + (e.target.checked ? fee : 0));
        r._fee = e.target.checked ? fee : 0;
        $('[name="amount"]', r).value = U.dec(v); $('#pay-bal', r).textContent = U.money(v);
      }) });
    root._docId = docId; root._fee = 0;
  },
  save(el) {
    const root = el.closest('[data-modal]'), d = Docs.get(root._docId), f = formData(root);
    if (root._fee > 0) d.fees.push({ id: U.uid('fee'), date: U.today(), amount: root._fee, note: `Atraso de ${Finance.daysLate(d)} dia(s)` });
    if (!Validate.form(root)) { if (root._fee > 0) d.fees.pop(); return; }
    const amt = U.num(f.amount) || 0;
    const undoFee = () => { if (root._fee > 0) d.fees.pop(); };
    if (amt <= 0) { undoFee(); return Toast.show('Informe um valor maior que zero.', 'error'); }
    if (amt > Finance.balance(d) + 0.004) { undoFee(); return Toast.show('O valor é maior que o saldo pendente.', 'error'); }
    if (f.method === 'Crédito' && amt > Finance.creditBalance(d.clientId) + 0.004) { undoFee(); return Toast.show('O cliente não tem crédito suficiente.', 'error'); }
    if (root._fee > 0) Docs.event(d, 'multa', U.money(root._fee));
    const p = Finance.addPayment(d, { amount: amt, method: f.method, date: f.date || U.today(), note: (f.note || '').trim() });
    Docs.event(d, 'pagamento', `${U.money(amt)} em ${f.method}`);
    Store.save(); Modal.closeFrom(el);
    Toast.show('Recebimento registrado.', 'success', { label: 'Recibo', fn: () => Print.receipt(d, p.id) });
    Router.render();
  },
  charge(docs, name) {
    const d0 = docs[0], c = Store.client(d0.clientId);
    let ph = U.digits(c ? c.phone : ''); if (ph.length === 10 || ph.length === 11) ph = '55' + ph;
    Modal.open({ title: `Cobrar ${name || ''}`.trim(), size: 'max-w-lg',
      body: `<label class="label">Mensagem (pode editar)</label><textarea class="input text-sm" rows="12" id="share-text">${U.esc(Share.chargeText(docs, name))}</textarea>
        <p class="text-xs text-zinc-500 mt-2">${ph ? `Vai para o WhatsApp de ${U.esc(c.name)} (${U.esc(c.phone)}).` : 'Sem telefone cadastrado: o WhatsApp vai pedir o contato.'}</p>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Fechar</button><button class="btn btn-primary bg-emerald-600 hover:bg-emerald-700" data-action="charge-wa" data-ph="${ph}">${icon('send')} Abrir WhatsApp</button>` });
  }
};

const dueBadge = d => {

  return badge('Vence ' + U.fmtDate(nd).slice(0, 5), 'bg-zinc-100 text-zinc-600 ring-zinc-200');
};

LIST.receber = () => {
  const box = $('#list-receber'); if (!box) return;
  const f = UI.f.receber, q = f.q.trim().toLowerCase(), today = U.today();
  if (f.view === 'lotes') { box.innerHTML = `<div class="card overflow-hidden">${Batch.listHtml()}</div>`; return; }
  const list = Finance.scoped(sid()).filter(d => Finance.balance(d) > 0.004)
    .filter(d => (f.client === 'all' || d.clientId === f.client) && (!f.from && !f.to || Finance.inRange(d.date, f.from, f.to)))
    .filter(d => !q || (d.number + ' ' + docWho(d)).toLowerCase().includes(q))
    .sort((a, b) => (Finance.nextDue(a) || '9999').localeCompare(Finance.nextDue(b) || '9999') || a.date.localeCompare(b.date));
  const open = U.sum(list, d => Finance.balance(d));
  const late = U.sum(list, d => Finance.overdueAmount(d));
  const week = U.sum(list, d => U.sum(Finance.openInstallments(d).filter(x => x.due && x.due >= today && x.due <= U.addDays(7)), x => x.open));
  const credits = Pricing.r2(U.sum(Store.data.clients, c => Math.max(0, Finance.creditBalance(c.id))));
  const stats = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
    ${stat('Total a receber', U.money(open), list.length + ' documento(s) em aberto', 'text-orange-600')}
    ${stat('Atrasado', U.money(late), 'Parcelas com vencimento já passado', late > 0 ? 'text-red-600' : 'text-zinc-900')}
    ${stat('Vence em 7 dias', U.money(week), 'Próximos recebimentos')}
    ${stat('Crédito de clientes', U.money(credits), 'Valor a favor dos clientes', 'text-indigo-600')}</div>`;
  let body;

        <div class="md:col-span-2 text-sm ${x.due && x.due < today ? 'text-red-600 font-medium' : 'text-zinc-700'}">${x.due ? U.fmtDate(x.due) : 'Sem data'}</div>
        <a href="#/doc/${d.id}" data-nav class="md:col-span-4 min-w-0 text-right md:text-left"><div class="font-medium text-zinc-900 truncate">${U.esc(docWho(d) || 'Sem cliente')}</div><div class="text-xs text-zinc-500">${U.esc(d.number)}${d.installments.length ? ` · parcela ${x.n}/${d.installments.length}` : ''}</div></a>
        <div class="md:col-span-3 text-sm font-semibold tabular-nums text-orange-600">${U.money(x.open)}</div>
        <div class="md:col-span-3 md:text-right"><button class="btn btn-primary btn-sm w-full md:w-auto" data-action="pay-open" data-id="${d.id}">Receber</button></div></div>`).join('');

        <div class="col-span-3">Documento</div><div class="col-span-3">Cliente</div><div class="col-span-2">Vencimento</div><div class="col-span-2 text-right">Pendente</div><div class="col-span-2"></div></div>` +
      list.map(d => {

        return `<div class="grid grid-cols-2 md:grid-cols-12 gap-x-4 gap-y-1 items-center px-4 py-3 border-t border-zinc-100 first:border-t-0">
          <a href="#/doc/${d.id}" data-nav class="md:col-span-3 min-w-0"><div class="font-medium text-zinc-900">${U.esc(d.number)} ${payBadge(Finance.payStatus(d))}</div>

LIST.pagar = () => {
  const box = $('#list-pagar'); if (!box) return;
  const f = UI.f.pagar, q = f.q.trim().toLowerCase(), s = sid(), today = U.today();
  const all = Store.data.expenses.filter(e => s === 'all' || !e.segmentId || e.segmentId === s);
  const list = all.filter(e => {
    if (f.status === 'abertas' && e.paidAt) return false;
    if (f.status === 'pagas' && !e.paidAt) return false;
    if (f.status === 'atrasadas' && (e.paidAt || e.due >= today)) return false;
    if (f.cat !== 'all' && e.category !== f.cat) return false;
    if ((f.from || f.to) && !Finance.inRange(e.due, f.from, f.to)) return false;
    const sup = e.supplierId && Store.supplier(e.supplierId);
    return !q || (e.description + ' ' + e.category + ' ' + (sup ? sup.name : '')).toLowerCase().includes(q);
  }).sort((a, b) => (f.status === 'pagas' ? (b.paidAt || '').localeCompare(a.paidAt || '') : a.due.localeCompare(b.due)));
  const m = U.monthRange();
  const stats = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
    ${stat('A pagar', U.money(Expenses.openTotal(s)), 'Todas em aberto', 'text-orange-600')}
    ${stat('Atrasadas', U.money(Expenses.lateTotal(s)), 'Vencimento já passou', Expenses.lateTotal(s) > 0 ? 'text-red-600' : 'text-zinc-900')}
    ${stat('Vence em 7 dias', U.money(U.sum(all.filter(e => !e.paidAt && e.due >= today && e.due <= U.addDays(7)), e => e.amount)), 'Próximos pagamentos')}
    ${stat('Pago no mês', U.money(U.sum(all.filter(e => e.paidAt && Finance.inRange(e.paidAt, m.from, m.to)), e => e.amount)), 'Saídas deste mês')}</div>`;
  box.innerHTML = stats + `<div class="card overflow-hidden">${list.length ? list.map(e => {
    const st = Expenses.status(e), sup = e.supplierId && Store.supplier(e.supplierId), sg = e.segmentId && Store.seg(e.segmentId);
    return `<div class="grid grid-cols-2 md:grid-cols-12 gap-x-4 gap-y-1 items-center px-4 py-3 border-t border-zinc-100 first:border-t-0">
      <div class="md:col-span-5 min-w-0"><div class="font-medium text-zinc-900 truncate">${U.esc(e.description)}${e.repeat === 'monthly' ? ` <span class="text-xs text-indigo-600" title="Repete todo mês">${icon('repeat', 'w-3.5 h-3.5 inline')}</span>` : ''}</div>
        <div class="text-xs text-zinc-500 truncate flex items-center gap-1.5">${sg ? segDot(sg) : ''}${U.esc(e.category)}${sup ? ' · ' + U.esc(sup.name) : ''}</div></div>
      <div class="md:col-span-2 text-sm text-right md:text-left">${e.paidAt ? `Pago ${U.fmtDate(e.paidAt)}` : `Vence ${U.fmtDate(e.due)}`}</div>
      <div class="md:col-span-2">${badge(st, Expenses.STYLE[st])}</div>
      <div class="md:col-span-1 text-right font-semibold tabular-nums ${e.paidAt ? 'text-zinc-700' : 'text-orange-600'}">${U.money(e.amount)}</div>
      <div class="col-span-2 md:col-span-2 flex gap-1 justify-end">${e.paidAt ? `<button class="btn btn-ghost btn-sm" data-action="exp-unpay" data-id="${e.id}">Desfazer pgto</button>` : `<button class="btn btn-primary btn-sm" data-action="exp-pay" data-id="${e.id}">Pagar</button>`}
        <button class="btn btn-ghost btn-sm" data-action="exp-edit" data-id="${e.id}" aria-label="Editar">${icon('edit')}</button>
        <button class="btn btn-ghost btn-sm text-red-600" data-action="exp-del" data-id="${e.id}" aria-label="Excluir">${icon('trash')}</button></div></div>`;
  }).join('') : emptyState('Nenhuma despesa aqui', 'Lance aluguel, compras, energia e outras contas para ver o resultado real do mês.', `<button class="btn btn-primary" data-action="exp-new">${icon('plus')} Nova despesa</button>`)}</div>`;
};

const ExpenseForm = {
  open(id, preset = {}) {
    const e = id ? Store.data.expenses.find(x => x.id === id) : Object.assign({ description: '', category: Store.data.expenseCategories[0], supplierId: '', segmentId: sid() === 'all' ? '' : sid(), amount: '', due: U.today(), repeat: 'none', paidAt: '', method: 'Pix', notes: '' }, preset);
    const root = Modal.open({ title: id ? 'Editar despesa' : 'Nova despesa', size: 'max-w-lg',
      body: `<div class="grid grid-cols-2 gap-4">
        <div class="col-span-2"><label class="label">Descrição da despesa</label><input class="input" name="description" value="${U.esc(e.description)}" placeholder="Ex.: Aluguel da loja, compra de fios"></div>
        <div class="col-span-2 sm:col-span-1"><label class="label">Categoria da despesa</label><div class="flex gap-2"><select class="input" name="category">${opts(Store.data.expenseCategories.map(c => [c, c]), e.category)}</select><button class="btn btn-secondary" data-action="expcat-add" aria-label="Nova categoria">${icon('plus')}</button></div></div>
        <div class="col-span-2 sm:col-span-1"><label class="label">Fornecedor</label><div class="flex gap-2"><select class="input" name="supplierId">${opts([['', 'Nenhum'], ...Store.data.suppliers.map(s => [s.id, s.name])], e.supplierId)}</select><button class="btn btn-secondary" data-action="sup-quick" aria-label="Novo fornecedor">${icon('plus')}</button></div></div>
        <div><label class="label">Valor da despesa</label>${numInput('name="expAmount"', e.amount)}</div>
        <div><label class="label">Vencimento</label><input type="date" class="input" name="due" value="${e.due}"></div>
        <div class="col-span-2"><label class="label">Segmento</label><select class="input" name="segmentId">${opts([['', 'Geral (todos os segmentos)'], ...Store.data.segments.map(s => [s.id, s.name])], e.segmentId || '')}</select></div>
        ${id ? '' : `<label class="col-span-2 flex items-center gap-2 text-sm"><input type="checkbox" name="repeat" class="w-4 h-4 rounded" ${e.repeat === 'monthly' ? 'checked' : ''}> Repete todo mês (cria as próximas sozinho)</label>`}
        <label class="col-span-2 flex items-center gap-2 text-sm"><input type="checkbox" name="isPaid" class="w-4 h-4 rounded" ${e.paidAt ? 'checked' : ''}> Já está paga</label>
        <div class="${e.paidAt ? '' : 'hidden'} col-span-2 grid grid-cols-2 gap-4" id="exp-paid">
          <div><label class="label">Pago em</label><input type="date" class="input" name="paidAt" value="${e.paidAt || U.today()}"></div>
          <div><label class="label">Forma</label><select class="input" name="method">${opts(METHODS.map(m => [m, m]), e.method || 'Pix')}</select></div></div>
        <div class="col-span-2"><label class="label">Observações</label><input class="input" name="notes" value="${U.esc(e.notes || '')}"></div></div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="exp-save">Salvar despesa</button>`,
      onMount: r => r.addEventListener('input', ev => { if (ev.target.name === 'isPaid') $('#exp-paid', r).classList.toggle('hidden', !ev.target.checked); }) });
    root._id = id || null; root._preset = preset;
  },
  save(el) {
    const root = el.closest('[data-modal]'); if (!Validate.form(root)) return;
    const f = formData(root), old = root._id ? Store.data.expenses.find(x => x.id === root._id) : null;
    const rec = Object.assign(old ? U.clone(old) : { id: U.uid('exp'), createdAt: U.now() }, {
      description: f.description.trim(), category: f.category, supplierId: f.supplierId, segmentId: f.segmentId,
      amount: Pricing.r2(U.num(f.expAmount) || 0), due: f.due, paidAt: f.isPaid ? (f.paidAt || U.today()) : '', method: f.isPaid ? f.method : '', notes: (f.notes || '').trim()
    });
    if (!old && f.repeat) { rec.repeat = 'monthly'; rec.repeatGroup = U.uid('rg'); rec.repeatDay = Number(f.due.slice(8, 10)); }
    if (!old && !f.repeat) rec.repeat = 'none';
    if (root._preset && root._preset.purchase) rec.purchase = root._preset.purchase;
    Expenses.save(rec); Modal.closeFrom(el); Toast.show('Despesa salva.', 'success');
    if (root._preset && root._preset.after) root._preset.after(rec); else Router.render();
  },
  pay(id) {
    const e = Store.data.expenses.find(x => x.id === id); if (!e) return;
    const root = Modal.open({ title: 'Pagar despesa', size: 'max-w-sm',
      body: `<p class="text-sm text-zinc-600 mb-3">${U.esc(e.description)} · <strong>${U.money(e.amount)}</strong></p>
        <div class="grid grid-cols-2 gap-3"><div><label class="label">Pago em</label><input type="date" class="input" name="paidAt" value="${U.today()}"></div>
        <div><label class="label">Forma</label><select class="input" name="method">${opts(METHODS.map(m => [m, m]), 'Pix')}</select></div></div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="exp-pay-save">Confirmar pagamento</button>` });
    root._id = id;
  },
  paySave(el) {
    const root = el.closest('[data-modal]'), f = formData(root), e = Store.data.expenses.find(x => x.id === root._id);
    e.paidAt = f.paidAt || U.today(); e.method = f.method;
    Store.save(); Expenses.materialize(); Modal.closeFrom(el); Toast.show('Despesa paga.', 'success'); Router.render();
  },
  del(id) {
    const e = Store.data.expenses.find(x => x.id === id); if (!e) return;
    const remove = all => {
      Undo.capture();
      if (all) {
        Store.data.expenses.forEach(x => { if (x.repeatGroup === e.repeatGroup) x.stopped = true; });
        Store.data.expenses = Store.data.expenses.filter(x => !(x.repeatGroup === e.repeatGroup && !x.paidAt && x.due >= e.due));
      } else Store.data.expenses = Store.data.expenses.filter(x => x.id !== id);
      Store.save(); Router.render(); Undo.offer(all ? 'Despesa e próximas excluídas.' : 'Despesa excluída.');
    };
    if (e.repeat === 'monthly' && !e.stopped) {
      Modal.confirm({ title: 'Excluir despesa que se repete', danger: true, confirmLabel: 'Esta e as próximas', cancelLabel: 'Só esta',
        message: `“${U.esc(e.description)}” repete todo mês. Excluir só esta ou esta e as próximas (parar de repetir)?`,
        onConfirm: () => remove(true), onCancel: () => remove(false) });
    } else Modal.confirm({ title: 'Excluir despesa', danger: true, confirmLabel: 'Excluir', message: `Excluir “${U.esc(e.description)}”?`, onConfirm: () => remove(false) });
  }
};

/* FLUXO DE CAIXA REAL: entradas − saídas no período + previsão dos próximos 30 dias */
LIST.caixa = () => {
  const box = $('#list-caixa'); if (!box) return;
  const f = UI.f.caixa, s = sid();
  const sum = Finance.summary(s, f.from, f.to), mv = Finance.movements(s, f.from, f.to);
  const byDay = {};
  mv.forEach(m => { const g = byDay[m.date] || (byDay[m.date] = { in: 0, out: 0, n: 0 }); if (m.amount >= 0) g.in += m.amount; else g.out -= m.amount; g.n++; });
  const days = Object.keys(byDay).sort().reverse();
  /* previsão: o que vence nos próximos 30 dias (inclui atrasados) */
  const today = U.today(), lim = U.addDays(30), weeks = [0, 1, 2, 3, 4].map(i => ({ from: U.addDays(i * 7 - (i === 0 ? 3650 : 0)), to: U.addDays(i * 7 + 6), label: i === 0 ? 'Até 7 dias (inclui atrasados)' : `${U.fmtDate(U.addDays(i * 7)).slice(0, 5)} a ${U.fmtDate(U.addDays(Math.min(30, i * 7 + 6))).slice(0, 5)}`, in: 0, out: 0 }));
  Finance.scoped(s).forEach(d => Finance.openInstallments(d).forEach(x => { const due = x.due || today; if (due > lim) return; const w = weeks.find(w => due <= w.to) || weeks[0]; w.in += x.open; }));
  Store.data.expenses.filter(e => !e.paidAt && (s === 'all' || !e.segmentId || e.segmentId === s) && e.due <= lim).forEach(e => { const w = weeks.find(w => e.due <= w.to) || weeks[0]; w.out += e.amount; });
  const fIn = U.sum(weeks, w => w.in), fOut = U.sum(weeks, w => w.out);
  const segs = s === 'all' ? Store.data.segments : [Store.seg(s)].filter(Boolean);
  const methods = Object.entries(sum.byMethod).filter(([, v]) => Math.abs(v) > 0.004);
  box.innerHTML = `
    <p class="text-sm text-zinc-500 mb-3">Período: <strong class="text-zinc-800">${U.fmtDate(f.from)}</strong> a <strong class="text-zinc-800">${U.fmtDate(f.to)}</strong></p>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      ${stat('Entradas', U.money(sum.grossIn), 'Pix, dinheiro e cartão recebidos', 'text-emerald-700')}
      ${stat('Saídas', U.money(sum.spent + sum.refunded), `Despesas ${U.money(sum.spent)} · devoluções ${U.money(sum.refunded)}`, 'text-red-600')}
      ${stat('Saldo do período', U.money(sum.net), 'Entradas − saídas', sum.net < 0 ? 'text-red-600' : 'text-zinc-900')}
      ${stat('Faturado no período', U.money(sum.billed), `Lucro bruto estimado ${U.money(sum.profit)}`)}
    </div>
    <div class="card overflow-hidden mt-6"><div class="px-4 py-4 flex flex-wrap items-center justify-between gap-2"><h2 class="font-semibold text-zinc-900">Previsão dos próximos 30 dias</h2>
      <span class="text-sm tabular-nums ${fIn - fOut < 0 ? 'text-red-600' : 'text-emerald-700'}">Saldo previsto ${U.money(fIn - fOut)}</span></div>
      ${weeks.map(w => { const max = Math.max(1, ...weeks.map(x => Math.max(x.in, x.out))); return `<div class="px-4 py-3 border-t border-zinc-100 text-sm">
        <div class="flex justify-between gap-2"><span class="text-zinc-600">${w.label}</span><span class="tabular-nums"><span class="text-emerald-700">+${U.money(w.in)}</span> · <span class="text-red-600">−${U.money(w.out)}</span></span></div>
        <div class="mt-1.5 space-y-1"><div class="h-1.5 rounded-full bg-emerald-500/80" style="width:${Math.max(w.in / max * 100, w.in > 0 ? 2 : 0)}%"></div><div class="h-1.5 rounded-full bg-red-400/80" style="width:${Math.max(w.out / max * 100, w.out > 0 ? 2 : 0)}%"></div></div></div>`; }).join('')}
      <p class="px-4 pb-4 pt-1 text-xs text-zinc-500">Entradas = parcelas e saldos a receber pelo vencimento. Saídas = contas a pagar em aberto.</p></div>
    <div class="card overflow-hidden mt-6"><div class="px-4 py-4"><h2 class="font-semibold text-zinc-900">Por dia</h2></div>
      ${days.length ? days.map(day => { const g = byDay[day]; return `<div class="flex items-center justify-between gap-3 px-4 py-3 border-t border-zinc-100 text-sm">
        <div class="min-w-0"><div class="font-medium">${U.fmtDate(day)} <span class="text-zinc-400 font-normal">· ${U.weekday(day)} · ${g.n} movimento(s)</span></div>
          <div class="text-xs tabular-nums"><span class="text-emerald-700">+${U.money(g.in)}</span> <span class="text-red-600">−${U.money(g.out)}</span></div></div>
        <div class="font-semibold tabular-nums ${g.in - g.out < 0 ? 'text-red-600' : 'text-emerald-700'}">${U.money(g.in - g.out)}</div></div>`; }).join('')
        : '<div class="px-4 pb-6 text-sm text-zinc-500">Nenhum movimento no período.</div>'}</div>
    <div class="card p-5 mt-6"><h2 class="font-semibold text-zinc-900 mb-3">Entradas por forma de pagamento</h2>
      ${methods.length ? `<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${methods.map(([m, v]) => `<div class="rounded-xl bg-zinc-50 px-3 py-2"><p class="text-xs text-zinc-500">${U.esc(m)}</p><p class="font-semibold tabular-nums">${U.money(v)}</p></div>`).join('')}</div>` : '<p class="text-sm text-zinc-500">Nenhum recebimento no período.</p>'}</div>
    <div class="card overflow-hidden mt-6"><div class="px-4 py-4"><h2 class="font-semibold text-zinc-900">Por segmento</h2></div>
      ${segs.map(sg => { const x = Finance.summary(sg.id, f.from, f.to); return `<div class="px-4 py-3 border-t border-zinc-100 text-sm">
        <div class="flex items-center gap-2 font-medium min-w-0">${segDot(sg)}<span class="truncate">${U.esc(sg.name)}</span></div>
