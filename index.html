  /* ---- Ordem de serviço completa ---- */
  osCard() {
    const o = this.draft.os, sig = o.signature && Photos.get(o.signature);
    const dt = (label, f) => `<div><label class="label">${label}</label><input type="date" class="input" data-os="${f}" value="${o[f] || ''}"></div>`;
    return `<div class="card p-5">
      <h2 class="font-semibold text-zinc-900 mb-4">Ordem de serviço</h2>
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2 sm:col-span-1"><label class="label">Equipamento</label><input class="input" data-os="equipment" value="${U.esc(o.equipment)}" placeholder="Ex.: Quadro de distribuição, chuveiro"></div>
        <div class="col-span-2 sm:col-span-1"><label class="label">Nº de série / identificação</label><input class="input" data-os="serial" value="${U.esc(o.serial)}" placeholder="Opcional"></div>
        <div class="col-span-2"><label class="label">Defeito relatado</label><textarea class="input" rows="2" data-os="defect" placeholder="O que o cliente disse que está acontecendo">${U.esc(o.defect)}</textarea></div>
        <div class="col-span-2 sm:col-span-1"><label class="label">Responsável (técnico)</label><input class="input" data-os="responsible" value="${U.esc(o.responsible)}" placeholder="Quem vai executar"></div>
        <div class="col-span-2 sm:col-span-1"><label class="label">Garantia (dias)</label>${numInput('data-os="warrantyDays"', o.warrantyDays, 'int')}</div>
        ${dt('Entrada', 'entryDate')}${dt('Previsão de entrega', 'forecastDate')}${dt('Conclusão', 'doneDate')}
      </div>
      <div class="mt-5">
        <div class="flex items-center justify-between mb-2"><h3 class="text-sm font-semibold text-zinc-900">Checklist</h3>
          <button class="btn btn-secondary btn-sm" data-action="os-check-add">${icon('plus')} Item</button></div>
        <div id="os-check" class="space-y-2">${this.checklistHtml()}</div>
      </div>
      <div class="mt-5">
        <h3 class="text-sm font-semibold text-zinc-900 mb-2">Assinatura do cliente</h3>
        <div id="os-sig">${sig ? `<div class="rounded-xl border border-zinc-200 p-3 bg-white"><img src="${sig}" alt="Assinatura" class="max-h-24 mx-auto">
          <p class="text-xs text-zinc-500 text-center mt-1">${U.esc(o.signedBy || '')}${o.signedAt ? ' · ' + U.fmtDateTime(o.signedAt) : ''}</p></div>
          <div class="flex gap-2 mt-2"><button class="btn btn-secondary btn-sm" data-action="os-sign">${icon('edit')} Assinar de novo</button><button class="btn btn-ghost btn-sm text-red-600" data-action="os-sign-clear">Apagar assinatura</button></div>`
          : `<button class="btn btn-secondary" data-action="os-sign">${icon('edit')} Colher assinatura na tela</button><p class="text-xs text-zinc-500 mt-1">O cliente assina com o dedo. A assinatura sai no PDF da OS.</p>`}</div>
      </div>
    </div>`;
  },
  checklistHtml() {
    const list = this.draft.os.checklist;
    return list.length ? list.map((c, i) => `<div class="flex items-center gap-2">
        <input type="checkbox" class="w-5 h-5 rounded shrink-0" data-os-check="${i}" ${c.done ? 'checked' : ''} aria-label="Concluído">
        <input class="input !py-1.5" data-os-text="${i}" value="${U.esc(c.text)}" placeholder="Etapa ou conferência">
        <button class="btn btn-ghost btn-sm text-red-600" data-action="os-check-del" data-i="${i}" aria-label="Remover">${icon('trash')}</button></div>`).join('')
      : '<p class="text-sm text-zinc-500">Nenhum item. Use “+ Item” para criar a lista de conferência.</p>';
  },
  openSignature() {
    const root = Modal.open({ title: 'Assinatura do cliente', size: 'max-w-xl',
      body: `<p class="text-sm text-zinc-500 mb-2">Peça para o cliente assinar com o dedo no quadro abaixo.</p>
        <canvas class="sig-pad w-full h-48 rounded-xl border border-zinc-300" id="sig-canvas"></canvas>
        <div class="mt-3"><label class="label">Nome de quem assinou</label><input class="input" name="signedBy" value="${U.esc(docWho(this.draft))}"></div>`,
      footer: `<button class="btn btn-secondary" data-action="sig-clear">Limpar</button><button class="btn btn-primary" data-action="sig-save">Salvar assinatura</button>`,
      onMount: r => {
        const c = $('#sig-canvas', r), ctx = c.getContext('2d');
        const fit = () => { const w = c.clientWidth, h = c.clientHeight, k = window.devicePixelRatio || 1; c.width = w * k; c.height = h * k; ctx.setTransform(k, 0, 0, k, 0, 0); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; };
        requestAnimationFrame(fit);
        let draw = false; c._ink = false;
        const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
        c.addEventListener('pointerdown', e => { draw = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.1, y + 0.1); ctx.stroke(); c._ink = true; });
        c.addEventListener('pointermove', e => { if (!draw) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => c.addEventListener(t, () => { draw = false; }));
        r._clear = () => { ctx.clearRect(0, 0, c.width, c.height); c._ink = false; };
      } });
    return root;
  },
  saveSignature(el) {
    const root = el.closest('[data-modal]'), c = $('#sig-canvas', root);
    if (!c._ink) return Toast.show('Peça para o cliente assinar antes de salvar.', 'error');
    const o = this.draft.os, id = 'sig_' + this.draft.id;
    /* recorta para fundo branco e reduz: PNG leve para o PDF */
    const out = document.createElement('canvas'); out.width = c.width; out.height = c.height;
    const x = out.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, out.width, out.height); x.drawImage(c, 0, 0);
    Photos.put(id, out.toDataURL('image/png'));
    o.signature = id; o.signedAt = U.now(); o.signedBy = formData(root).signedBy.trim();
    Docs.event(this.draft, 'assinatura', o.signedBy);
    Modal.closeFrom(el);
    this.persistNow('Assinatura salva.');
  },

  timelineHtml() {
    const ev = (this.draft.events || []).slice().reverse();
    return ev.length ? `<ol class="relative border-l border-zinc-200 ml-1.5 space-y-3">${ev.map(e => `<li class="ml-4">
        <span class="absolute -left-[5px] mt-1.5 w-2.5 h-2.5 rounded-full ${e.type === 'cancelado' || e.type === 'recusado' ? 'bg-red-400' : e.type === 'pagamento' ? 'bg-emerald-500' : 'bg-indigo-400'}"></span>
        <p class="text-sm text-zinc-800"><span class="font-medium">${U.esc(EVENT_LABEL[e.type] || e.type)}</span>${e.note ? ' — ' + U.esc(e.note) : ''}</p>
        <p class="text-xs text-zinc-500">${U.fmtDateTime(e.at)}</p></li>`).join('')}</ol>` : '<p class="text-sm text-zinc-500">Sem registros ainda.</p>';
  },

  clientOptions(sel) {
    return opts([['', 'Sem cliente / consumidor'], ...Store.data.clients.slice().sort((a, b) => a.name.localeCompare(b.name, 'pt')).map(c => [c.id, c.name])], sel !== undefined ? sel : this.draft.clientId);
  },

  mount() {
    $('#main').classList.add('has-bottom-bar');
    this.renderItems(); this.renderPhotos(); this.renderInstallments(); this.refreshSummary(); this.renderPayments(true);
  },

  /* ---- Fotos ---- */
  renderPhotos() {
    const box = $('#photos-box'); if (!box) return;
    const list = this.draft.photos || [];
    box.innerHTML = list.length ? list.map(ph => `
      <div class="rounded-xl border border-zinc-200 overflow-hidden bg-white">
        <div class="relative">${Photos.get(ph.id) ? `<img src="${Photos.get(ph.id)}" alt="Foto do local" class="w-full h-28 object-cover">` : '<div class="w-full h-28 bg-zinc-100 flex items-center justify-center text-xs text-zinc-400">Foto indisponível</div>'}
          <button class="absolute top-1.5 right-1.5 btn btn-sm bg-white/90 text-red-600 shadow-sm" data-action="ed-photo-del" data-id="${ph.id}" aria-label="Remover foto">${icon('trash')}</button></div>
        <input class="w-full px-2.5 py-2 text-xs border-t border-zinc-200 focus:outline-none" data-photo-cap="${ph.id}" placeholder="Legenda (opcional)" value="${U.esc(ph.caption || '')}">
      </div>`).join('')
      : `<div class="col-span-full rounded-xl border border-dashed border-zinc-300 p-6 text-center text-sm text-zinc-500">Nenhuma foto. Toque em “Adicionar fotos” para tirar ou escolher imagens do local.</div>`;
  },
  async addPhotos(files) {
    const d = this.draft, room = 12 - d.photos.length;
    if (room <= 0) return Toast.show('Limite de 12 fotos por documento.', 'error');
    const list = files.filter(f => f.type.startsWith('image/')).slice(0, room);
    if (files.length > room) Toast.show(`Só ${room} foto(s) couberam no limite de 12.`, 'info');
    let n = 0;
    for (const f of list) {
      try { const data = await Photos.fromFile(f, 1280, 'image/jpeg', 0.78); const id = U.uid('ph'); Photos.put(id, data); d.photos.push({ id, caption: '' }); n++; }
      catch (e) { Toast.show(`Não foi possível ler "${f.name}".`, 'error'); }
    }
    if (n) { this.dirty = true; this.renderPhotos(); Toast.show(`${n} foto(s) adicionada(s). Salve o documento para manter.`, 'success'); }
  },
  rerender() { const host = $('#main > div'); host.innerHTML = this.shell(); this.mount(); },

  /* ---- Itens ---- */
  hintHtml(it, i) {
    const parts = [];
    const sug = Pricing.suggest(it.cost, it.baseMargin);
    if (Math.abs(sug - it.price) >= 0.005) parts.push(`Sugerido: ${U.money(sug)} (margem ${U.pct(it.baseMargin)}). <button class="text-indigo-600 hover:underline" data-action="ed-restore" data-idx="${i}">Usar sugestão</button>`);
    if (this.draft.kind !== 'orcamento' && it.productId) {
      const p = Store.product(it.productId);
      if (p && p.stock != null) {
        const short = Stock.shortages(this.draft.items, this.draft).find(x => x.product.id === p.id);
        parts.push(short ? `<span class="text-amber-700">Estoque insuficiente: disponível ${U.n2(short.avail)} ${U.esc(p.unit)}.</span>` : `<span class="text-zinc-400">Em estoque: ${U.n2(p.stock + ((this.draft.stockSnapshot || []).find(s => s.productId === p.id) || { qty: 0 }).qty)} ${U.esc(p.unit)}</span>`);
      }
    }
    return parts.join('<br>');
  },
  itemRow(it, i) {
    const f = (label, field, val, mode = 'dec', help = '') => `<div class="min-w-0"><label class="label" ${help ? `data-hk="${help}"` : ''}>${label}</label>${numInput(`data-item="${i}" data-f="${field}"`, val, mode)}</div>`;
    return `
    <div class="rounded-xl border border-zinc-200 p-3" data-row="${i}">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-medium text-zinc-500">${U.esc(typeLabel(it.type))}${it.productId ? '' : ' · avulso'}</span>
        <button class="btn btn-ghost btn-sm text-red-600" data-action="ed-del-item" data-idx="${i}" aria-label="Remover item">${icon('trash')}</button>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-6 gap-3">
        <div class="col-span-2 sm:col-span-6"><label class="label">Descrição</label><input class="input" data-item="${i}" data-f="name" value="${U.esc(it.name)}" placeholder="Descreva o item"></div>
        <div class="min-w-0"><label class="label">Unidade</label><select class="input" data-item="${i}" data-f="unit">${unitOpts(it.unit)}</select></div>
        ${f('Qtd.', 'qty', it.qty, 'q', 'quantidade')}
        ${f('Custo un.', 'cost', it.cost, 'dec', 'custo unit')}
        ${f('Margem %', 'margin', it.margin, 'dec', 'margem %')}
        ${f('Preço un.', 'price', it.price, 'dec', 'preço unit')}
        <div class="min-w-0"><label class="label">Total</label><div class="px-1 py-2 text-sm font-semibold tabular-nums" data-total>${U.money(Pricing.lineTotal(it))}</div></div>
      </div>
      <p class="text-xs text-zinc-500 mt-2 min-h-[1rem]" data-hint>${this.hintHtml(it, i)}</p>
    </div>`;
  },
  renderItems() {
    const box = $('#items-box'); if (!box) return;
    const d = this.draft, tab = this.tab;
    const mats = d.items.filter(i => !isSvc(i)), svcs = d.items.filter(isSvc);
    const tabBtn = (k, label, list) => `<button class="btn btn-sm ${tab === k ? 'bg-white shadow-sm text-zinc-900' : 'text-zinc-600'}" data-action="ed-tab" data-tab="${k}">${label} <span class="text-xs text-zinc-400">${list.length}</span></button>`;
    $('#items-tabs').innerHTML = tabBtn('material', 'Materiais', mats) + tabBtn('servico', 'Serviços e mão de obra', svcs);
    $('#items-actions').innerHTML = tab === 'material'
      ? `<button class="btn btn-secondary btn-sm" data-action="ed-add-catalog">${icon('box')} Do catálogo</button>
         <button class="btn btn-secondary btn-sm" data-action="ed-add-free" data-type="material">${icon('plus')} Material avulso</button>`
      : `<button class="btn btn-secondary btn-sm" data-action="ed-add-catalog">${icon('box')} Do catálogo</button>
         <button class="btn btn-secondary btn-sm" data-action="ed-add-hour">${icon('plus')} Mão de obra (hora)</button>
         <button class="btn btn-secondary btn-sm" data-action="ed-add-free" data-type="servico">${icon('plus')} Serviço avulso</button>`;
    const rows = d.items.map((it, i) => [it, i]).filter(([it]) => isSvc(it) === (tab === 'servico'));
    box.innerHTML = rows.length ? rows.map(([it, i]) => this.itemRow(it, i)).join('')
      : `<div class="rounded-xl border border-dashed border-zinc-300 p-8 text-center text-sm text-zinc-500">${tab === 'material' ? 'Nenhum material ainda. Adicione do catálogo ou crie um material avulso.' : 'Nenhum serviço ainda. Adicione do catálogo, mão de obra por hora ou um serviço avulso.'}</div>`;
    const s = $('[data-doc="segmentId"]'); if (s) s.disabled = d.items.length > 0;
    this.renderStockWarn();
  },
  renderStockWarn() {
    const box = $('#stock-warn'); if (!box) return;
    const d = this.draft;
    const short = d.kind === 'orcamento' || isCancelled(d.status) ? [] : Stock.shortages(d.items, d);
    box.innerHTML = short.length ? `<div class="mb-3 rounded-xl bg-amber-50 text-amber-800 text-sm px-4 py-3">${icon('alert', 'w-4 h-4 inline -mt-0.5')} Estoque insuficiente: ${short.map(x => `${U.esc(prodName(x.product))} (precisa ${U.n2(x.need)}, tem ${U.n2(x.avail)})`).join('; ')}. Você pode salvar mesmo assim; o estoque ficará negativo quando concluir.</div>` : '';
  },
  syncRow(i, except) {
    const it = this.draft.items[i], row = $(`[data-row="${i}"]`); if (!row) return;
    ['cost', 'margin', 'price'].forEach(f => { if (f === except) return; const el = $(`[data-f="${f}"]`, row); if (el) el.value = numVal(it[f]); });
    $('[data-total]', row).textContent = U.money(Pricing.lineTotal(it));
    $('[data-hint]', row).innerHTML = this.hintHtml(it, i);
  },
  addItem(it) {
    this.tab = isSvc(it) ? 'servico' : 'material';
    const ex = it.productId ? this.draft.items.findIndex(x => x.productId === it.productId) : -1;
    if (ex >= 0) this.draft.items[ex].qty += 1; else this.draft.items.push(it);
    this.renderItems();
    this.dirty = true; this.refreshSummary();
  },
  onItem(t) {
    const i = +t.dataset.item, f = t.dataset.f, it = this.draft.items[i]; if (!it) return;
    this.dirty = true;
    if (f === 'name' || f === 'unit') { it[f] = t.value; return; }
    Pricing.applyChange(it, f, t.value);
    this.syncRow(i, f); this.refreshSummary();
    if (f === 'qty') { this.renderStockWarn(); $$('[data-row]').forEach(r => { const k = +r.dataset.row; if (k !== i) { const h = $('[data-hint]', r); if (h) h.innerHTML = this.hintHtml(this.draft.items[k], k); } }); }
  },
  onDocField(t) {
    const k = t.dataset.doc, d = this.draft; this.dirty = true;
    if (k === 'discount') { d.discount = Math.max(0, U.num(t.value) || 0); d.autoDiscount = false; }
    else if (k === 'finalOverride') d.finalOverride = t.value === '' ? null : Math.max(0, U.num(t.value) || 0);
    else if (k === 'status') { this.onStatus(t); return; }
    else d[k] = t.type === 'checkbox' ? t.checked : t.value;
    if (k === 'discountType') d.autoDiscount = false;
    if (k === 'clientId') { this.applyClientDiscount(); this.renderPayments(true); }
    if (k === 'date' && d.kind === 'orcamento') {
      const n = Number(Store.data.company.validDays) || 0, vu = $('[data-doc="validUntil"]');
      if (n && vu && d.date) { d.validUntil = U.addDaysTo(d.date, n); vu.value = d.validUntil; }
    }
    if (['discount', 'discountType', 'finalOverride'].includes(k)) { this.refreshSummary(); this.renderInstallments(); }
    if (Print.live) Print.refresh();
  },
  onOsField(t) {
    const o = this.draft.os; this.dirty = true;
    if (t.dataset.os !== undefined) { const f = t.dataset.os; o[f] = f === 'warrantyDays' ? Math.max(0, Math.round(U.num(t.value) || 0)) : t.value; }
    else if (t.dataset.osCheck !== undefined) o.checklist[+t.dataset.osCheck].done = t.checked;
    else if (t.dataset.osText !== undefined) o.checklist[+t.dataset.osText].text = t.value;
  },

  /* ---- Status com fluxo ---- */
  onStatus(t) {
    const d = this.draft, prev = d.status, next = t.value;
    const revert = () => { t.value = prev; };
    if (isCancelled(next) && !isCancelled(prev)) {
      const kept = Finance.keptPaid(d);
      if (kept > 0.004 && Docs.exists(d.id)) return this.cancelPaid(next, kept, revert);
      d.status = next; this.afterStatus(prev);
      return;
    }
    if (d.kind === 'orcamento' && ['Rascunho', 'Enviado'].includes(next) && d.validUntil && d.validUntil < U.today()) {
      Toast.show('A validade deste orçamento já passou. Escolha uma nova data em “Válido até”, senão ele volta a ficar Expirado.', 'warn');
    }
    d.status = next;
    this.afterStatus(prev);
  },
  afterStatus(prev) {
    const d = this.draft;
    $('#ed-reject') && $('#ed-reject').classList.toggle('hidden', d.status !== 'Recusado');
    if (d.kind === 'os' && isDone(d.status) && !d.os.doneDate) { d.os.doneDate = U.today(); const el = $('[data-os="doneDate"]'); if (el) el.value = d.os.doneDate; }
    this.renderStockWarn(); this.refreshSummary(); this.renderPayments(true);
    if (prev !== d.status && isDone(d.status)) {
      const short = Stock.shortages(d.items, d);
      if (short.length) Toast.show('Atenção: há itens sem estoque suficiente. Ao salvar, o estoque ficará negativo.', 'warn');
    }
  },
  /* Cancelar documento que já tem dinheiro recebido: devolver ou virar crédito do cliente. */
  cancelPaid(next, kept, revert) {
    const d = this.draft, hasClient = !!d.clientId;
    const root = Modal.open({ title: 'Cancelar documento pago', size: 'max-w-md',
      body: `<p class="text-sm text-zinc-600">Este documento tem <strong>${U.money(kept)}</strong> recebidos. Ao cancelar, o que acontece com esse dinheiro?</p>
        <div class="mt-4 space-y-3">
          <label class="flex gap-3 rounded-xl border border-zinc-200 p-3 cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50/50"><input type="radio" name="how" value="refund" checked class="mt-1">
            <span><span class="block text-sm font-medium">Devolver ao cliente (estorno)</span><span class="block text-xs text-zinc-500">Sai do caixa hoje como devolução.</span></span></label>
          <label class="flex gap-3 rounded-xl border border-zinc-200 p-3 ${hasClient ? 'cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50/50' : 'opacity-50'}"><input type="radio" name="how" value="credit" ${hasClient ? '' : 'disabled'} class="mt-1">
            <span><span class="block text-sm font-medium">Deixar como crédito do cliente</span><span class="block text-xs text-zinc-500">${hasClient ? 'O valor fica a favor dele para usar numa próxima compra.' : 'Precisa ter um cliente cadastrado no documento.'}</span></span></label>
          <div><label class="label">Forma da devolução</label><select class="input" name="method">${opts(METHODS.map(m => [m, m]), (d.payments[0] || {}).method || 'Pix')}</select></div>
          <div><label class="label">Motivo do cancelamento</label><input class="input" name="reason" placeholder="Opcional"></div>
        </div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Não cancelar</button><button class="btn bg-red-600 text-white hover:bg-red-700" data-action="ed-cancel-paid">Cancelar documento</button>`,
      onClose: () => { if (!root._done) revert(); } });
    root._next = next; root._kept = kept;
  },
  confirmCancelPaid(el) {
    const root = el.closest('[data-modal]'), f = formData(root), d = this.draft, kept = root._kept, prev = d.status;
    const r = { id: U.uid('rf'), date: U.today(), at: U.now(), goods: 0, cashBack: 0, toCredit: 0, method: f.method, reason: f.reason.trim() || 'Cancelamento', items: [], kind: 'cancel' };
    if (f.how === 'credit' && d.clientId) { r.toCredit = kept; r.method = 'Crédito'; Finance.addCredit(d.clientId, kept, `Crédito do cancelamento de ${d.number}`, d.id); }
    else r.cashBack = kept;
    d.refunds.push(r);
    d.status = root._next;
    Docs.event(d, 'cancelado', (r.toCredit ? `Valor de ${U.money(kept)} virou crédito do cliente` : `Devolvido ${U.money(kept)} em ${r.method}`) + (f.reason ? ` — ${f.reason}` : ''));
    root._done = true; Modal.closeFrom(el);
    if (this.save(true)) { Toast.show('Documento cancelado.', 'success'); this.rerender(); }
    else d.status = prev;
  },

  /* desconto fixo do cliente (ex.: plano mensal): entra sozinho ao escolher o cliente */
  applyClientDiscount() {
    const d = this.draft, c = Store.client(d.clientId), pct = c ? Number(c.discountPct) || 0 : 0, wasAuto = !!d.autoDiscount;
    if (wasAuto) { d.discount = 0; d.discountType = 'percent'; d.discountLabel = ''; d.autoDiscount = false; }
    if (pct > 0) {
      if (Number(d.discount) > 0) Toast.show(`Este cliente tem desconto fixo de ${U.pct(pct)}, mas já existe um desconto neste documento. Nada foi alterado.`, 'info');
      else { d.discountType = 'percent'; d.discount = pct; d.discountLabel = c.discountLabel || 'Desconto do cliente'; d.autoDiscount = true; Toast.show(`Desconto fixo de ${U.pct(pct)} do cliente aplicado.`, 'success'); }
    }
    const di = $('#ed-discount'), dt = $('[data-doc="discountType"]'), dl = $('[data-doc="discountLabel"]');
    if (di) di.value = numVal(d.discount || ''); if (dt) dt.value = d.discountType; if (dl) dl.value = d.discountLabel || '';
    this.refreshSummary();
  },

  /* ---- Resumo ---- */
  refreshSummary() {
    const d = this.draft, t = Pricing.totals(d), net = Finance.netTotal(d), adj = Pricing.r2(net - t.total);
    const set = (id, v) => { const el = $('#' + id); if (el) el.textContent = v; };
    set('sum-subtotal', U.money(t.subtotal));
    set('sum-mat', U.money(U.sum(d.items.filter(i => !isSvc(i)), i => Pricing.lineTotal(i))));
    set('sum-svc', U.money(U.sum(d.items.filter(i => isSvc(i)), i => Pricing.lineTotal(i))));
    set('sum-computed', U.money(t.computed));
    set('sum-total', U.money(net)); set('bar-total', U.money(net));
    set('sum-adj', (adj > 0 ? '+ ' : '− ') + U.money(Math.abs(adj)));
    const ar = $('#sum-adj-row'); if (ar) ar.classList.toggle('hidden', Math.abs(adj) < 0.005);
    set('sum-cost', U.money(t.cost));
    set('sum-profit', U.money(t.profit));
    set('sum-markup', U.pct(t.markup));
    set('sum-margin', U.pct(t.marginOnSale));
    const p = $('#sum-profit'); if (p) p.className = 'font-medium ' + (t.profit < 0 ? 'text-red-600' : 'text-emerald-700');
    set('sum-note', d.discountType === 'total'
      ? (t.hasOverride ? `Total final de ${U.money(t.total)}: desconto efetivo de ${U.money(t.effectiveDiscount)}.` : 'Modo “Total”: digite o valor final que quer cobrar.')
      : (t.effectiveDiscount > 0 ? `Desconto aplicado: ${U.money(t.effectiveDiscount)}${d.discountType === 'percent' ? ' (' + U.pct(d.discount) + ')' : ''}.` : ''));
    const di = $('#ed-discount'); if (di) di.placeholder = { percent: '0', value: '0,00', total: 'Valor final' }[d.discountType] || '0';
    this.renderPayments(false);
  },

  /* ---- Parcelas e vencimento ---- */
  renderInstallments() {
    const box = $('#inst-box'); if (!box) return;
    const d = this.draft;
    if (d.kind === 'orcamento') {
      box.innerHTML = '';
      return;
    }
    if (!d.installments.length) {
      box.innerHTML = `<div class="grid grid-cols-2 gap-4">
        <div class="col-span-2 sm:col-span-1"><label class="label">Vencimento do pagamento</label><input type="date" class="input" data-doc="dueDate" value="${d.dueDate || ''}"><p class="text-xs text-zinc-500 mt-1">Opcional. Usado em “A receber” para avisar quando atrasar.</p></div>
        <div class="col-span-2 sm:col-span-1 sm:pt-5"><button class="btn btn-secondary w-full" data-action="inst-open">${icon('calendar')} Dividir em parcelas</button></div></div>`;
      return;
    }
    const sch = Finance.schedule(d);
    box.innerHTML = `<div class="flex items-center justify-between mb-2"><h3 class="text-sm font-semibold text-zinc-900">Parcelas</h3>
        <div class="flex gap-2"><button class="btn btn-secondary btn-sm" data-action="inst-open">${icon('edit')} Refazer</button><button class="btn btn-ghost btn-sm text-red-600" data-action="inst-clear">Remover</button></div></div>
      <div class="rounded-xl border border-zinc-200 divide-y divide-zinc-100">${sch.map((x, i) => `<div class="grid grid-cols-12 gap-2 items-center px-3 py-2 text-sm">
        <div class="col-span-2 text-zinc-500">${x.n}ª</div>
        <div class="col-span-5"><input type="date" class="input !py-1.5" data-inst="${i}" data-if="due" value="${x.due}" aria-label="Vencimento da parcela ${x.n}"></div>
        <div class="col-span-5">${numInput(`data-inst="${i}" data-if="amount" aria-label="Valor da parcela ${x.n}" style="padding-top:.375rem;padding-bottom:.375rem"`, x.amount)}</div>
        <div class="col-span-12 text-xs ${x.open <= 0.004 ? 'text-emerald-700' : x.due && x.due < U.today() ? 'text-red-600' : 'text-zinc-500'}">${x.open <= 0.004 ? 'Paga' : x.paid > 0 ? `Pago ${U.money(x.paid)} · falta ${U.money(x.open)}` : x.due && x.due < U.today() ? 'Atrasada' : 'Em aberto'}</div></div>`).join('')}</div>
      <p class="text-xs text-zinc-500 mt-2" id="inst-sum"></p>`;
    this.instSum();
  },
  instSum() {
    const el = $('#inst-sum'); if (!el) return;
    const d = this.draft, s = Pricing.r2(U.sum(d.installments, x => Number(x.amount) || 0)), net = Finance.netTotal(d);
    el.innerHTML = Math.abs(s - net) > 0.009 ? `<span class="text-amber-700">As parcelas somam ${U.money(s)}, mas o total é ${U.money(net)}. A diferença vai para a última parcela.</span>` : `Soma das parcelas: ${U.money(s)}.`;
  },
  onInst(t) {
    const x = this.draft.installments[+t.dataset.inst]; if (!x) return;
    this.dirty = true;
    if (t.dataset.if === 'due') x.due = t.value; else x.amount = Pricing.r2(Math.max(0, U.num(t.value) || 0));
    this.instSum();
  },
  openInstallments() {
    const d = this.draft, net = Finance.netTotal(d);
    if (net <= 0) return Toast.show('Adicione itens antes de parcelar.', 'error');
    const root = Modal.open({ title: 'Dividir em parcelas', size: 'max-w-md',
      body: `<div class="grid grid-cols-2 gap-3">
        <div><label class="label">Número de parcelas</label>${numInput('name="instN"', 2, 'int')}</div>
        <div><label class="label">1º vencimento</label><input type="date" class="input" name="instFirst" value="${d.dueDate || U.addDays(30)}"></div>
        <div class="col-span-2"><label class="label">Valor de entrada</label>${numInput('name="instDown" placeholder="0,00"', '')}</div>
        <div class="col-span-2"><label class="label">Intervalo</label><select class="input" name="instEvery">${opts([['month', 'Todo mês, no mesmo dia'], ['15', 'A cada 15 dias'], ['7', 'Toda semana']], 'month')}</select></div>
        <p class="col-span-2 text-sm text-zinc-500" id="inst-prev"></p></div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="inst-make">Criar parcelas</button>`,
      onMount: r => { const upd = () => { const p = this.planInstallments(formData(r)); $('#inst-prev', r).textContent = p ? p.map(x => `${x.n}ª ${U.fmtDate(x.due)}: ${U.money(x.amount)}`).join(' · ') : ''; }; r.addEventListener('input', upd); upd(); } });
    return root;
  },
  /* divide em partes iguais em centavos; a sobra de arredondamento vai na última parcela */
  planInstallments(f) {
    const net = Finance.netTotal(this.draft), n = Math.round(U.num(f.instN) || 0), down = Math.max(0, U.num(f.instDown) || 0);
    if (n < 1 || n > 60 || !f.instFirst || down >= net) return null;
    const rest = Pricing.r2(net - down), base = Math.floor(rest / n * 100) / 100;
    const list = [];
    if (down > 0) list.push({ id: U.uid('in'), n: 1, due: this.draft.date || U.today(), amount: Pricing.r2(down) });
    for (let i = 0; i < n; i++) {
      const due = f.instEvery === 'month' ? U.addMonthsTo(f.instFirst, i) : U.addDaysTo(f.instFirst, i * Number(f.instEvery));
      list.push({ id: U.uid('in'), n: list.length + 1, due, amount: i === n - 1 ? Pricing.r2(rest - base * (n - 1)) : base });
    }
    return list;
  },
  makeInstallments(el) {
    const root = el.closest('[data-modal]'), f = formData(root), list = this.planInstallments(f);
    if (!list) return Toast.show('Confira: de 1 a 60 parcelas, 1º vencimento preenchido e entrada menor que o total.', 'error');
    this.draft.installments = list; this.draft.dueDate = list[0].due; this.dirty = true;
    Docs.event(this.draft, 'parcelas', `${list.length} parcela(s)`);
    Modal.closeFrom(el); this.renderInstallments(); this.renderPayments(true);
    Toast.show('Parcelas criadas. Salve o documento para manter.', 'success');
  },

  /* ---- Pagamentos ---- */
  renderPayments(force) {
    const box = $('#pay-box'); if (!box) return;
    if (!force && box.contains(document.activeElement)) return;
    const d = this.draft;
    if (d.kind === 'orcamento') {
      const pix = Pix.enabled() && Finance.total(d) > 0;
      box.innerHTML = `<h2 class="font-semibold text-zinc-900">Pagamentos</h2>
        <p class="text-sm text-zinc-500 mt-2">Ficam disponíveis depois que o orçamento for convertido em pedido ou ordem de serviço.</p>
        ${pix ? `<p class="text-xs text-zinc-500 mt-3">O PDF e a mensagem de envio levam o QR Code Pix com o valor do orçamento.</p>` : ''}`;
      return;
    }
    if (isCancelled(d.status)) {
      box.innerHTML = `<div class="flex items-center justify-between"><h2 class="font-semibold text-zinc-900">Pagamentos</h2>${statusBadge(d.status)}</div>
        ${this.paymentRows(d)}${this.refundRows(d)}
        <p class="text-sm text-zinc-500 mt-3">Documento cancelado: não entra mais em “A receber”.</p>`;
      return;
    }
    const net = Finance.netTotal(d), kept = Finance.keptPaid(d), bal = Finance.balance(d), st = Finance.payStatus(d);
    const credit = d.clientId ? Finance.creditBalance(d.clientId) : 0;
    const late = Finance.isOverdue(d) ? Finance.lateFee(d) : 0;
    const methods = METHODS.map(m => [m, m]); if (credit > 0.004) methods.push(['Crédito', `Crédito do cliente (${U.money(credit)})`]);
    box.innerHTML = `
      <div class="flex items-center justify-between"><h2 class="font-semibold text-zinc-900">Pagamentos</h2>${payBadge(st)}</div>
      <div class="grid grid-cols-2 gap-3 mt-4">
        <div class="rounded-xl bg-emerald-50 px-3 py-2"><p class="text-xs text-emerald-700">Recebido</p><p class="font-semibold tabular-nums text-emerald-800">${U.money(kept)}</p></div>
        <div class="rounded-xl bg-orange-50 px-3 py-2"><p class="text-xs text-orange-700">Pendente</p><p class="font-semibold tabular-nums text-orange-700">${U.money(bal)}</p></div>
      </div>
      ${Finance.overpaid(d) > 0.004 ? `<p class="mt-3 rounded-xl bg-amber-50 text-amber-800 text-xs px-3 py-2">Recebido ${U.money(Finance.overpaid(d))} a mais que o total. Use “Devolver itens” ou registre a devolução do valor.</p>` : ''}
      ${late > 0.004 ? `<div class="mt-3 rounded-xl bg-red-50 text-red-800 text-xs px-3 py-2">Em atraso há ${Finance.daysLate(d)} dia(s). Multa + juros pelas regras de Configurações: <strong>${U.money(late)}</strong>.
        <button class="underline font-medium ml-1" data-action="ed-add-fee">Cobrar</button></div>` : ''}
      ${this.paymentRows(d)}${this.refundRows(d)}${this.feeRows(d)}
      ${bal > 0.004 && net > 0 ? `
      <div class="mt-3 pt-3 border-t border-zinc-100 grid grid-cols-2 gap-3">
        <div><label class="label">Valor</label>${numInput('id="pay-amount"', bal)}</div>
        <div><label class="label">Forma</label><select class="input" id="pay-method">${opts(methods, 'Pix')}</select></div>
        <div class="col-span-2"><label class="label">Data</label><input type="date" class="input" id="pay-date" value="${U.today()}"></div>
        <button class="btn btn-primary col-span-2" data-action="ed-add-payment">Registrar pagamento</button>
        ${Pix.enabled() ? `<button class="btn btn-secondary col-span-2" data-action="ed-pix">${icon('qr')} Mostrar QR Code Pix</button>` : ''}
      </div>` : ''}`;
  },
  paymentRows(d) {
    return d.payments.length ? `<div class="mt-3">${d.payments.map(p => `
      <div class="flex items-center justify-between gap-2 py-2 border-t border-zinc-100 text-sm">
        <div class="min-w-0"><div class="font-medium tabular-nums">${U.money(p.amount)}</div><div class="text-xs text-zinc-500">${U.esc(p.method)} · ${U.fmtDate(p.date)}${p.note ? ' · ' + U.esc(p.note) : ''}</div></div>
        <div class="flex shrink-0"><button class="btn btn-ghost btn-sm" data-action="ed-pay-receipt" data-id="${p.id}" aria-label="Recibo deste pagamento" title="Recibo">${icon('receipt')}</button>
        <button class="btn btn-ghost btn-sm text-red-600" data-action="ed-del-payment" data-id="${p.id}" aria-label="Remover pagamento">${icon('trash')}</button></div>
      </div>`).join('')}</div>` : '';
  },
  refundRows(d) {
    return d.refunds.length ? `<div class="mt-3"><p class="text-xs font-medium text-zinc-500">Devoluções</p>${d.refunds.map(r => `
      <div class="flex items-center justify-between gap-2 py-2 border-t border-zinc-100 text-sm">
        <div class="min-w-0"><div class="text-xs text-zinc-700">${r.goods > 0 ? `Mercadoria ${U.money(r.goods)}` : U.esc(r.reason || 'Cancelamento')}${r.items && r.items.length ? ' · ' + r.items.map(i => `${U.n2(i.qty)}× ${U.esc(i.name)}`).join(', ') : ''}</div>
          <div class="text-xs text-zinc-500">${U.fmtDate(r.date)}${r.cashBack > 0 ? ` · devolvido ${U.money(r.cashBack)} em ${U.esc(r.method)}` : ''}${r.toCredit > 0 ? ` · ${U.money(r.toCredit)} em crédito` : ''}</div></div>
      </div>`).join('')}</div>` : '';
  },
  feeRows(d) {
    return (d.fees || []).length ? `<div class="mt-3"><p class="text-xs font-medium text-zinc-500">Multa e juros cobrados</p>${d.fees.map(f => `
      <div class="flex items-center justify-between gap-2 py-2 border-t border-zinc-100 text-sm"><div class="text-xs text-zinc-700">${U.money(f.amount)} · ${U.fmtDate(f.date)}</div>
      <button class="btn btn-ghost btn-sm text-red-600" data-action="ed-del-fee" data-id="${f.id}" aria-label="Remover multa">${icon('trash')}</button></div>`).join('')}</div>` : '';
  },
  addPayment() {
    const d = this.draft;
    if (!Validate.form($('#pay-box'))) return;
    const amt = U.num($('#pay-amount').value) || 0, method = $('#pay-method').value, date = $('#pay-date').value || U.today();
    if (!d.items.length) return Toast.show('Adicione itens antes de registrar pagamentos.', 'error');
    if (amt <= 0) return Toast.show('Informe um valor maior que zero.', 'error');
    if (amt > Finance.balance(d) + 0.004) return Toast.show('O valor é maior que o saldo pendente.', 'error');
    if (method === 'Crédito' && amt > Finance.creditBalance(d.clientId) + 0.004) return Toast.show('O cliente não tem crédito suficiente.', 'error');
    const p = Finance.addPayment(d, { amount: amt, method, date });
    Docs.event(d, 'pagamento', `${U.money(amt)} em ${method}`);
    if (this.save(true)) {
      Toast.show('Pagamento registrado.', 'success', { label: 'Recibo', fn: () => Print.receipt(Docs.get(d.id), p.id) });
      this.renderPayments(true); this.renderInstallments(); this.refreshTimeline(); this.updateBadge();
    } else d.payments.pop();
  },
  removePayment(id) {
    const d = this.draft;
    const own = d.payments.find(x => x.id === id);
    if (own && own.batchId) {
      const lot = Store.data.batches.find(b => b.id === own.batchId);
      return Toast.show(`Este pagamento faz parte do lote ${lot ? lot.number : ''}. Para desfazer, estorne o lote inteiro em Financeiro › A receber › Lotes recebidos.`, 'error', null, 6500);
    }
    Undo.capture();
    const p = Finance.removePayment(d, id); if (!p) return;
    Docs.event(d, 'pagamento-removido', `${U.money(p.amount)} em ${p.method}`);
    if (Docs.exists(d.id)) this.save(true);
    this.renderPayments(true); this.renderInstallments(); this.refreshTimeline();
    Undo.offer('Pagamento removido.');
  },
  addFee() {
    const d = this.draft, v = Finance.lateFee(d); if (v <= 0) return;
    d.fees.push({ id: U.uid('fee'), date: U.today(), amount: v, note: `Atraso de ${Finance.daysLate(d)} dia(s)` });
    Docs.event(d, 'multa', U.money(v));
    this.persistNow('Multa e juros adicionados ao total.');
  },
  /* grava agora, mantendo o que já foi digitado (usado por ações de dinheiro e assinatura) */
  persistNow(msg) {
    if (!Docs.exists(this.draft.id)) { this.dirty = true; this.rerender(); return Toast.show(msg + ' Salve o documento para manter.', 'success'); }
    if (this.save(true)) { this.rerender(); Toast.show(msg, 'success'); }
  },
  refreshTimeline() { const b = $('#timeline-box'); if (b) b.innerHTML = this.timelineHtml(); },
  updateBadge() { const b = $('#ed-status-badge'); if (b && Docs.exists(this.draft.id)) b.innerHTML = statusBadge(this.draft.status); },

  /* ---- Devolução de itens (venda concluída) ---- */
  openReturn() {
    const d = this.draft, t = Pricing.totals(d), ratio = t.subtotal > 0 ? t.total / t.subtotal : 1;
    const ret = {}; d.refunds.forEach(r => (r.items || []).forEach(i => { ret[i.itemId] = (ret[i.itemId] || 0) + i.qty; }));
    const rows = d.items.map((it, i) => ({ it, i, max: Math.max(0, Pricing.r2(it.qty - (ret[it.id] || 0))), unit: Pricing.r2(it.price * ratio) })).filter(x => x.max > 0);
    if (!rows.length) return Toast.show('Todos os itens já foram devolvidos.', 'info');
    const root = Modal.open({ title: `Devolver itens — ${d.number}`, size: 'max-w-lg',
      body: `<p class="text-sm text-zinc-500 mb-3">Informe quanto de cada item voltou. O valor já considera o desconto da venda.</p>
        <div class="space-y-2">${rows.map(x => `<div class="grid grid-cols-12 gap-2 items-center">
          <div class="col-span-7 text-sm min-w-0"><div class="truncate font-medium">${U.esc(x.it.name)}</div><div class="text-xs text-zinc-500">${U.money(x.unit)} cada · até ${U.n2(x.max)}</div></div>
          <div class="col-span-5">${numInput(`data-ret="${x.i}" data-max="${x.max}" data-unit="${x.unit}" placeholder="0"`, '', 'q')}</div></div>`).join('')}</div>
        <div class="mt-4 rounded-xl bg-zinc-50 px-3 py-2 text-sm flex justify-between"><span>Valor da mercadoria devolvida</span><strong id="ret-goods">R$ 0,00</strong></div>
        <div class="mt-3 grid grid-cols-2 gap-3" id="ret-money"></div>
        <div class="mt-3"><label class="label">Motivo</label><input class="input" name="reason" placeholder="Ex.: defeito, tamanho errado"></div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="ret-save">Registrar devolução</button>`,
      onMount: r => { r.addEventListener('input', e => { if (e.target.dataset.ret !== undefined) this.returnPreview(r); }); this.returnPreview(r); } });
    return root;
  },
  returnCalc(root) {
    const d = this.draft; let goods = 0; const items = [];
    $$('[data-ret]', root).forEach(inp => {
      const q = Math.min(Number(inp.dataset.max), Math.max(0, U.num(inp.value) || 0)); if (!q) return;
      const it = d.items[+inp.dataset.ret];
      goods += q * Number(inp.dataset.unit);
      items.push({ itemId: it.id, productId: it.productId || '', name: it.name, qty: q });
    });
    goods = Pricing.r2(goods);
    /* se o cliente já pagou mais do que passa a dever, a diferença precisa voltar (dinheiro ou crédito) */
    const after = Pricing.r2(Finance.netTotal(d) - goods), back = Math.max(0, Pricing.r2(Finance.keptPaid(d) - after));
    return { goods, items, back };
  },
  returnPreview(root) {
    const c = this.returnCalc(root), d = this.draft;
    $('#ret-goods', root).textContent = U.money(c.goods);
    const box = $('#ret-money', root);
    const cur = formData(root);
    box.innerHTML = c.back > 0.004 ? `<p class="col-span-2 text-sm text-zinc-600">O cliente já pagou: é preciso devolver <strong>${U.money(c.back)}</strong>.</p>
      <div><label class="label">Como devolver</label><select class="input" name="retHow">${opts([['cash', 'Dinheiro de volta'], ...(d.clientId ? [['credit', 'Crédito do cliente']] : [])], cur.retHow || 'cash')}</select></div>
      <div><label class="label">Forma</label><select class="input" name="retMethod">${opts(METHODS.map(m => [m, m]), cur.retMethod || 'Pix')}</select></div>`
      : (c.goods > 0 ? '<p class="col-span-2 text-sm text-zinc-600">Nada a devolver em dinheiro: o valor só diminui o que o cliente deve.</p>' : '');
  },
  saveReturn(el) {
    const root = el.closest('[data-modal]'), d = this.draft, c = this.returnCalc(root), f = formData(root);
    if (!c.items.length) return Toast.show('Informe a quantidade devolvida de pelo menos um item.', 'error');
    const r = { id: U.uid('rf'), date: U.today(), at: U.now(), goods: c.goods, cashBack: 0, toCredit: 0, method: f.retMethod || '', reason: (f.reason || '').trim(), items: c.items, kind: 'return' };
    if (c.back > 0.004) {
      if (f.retHow === 'credit' && d.clientId) { r.toCredit = c.back; r.method = 'Crédito'; Finance.addCredit(d.clientId, c.back, `Crédito da devolução em ${d.number}`, d.id); }
      else r.cashBack = c.back;
    }
    d.refunds.push(r);
    c.items.forEach(i => { if (i.productId) Stock.giveBack(d, i.productId, i.qty); });
    Docs.event(d, 'devolucao', `${c.items.map(i => `${U.n2(i.qty)}× ${i.name}`).join(', ')} (${U.money(c.goods)})`);
    Modal.closeFrom(el);
    this.persistNow('Devolução registrada.');
  },

  /* ---- Salvar, converter, duplicar, excluir ---- */
  save(silent) {
    const d = this.draft;
    if (!silent && !Validate.form($('#main'), '#pay-box')) return false;
    if (!d.items.length) { Toast.show('Adicione pelo menos um item antes de salvar.', 'error'); return false; }
    if (d.items.some(i => !String(i.name).trim())) { Toast.show('Todos os itens precisam de uma descrição.', 'error'); return false; }
    const wasNew = !Docs.exists(d.id);
    if (d.status === 'Recusado' && !Docs.get(d.id)?.rejectReason && d.rejectReason) Docs.event(d, 'recusado', d.rejectReason);
    const saved = Docs.save(d);
    this.draft = Docs.normalize(U.clone(saved)); this.dirty = false;
    history.replaceState(null, '', '#/doc/' + d.id); Router.current = location.hash;
    if (wasNew) this.rerender();
    else {
      const t = $('#ed-title'); if (t) t.innerHTML = `${KINDS[d.kind].label} <span class="text-zinc-400">${U.esc(d.number)}</span> <span id="ed-status-badge">${statusBadge(d.status)}</span>`;
      this.refreshTimeline(); this.renderItems();
    }
    if (!silent) Toast.show(`${KINDS[d.kind].label} ${d.number} salvo.`, 'success');
    return true;
  },
  convert(toKind) {
    if (!this.save(true)) return;
    const nd = Docs.convert(Docs.get(this.draft.id), toKind);
    this.dirty = false;
    Toast.show(`Criado ${KINDS[toKind].label} ${nd.number}. O orçamento ficou como “Convertido”.`, 'success');
    location.hash = '#/doc/' + nd.id;
  },
  duplicate() {
    const go = () => { this.pending = Docs.duplicate(this.draft); this.dirty = false; location.hash = '#/doc/draft'; Toast.show('Cópia criada. Revise e salve.', 'success'); };
    if (this.dirty) Modal.confirm({ title: 'Duplicar', message: 'Há alterações não salvas. A cópia será feita com o que está na tela, e este documento não será salvo.', confirmLabel: 'Duplicar assim', onConfirm: go });
    else go();
  },

  /* ---- Seletor de catálogo ---- */
  openPicker() {
    const seg = Store.seg(this.draft.segmentId);
    const wantSvc = this.tab === 'servico';
    const prods = Store.data.products.filter(p => !p.hasVariants && p.segmentId === seg.id && isSvc(p) === wantSvc).sort((a, b) => prodName(a).localeCompare(prodName(b), 'pt'));
    Modal.open({
      title: (wantSvc ? 'Serviços — ' : 'Materiais — ') + seg.name, size: 'max-w-xl',
      body: `<input class="input mb-3" placeholder="Buscar item ou categoria" id="picker-q"><div id="picker-list" class="divide-y divide-zinc-100"></div>`,
      footer: `<button class="btn btn-primary" data-action="modal-close">Concluir</button>`,
      onMount: root => {
        const render = () => {
          const q = $('#picker-q', root).value.trim().toLowerCase();
          const list = prods.filter(p => (prodName(p) + ' ' + p.category).toLowerCase().includes(q));
          $('#picker-list', root).innerHTML = list.length ? list.map(p => `
            <button class="w-full text-left py-3 flex items-center justify-between gap-3 hover:bg-zinc-50 px-2 rounded-lg" data-action="ed-pick" data-id="${p.id}">
              <span class="min-w-0"><span class="block text-sm font-medium truncate">${U.esc(prodName(p))}</span><span class="block text-xs text-zinc-500">${U.esc(p.category)} · ${U.esc(typeLabel(p.type))}${p.stock != null ? ` · <span class="${p.stock <= 0 ? 'text-red-600' : ''}">estoque ${U.n2(p.stock)}</span>` : ''}</span></span>
              <span class="text-sm font-semibold tabular-nums">${U.money(Pricing.productPrice(p, seg))}</span></button>`).join('')
            : emptyState('Nenhum item encontrado', 'Cadastre itens na aba Catálogo deste segmento.');
        };
        $('#picker-q', root).addEventListener('input', render); render();
      }
    });
  }
};

/* ============================================================
   11. IMPRESSÃO: PDF A4, via do técnico, recibo e cupom de bobina
   Como funciona: o HTML do documento vai para #print-root, o corpo da página
   ganha uma classe que esconde o app na impressão e chamamos window.print().
   O tamanho do papel (@page) é trocado na hora: A4 ou bobina de 58/80 mm.
   Nada aqui mostra custo ou margem. Todos são documentos NÃO fiscais.
   ============================================================ */
const Extenso = {
  u: ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'],
  d: ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'],
  c: ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'],
  ate999(n) {
    if (n === 100) return 'cem';
    const c = Math.floor(n / 100), r = n % 100, parts = [];
    if (c) parts.push(this.c[c]);
    if (r < 20 && r) parts.push(this.u[r]);
    else if (r) { parts.push(this.d[Math.floor(r / 10)] + (r % 10 ? ' e ' + this.u[r % 10] : '')); }
    return parts.join(' e ');
  },
  inteiro(n) {
    if (n === 0) return 'zero';
    const grupos = [], nomes = [['', ''], ['mil', 'mil'], ['milhão', 'milhões'], ['bilhão', 'bilhões']];
    let i = 0;
    while (n > 0 && i < nomes.length) {
      const g = n % 1000;
      if (g) {
        let t = i === 1 && g === 1 ? 'mil' : this.ate999(g) + (i ? ' ' + (g === 1 ? nomes[i][0] : nomes[i][1]) : '');
        grupos.unshift({ t, g, i });
      }
      n = Math.floor(n / 1000); i++;
    }
    return grupos.map((x, k) => {
      if (k === 0) return x.t;
      return (x.i === 0 && (x.g < 100 || x.g % 100 === 0) ? ' e ' : ' ') + x.t;
    }).join('');
  },
  reais(v) {
    const cents = Math.round((Number(v) || 0) * 100), r = Math.floor(cents / 100), c = cents % 100;
    const pr = r ? `${this.inteiro(r)} ${r === 1 ? 'real' : 'reais'}`.replace(/(lhão|lhões) reais$/, '$1 de reais') : '';
    const pc = c ? `${this.inteiro(c)} ${c === 1 ? 'centavo' : 'centavos'}` : '';
    return (pr && pc ? pr + ' e ' + pc : pr || pc || 'zero real');
  }
};

const Print = {

      ${inst}

      ${pix}

  /* ---- Mecânica de impressão ---- */
  setPage(kind) {
