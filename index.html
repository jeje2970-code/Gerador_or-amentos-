<script>
(() => {
'use strict';

/* ============================================================
   1. UTILITÁRIOS
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const U = {
  uid: (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4),
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  money: n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }),
  n2: n => String(Math.round((Number(n) || 0) * 100) / 100),
  pad: n => String(n).padStart(2, '0'),
  iso(d) { return d.getFullYear() + '-' + this.pad(d.getMonth() + 1) + '-' + this.pad(d.getDate()); },
  today() { return this.iso(new Date()); },
  addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return this.iso(d); },
  monthRange() {
    const d = new Date();
    return { from: this.iso(new Date(d.getFullYear(), d.getMonth(), 1)), to: this.iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
  },
  fmtDate(s) { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; },
  weekday(s) { const [y, m, d] = s.split('-').map(Number); return ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][new Date(y, m - 1, d).getDay()]; },
  clone: o => JSON.parse(JSON.stringify(o)),
  sum: (arr, fn) => arr.reduce((s, x) => s + fn(x), 0)
};

const ICONS = {
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
  dollar: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  box: '<line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  sliders: '<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  minus: '<line x1="5" y1="12" x2="19" y2="12"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  printer: '<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  menu: '<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
  back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  swap: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>'
};
const icon = (n, cls = 'w-4 h-4') => `<svg class="${cls} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ============================================================
   2. CONSTANTES DE DOMÍNIO
   ============================================================ */
const KINDS = {
  orcamento: { label: 'Orçamento', prefix: 'ORC' },
  pedido:    { label: 'Pedido de venda', prefix: 'PED' },
  os:        { label: 'Ordem de serviço', prefix: 'OS' },
  pdv:       { label: 'Venda balcão', prefix: 'PDV' }
};
const STATUSES = ['Rascunho', 'Enviado', 'Aprovado', 'Em Andamento', 'Concluído', 'Cancelado'];
const STATUS_STYLE = {
  'Rascunho': 'bg-zinc-100 text-zinc-600 ring-zinc-200',
  'Enviado': 'bg-sky-50 text-sky-700 ring-sky-200',
  'Aprovado': 'bg-emerald-50 text-emerald-700 ring-emerald-200',
  'Em Andamento': 'bg-violet-50 text-violet-700 ring-violet-200',
  'Concluído': 'bg-emerald-100 text-emerald-800 ring-emerald-300',
  'Cancelado': 'bg-red-50 text-red-700 ring-red-200'
};
const PAY_STYLE = {
  'Pago': 'bg-emerald-50 text-emerald-700 ring-emerald-200',
  'Parcial': 'bg-amber-50 text-amber-700 ring-amber-200',
  'Pendente': 'bg-orange-50 text-orange-700 ring-orange-200'
};
const METHODS = ['Pix', 'Dinheiro', 'Cartão'];
const TYPE_LABEL = { material: 'Material', servico: 'Mão de obra / serviço', produto: 'Produto pronto' };
const UNITS = [['un', 'un — unidade'], ['pç', 'pç — peça'], ['kit', 'kit'], ['par', 'par'], ['jogo', 'jogo'], ['cx', 'cx — caixa'], ['pct', 'pct — pacote'],
  ['saco', 'saco'], ['fardo', 'fardo'], ['lata', 'lata'], ['rolo', 'rolo'], ['cento', 'cento'], ['dz', 'dz — dúzia'], ['m', 'm — metro'],
  ['m²', 'm² — metro quadrado'], ['m³', 'm³ — metro cúbico'], ['cm', 'cm — centímetro'], ['kg', 'kg — quilo'], ['g', 'g — grama'], ['L', 'L — litro'],
  ['ml', 'ml — mililitro'], ['h', 'h — hora'], ['dia', 'dia'], ['serv', 'serv — serviço'], ['pt', 'pt — ponto']];
const unitOpts = sel => opts(!sel || UNITS.some(u => u[0] === sel) ? UNITS : [[sel, sel], ...UNITS], sel);
const SEG_COLORS = ['#4f46e5', '#059669', '#d97706', '#0891b2', '#db2777', '#7c3aed', '#475569'];

/* ============================================================
   3. MOTOR DE PRECIFICAÇÃO
   Margem = markup sobre o custo:  preço = custo × (1 + margem/100)
   item.locked = true quando o preço foi digitado à mão (não segue a margem).
   ============================================================ */
const Pricing = {
  r2: n => Math.round((Number(n) || 0) * 100) / 100,
  suggest(cost, margin) { return this.r2(cost * (1 + margin / 100)); },
  marginOf(cost, price) { return cost > 0 ? this.r2((price / cost - 1) * 100) : 0; },
  segMargin(seg, type) { return type === 'servico' ? seg.serviceMargin : seg.materialMargin; },
  productMargin(p, seg) { return p.margin != null ? p.margin : this.segMargin(seg, p.type); },
  productPrice(p, seg) { return p.price != null ? p.price : this.suggest(p.cost, this.productMargin(p, seg)); },

  itemFromProduct(p, seg, qty = 1) {
    const fixed = p.price != null;
    const margin = fixed ? this.marginOf(p.cost, p.price) : this.productMargin(p, seg);
    return { id: U.uid('it'), productId: p.id, name: prodName(p), type: p.type, unit: p.unit, qty, cost: p.cost,
             margin, baseMargin: margin, price: this.productPrice(p, seg), locked: fixed };
  },
  blankItem(seg, type = 'material') {
    const m = this.segMargin(seg, type);
    return { id: U.uid('it'), productId: null, name: '', type, unit: type === 'servico' ? 'serv' : 'un', qty: 1, cost: 0, margin: m, baseMargin: m, price: 0, locked: false };
  },
  hourItem(seg) {
    const m = seg.serviceMargin;
    return { id: U.uid('it'), productId: null, name: 'Mão de obra', type: 'servico', unit: 'h', qty: 1, cost: seg.hourCost,
             margin: m, baseMargin: m, price: this.suggest(seg.hourCost, m), locked: false };
  },
  applyChange(it, field, raw) {
    const n = parseFloat(raw); const v = isNaN(n) ? 0 : n;
    switch (field) {
      case 'qty': it.qty = Math.max(0, v); break;
      case 'cost':
        it.cost = Math.max(0, v);
        if (it.locked) it.margin = this.marginOf(it.cost, it.price); else it.price = this.suggest(it.cost, it.margin);
        break;
      case 'margin': it.margin = Math.max(-99, v); it.locked = false; it.price = this.suggest(it.cost, it.margin); break;
      case 'price': it.price = Math.max(0, v); it.locked = true; it.margin = this.marginOf(it.cost, it.price); break;
    }
  },
  lineTotal(it) { return this.r2(it.qty * it.price); },
  totals(doc) {
    const items = doc.items || [];
    const subtotal = this.r2(U.sum(items, i => this.lineTotal(i)));
    const cost = this.r2(U.sum(items, i => i.qty * i.cost));
    let disc = doc.discountType === 'percent' ? subtotal * (Number(doc.discount) || 0) / 100 : Number(doc.discount) || 0;
    disc = this.r2(Math.min(Math.max(disc, 0), subtotal));
    const computed = this.r2(subtotal - disc);
    const hasOverride = doc.finalOverride !== null && doc.finalOverride !== undefined && doc.finalOverride !== '';
    const total = hasOverride ? this.r2(Math.max(0, Number(doc.finalOverride))) : computed;
    const profit = this.r2(total - cost);
    return {
      subtotal, cost, discount: disc, computed, total, hasOverride,
      effectiveDiscount: this.r2(subtotal - total), profit,
      markup: cost > 0 ? this.r2((total / cost - 1) * 100) : 0,
      marginOnSale: total > 0 ? this.r2(profit / total * 100) : 0
    };
  }
};

/* ============================================================
   4. PERSISTÊNCIA (LocalStorage) + DADOS DE EXEMPLO
   ============================================================ */
const Store = {
  KEY: 'orcapro:v1',
  data: null,
  memoryOnly: false,

  load() {
    let raw = null;
    try { raw = localStorage.getItem(this.KEY); } catch (e) { this.memoryOnly = true; }
    if (raw) { try { this.data = JSON.parse(raw); } catch (e) { this.data = null; } }
    if (!this.data || !Array.isArray(this.data.segments) || !Array.isArray(this.data.documents)) {
      this.data = Seed.build();
    }
    this.migrate();
    this.save();
  },
  migrate() {
    const d = this.data;
    if (!Array.isArray(d.paymentTerms)) d.paymentTerms = Seed.terms();
    d.company = Object.assign(Seed.company(), d.company || {});
  },
  save() {
    if (this.memoryOnly) return;
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); }
    catch (e) { Toast.show('Armazenamento do navegador cheio. Faça um backup e apague dados antigos.', 'error'); }
  },
  nextNumber(kind) {
    const c = this.data.counters; c[kind] = (c[kind] || 0) + 1;
    return KINDS[kind].prefix + '-' + String(c[kind]).padStart(4, '0');
  },
  seg: id => Store.data.segments.find(s => s.id === id),
  client: id => Store.data.clients.find(c => c.id === id),
  product: id => Store.data.products.find(p => p.id === id)
};

/* ============================================================
   5. ESTOQUE E DOCUMENTOS (CRUD)
   Estoque só é movimentado quando o documento é de venda (não orçamento)
   e está "Concluído". O snapshot permite desfazer/refazer sem erro.
   ============================================================ */
/* ============================================================
   FOTOS: ficam no IndexedDB (muito mais espaço que o LocalStorage).
   O documento guarda só o id; os dados vivem num cache em memória.
   ============================================================ */
const Photos = {
  db: null, cache: {},
  init() {
    return new Promise(resolve => {
      const timer = setTimeout(resolve, 2000);
      const done = () => { clearTimeout(timer); resolve(); };
      try {
        if (!window.indexedDB) return done();
        const rq = indexedDB.open('orcapro-photos', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('photos');
        rq.onerror = rq.onblocked = done;
        rq.onsuccess = () => {
          this.db = rq.result;
          const cur = this.db.transaction('photos').objectStore('photos').openCursor();
          cur.onsuccess = e => { const c = e.target.result; if (c) { this.cache[c.key] = c.value; c.continue(); } else done(); };
          cur.onerror = done;
        };
      } catch (e) { done(); }
    });
  },
  get(id) { return this.cache[id] || ''; },
  put(id, data) {
    this.cache[id] = data;
    if (this.db) { try { this.db.transaction('photos', 'readwrite').objectStore('photos').put(data, id); } catch (e) { /* segue só em memória */ } }
  },
  del(id) {
    delete this.cache[id];
    if (this.db) { try { this.db.transaction('photos', 'readwrite').objectStore('photos').delete(id); } catch (e) { /* ignora */ } }
  },
  gc() {
    const used = new Set(['company-logo']);
    Store.data.documents.forEach(d => (d.photos || []).forEach(p => used.add(p.id)));
    Object.keys(this.cache).filter(id => !used.has(id)).forEach(id => this.del(id));
  },
  fromFile(file, max, type, quality) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = reject;
      fr.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
          const ctx = c.getContext('2d');
          if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
          ctx.drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL(type, quality));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
};

const Stock = {
  shouldApply: d => d.kind !== 'orcamento' && d.status === 'Concluído',
  release(d, data = Store.data) {
    if (!d.stockSnapshot) return;
    d.stockSnapshot.forEach(s => {
      const p = data.products.find(x => x.id === s.productId);
      if (p && p.stock != null) p.stock = Math.round((p.stock + s.qty) * 1000) / 1000;
    });
    d.stockSnapshot = null;
  },
  sync(d, data = Store.data) {
    this.release(d, data);
    if (!this.shouldApply(d)) return;
    const snap = [];
    d.items.forEach(i => {
      const p = i.productId && data.products.find(x => x.id === i.productId);
      if (p && p.stock != null) { p.stock = Math.round((p.stock - i.qty) * 1000) / 1000; snap.push({ productId: p.id, qty: i.qty }); }
    });
    d.stockSnapshot = snap;
  }
};

const Docs = {
  blank(kind, segmentId) {
    return { id: U.uid('doc'), kind, number: '', segmentId, clientId: '', date: U.today(),
      status: kind === 'orcamento' ? 'Rascunho' : 'Aprovado', items: [], discount: 0, discountType: 'percent',
      finalOverride: null, notes: '', payments: [], createdAt: new Date().toISOString(), stockSnapshot: null, originNumber: null,
      scope: '', location: '', deadline: '', paymentTerms: '', photos: [], materialMode: 'detailed', showPhotos: true,
      dueDate: '', customerName: '' };
  },
  get: id => Store.data.documents.find(d => d.id === id),
  exists(id) { return !!this.get(id); },
  save(d) {
    if (!d.number) d.number = Store.nextNumber(d.kind);
    Stock.sync(d);
    const list = Store.data.documents, i = list.findIndex(x => x.id === d.id);
    if (i >= 0) list[i] = U.clone(d); else list.unshift(U.clone(d));
    Store.save(); Photos.gc();
  },
  remove(id) {
    const d = this.get(id); if (!d) return;
    Stock.release(d);
    Store.data.documents = Store.data.documents.filter(x => x.id !== id);
    Store.save(); Photos.gc();
  }
};

/* ============================================================
   6. FINANÇAS
   ============================================================ */
const Finance = {
  isBillable: d => d.kind !== 'orcamento' && d.status !== 'Cancelado',
  total: d => Pricing.totals(d).total,
  paid: d => Pricing.r2(U.sum(d.payments || [], p => Number(p.amount) || 0)),
  balance(d) { return this.isBillable(d) ? Math.max(0, Pricing.r2(this.total(d) - this.paid(d))) : 0; },
  payStatus(d) {
    const t = this.total(d), p = this.paid(d);
    if (p >= t - 0.004) return 'Pago';
    return p > 0 ? 'Parcial' : 'Pendente';
  },
  inRange: (date, from, to) => (!from || date >= from) && (!to || date <= to),
  scoped: sid => Store.data.documents.filter(d => sid === 'all' || d.segmentId === sid),
  summary(sid, from, to) {
    let billed = 0, received = 0, pending = 0; const byMethod = {};
    this.scoped(sid).forEach(d => {
      if (this.isBillable(d) && this.inRange(d.date, from, to)) { billed += this.total(d); pending += this.balance(d); }
      (d.payments || []).forEach(p => {
        if (this.inRange(p.date, from, to)) { received += p.amount; byMethod[p.method] = (byMethod[p.method] || 0) + p.amount; }
      });
    });
    return { billed: Pricing.r2(billed), received: Pricing.r2(received), pending: Pricing.r2(pending), byMethod };
  },
  isOverdue(d) { return this.balance(d) > 0.004 && !!d.dueDate && d.dueDate < U.today(); },
  openReceivable(sid) { return Pricing.r2(U.sum(this.scoped(sid), d => this.balance(d))); },
  clientBalance(cid) { return Pricing.r2(U.sum(Store.data.documents.filter(d => d.clientId === cid), d => this.balance(d))); }
};

const Modal = {
  stack: [],
  open({ title, body, footer = '', size = 'max-w-lg', onMount, onClose }) {
    const el = document.createElement('div');
    el.dataset.modal = '1'; el._onClose = onClose;
    el.className = 'no-print fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4';
    el.innerHTML = `
      <div class="absolute inset-0 bg-zinc-900/40" data-action="modal-close"></div>
      <div class="relative w-full ${size} bg-white rounded-t-2xl sm:rounded-2xl shadow-xl max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-100">
          <h2 class="text-base font-semibold text-zinc-900">${U.esc(title)}</h2>
          <button class="btn btn-ghost btn-sm" data-action="modal-close" aria-label="Fechar">${icon('x')}</button>
        </div>
        <div class="px-5 py-4 overflow-y-auto">${body}</div>
        ${footer ? `<div class="px-5 py-3 border-t border-zinc-100 flex flex-wrap justify-end gap-2 bg-zinc-50/60 rounded-b-2xl">${footer}</div>` : ''}
      </div>`;
    $('#modal-root').appendChild(el);
    this.stack.push(el);
    if (onMount) onMount(el);
    return el;
  },
  closeFrom(el) {
    const root = el.closest('[data-modal]');
    if (root) { this.stack = this.stack.filter(x => x !== root); root.remove(); if (root._onClose) root._onClose(); }
  },
  closeTop() { const el = this.stack.pop(); if (el) { el.remove(); if (el._onClose) el._onClose(); } },
  confirm({ title = 'Confirmar', message, confirmLabel = 'Confirmar', danger = false, onConfirm }) {
    const root = this.open({
      title, size: 'max-w-md', body: `<p class="text-sm text-zinc-600">${message}</p>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button>
               <button class="btn ${danger ? 'bg-red-600 text-white hover:bg-red-700' : 'btn-primary'}" data-action="modal-confirm">${U.esc(confirmLabel)}</button>`
    });
    root._onConfirm = onConfirm;
    return root;
  }
};

LIST.docs = () => {
  const f = UI.f.docs, box = $('#list-docs'); if (!box) return;
  const q = f.q.trim().toLowerCase();
  const list = Finance.scoped(sid()).filter(d => {
    if (f.kind !== 'all' && d.kind !== f.kind) return false;
    if (f.status !== 'all' && d.status !== f.status) return false;
    if (f.client !== 'all' && d.clientId !== f.client) return false;
    if (!Finance.inRange(d.date, f.from, f.to)) return false;
    if (q && !(d.number + ' ' + docWho(d)).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  box.innerHTML = list.length ? list.map(docRow).join('')
    : emptyState('Nenhum documento encontrado', 'Ajuste os filtros ou crie um novo orçamento.', `<a href="#/doc/new/orcamento" class="btn btn-primary">${icon('plus')} Novo orçamento</a>`);
};

/* ============================================================
   10. EDITOR DE ORÇAMENTO / PEDIDO / OS
   O "draft" é uma cópia em memória; só vai para o LocalStorage ao salvar.
   Digitação atualiza o DOM de forma cirúrgica (sem recriar os inputs),
   para não perder o foco do cursor.
   ============================================================ */
const Editor = {
  draft: null, dirty: false, active: false, tab: 'material',

  open(id, kind) {
    this.active = true; this.dirty = false; this.tab = 'material';
    if (id === 'new') {
      const s = sid() === 'all' ? Store.data.segments[0].id : sid();
      this.draft = Docs.blank(kind && kind !== 'pdv' && KINDS[kind] ? kind : 'orcamento', s);
      return true;
    }
    const d = Docs.get(id);
    if (!d) { Toast.show('Documento não encontrado.', 'error'); return false; }
    this.draft = U.clone(d);
    if (this.draft.items.length && this.draft.items.every(i => i.type === 'servico')) this.tab = 'servico';
    return true;
  },

  shell() {
    const d = this.draft, k = KINDS[d.kind], exists = Docs.exists(d.id);
    return `
    <div class="flex flex-wrap items-start justify-between gap-3 mb-6">
      <div>
        <a href="#/documentos" data-nav class="text-sm text-zinc-500 hover:text-zinc-900 inline-flex items-center gap-1">${icon('back')} Voltar</a>
        <h1 class="text-2xl font-semibold tracking-tight mt-1" id="ed-title">${k.label} <span class="text-zinc-400">${d.number ? U.esc(d.number) : '(novo)'}</span></h1>
        ${d.originNumber ? `<p class="text-sm text-zinc-500">Convertido do orçamento ${U.esc(d.originNumber)}</p>` : ''}
      </div>
      <div class="flex flex-wrap gap-2 no-print">
        <button class="btn btn-secondary" data-action="ed-print">${icon('printer')} Imprimir</button>
        ${d.kind === 'orcamento' && exists ? `<button class="btn btn-secondary" data-action="ed-convert-open">${icon('swap')} Converter</button>` : ''}
        ${exists ? `<button class="btn btn-danger" data-action="ed-delete">${icon('trash')} Excluir</button>` : ''}
        <button class="btn btn-primary" data-action="ed-save">${icon('check')} Salvar</button>
      </div>
    </div>
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-6 min-w-0">
        <div class="card p-5">
          <div class="grid grid-cols-2 gap-4">
            <div><label class="label">Segmento</label><select class="input" data-doc="segmentId">${opts(Store.data.segments.map(s => [s.id, s.name]), d.segmentId)}</select></div>
            <div><label class="label">Status</label><select class="input" data-doc="status">${opts(STATUSES.map(s => [s, s]), d.status)}</select></div>
            <div class="col-span-2 sm:col-span-1"><label class="label">Cliente</label>
              <div class="flex gap-2"><select class="input" id="ed-client" data-doc="clientId">${this.clientOptions()}</select>
              <button class="btn btn-secondary" data-action="ed-new-client" aria-label="Novo cliente">${icon('plus')}</button></div></div>
            <div class="col-span-2 sm:col-span-1"><label class="label">Data</label><input type="date" class="input" data-doc="date" value="${d.date}"></div>
            <div class="col-span-2"><label class="label">Local do serviço</label><input class="input" data-doc="location" value="${U.esc(d.location || '')}" placeholder="Endereço ou nome do local"></div>
          </div>
        </div>
        <div class="card p-5"><label class="label">Descrição do serviço (o que será feito)</label>
          <textarea class="input" rows="4" data-doc="scope" placeholder="Descreva o que será executado, etapas, garantia...">${U.esc(d.scope || '')}</textarea></div>
        <div class="card p-5">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <h2 class="font-semibold text-zinc-900">Itens</h2>
            <div class="flex flex-wrap gap-2" id="items-actions"></div>
          </div>
          <div id="items-tabs" class="inline-flex flex-wrap rounded-xl bg-zinc-100 p-1 mb-4"></div>
          <div id="items-box" class="space-y-3"></div>
        </div>
        <div class="card p-5">
          <div class="flex items-center justify-between gap-2 mb-4"><div><h2 class="font-semibold text-zinc-900">Fotos do local</h2><p class="text-xs text-zinc-500">Até 12 fotos, reduzidas automaticamente.</p></div>
            <button class="btn btn-secondary btn-sm" data-action="ed-photo-add">${icon('plus')} Adicionar fotos</button></div>
          <input type="file" accept="image/*" multiple class="hidden" id="ed-photo-input">
          <div id="photos-box" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div></div>
        <div class="card p-5">
          <h2 class="font-semibold text-zinc-900 mb-4">Condições e prazo</h2>
          <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2"><label class="label">Condição de pagamento</label>
              <select class="input" data-term-select><option value="">Escolher uma condição cadastrada…</option>${opts(Store.data.paymentTerms.map(t => [t.id, t.name]), '')}</select>
              <p class="text-xs text-zinc-500 mt-1">Cadastre novas em <a href="#/config" data-nav class="text-indigo-600 hover:underline">Configurações</a>.</p></div>
            <div class="col-span-2"><label class="label">Texto que aparece no PDF</label><textarea class="input" rows="2" data-doc="paymentTerms" placeholder="Ex.: 50% de entrada e 50% na conclusão">${U.esc(d.paymentTerms || '')}</textarea></div>
            <div class="col-span-2"><label class="label">Prazo de execução</label><input class="input" data-doc="deadline" value="${U.esc(d.deadline || '')}" placeholder="Ex.: 3 dias úteis após a aprovação"></div>
            <div class="col-span-2"><label class="label">Vencimento do pagamento (opcional)</label><input type="date" class="input" data-doc="dueDate" value="${d.dueDate || ''}"><p class="text-xs text-zinc-500 mt-1">Usado em “A receber” para avisar quando estiver atrasado.</p></div>
          </div></div>
        <div class="card p-5"><label class="label">Observações (aparecem no PDF)</label>
          <textarea class="input" rows="3" data-doc="notes" placeholder="Informações adicionais, garantia, restrições...">${U.esc(d.notes)}</textarea></div>
      </div>
      <div class="space-y-6 lg:sticky lg:top-6 self-start min-w-0">
        <div class="card p-5" id="summary-box">
          <h2 class="font-semibold text-zinc-900 mb-4">Resumo</h2>
          <dl class="space-y-2 text-sm tabular-nums">
            <div class="flex justify-between"><dt class="text-zinc-500">Materiais</dt><dd id="sum-mat"></dd></div>
            <div class="flex justify-between"><dt class="text-zinc-500">Serviços e mão de obra</dt><dd id="sum-svc"></dd></div>
            <div class="flex justify-between border-t border-zinc-100 pt-2"><dt class="text-zinc-500">Subtotal</dt><dd id="sum-subtotal"></dd></div>
            <div class="flex items-center justify-between gap-2"><dt class="text-zinc-500">Desconto</dt>
              <dd class="flex gap-1.5"><select class="input !w-16 !px-2 !py-1.5" data-doc="discountType">${opts([['percent', '%'], ['value', 'R$']], d.discountType)}</select>
              ${numInput('data-doc="discount" style="width:6rem;padding-top:.375rem;padding-bottom:.375rem"', d.discount || '')}</dd></div>
            <div class="flex justify-between"><dt class="text-zinc-500">Total calculado</dt><dd id="sum-computed"></dd></div>
          </dl>
          <div class="mt-4"><label class="label">Ajustar total final manualmente</label>
            <div class="flex gap-2">${numInput('data-doc="finalOverride" id="ed-override" placeholder="Usar valor calculado"', d.finalOverride ?? '')}
            <button class="btn btn-secondary" data-action="ed-clear-override" aria-label="Limpar ajuste">${icon('x')}</button></div>
            <p class="text-xs text-zinc-500 mt-1" id="sum-note"></p></div>
          <div class="mt-4 rounded-xl bg-zinc-900 text-white px-4 py-3 flex items-center justify-between"><span class="text-sm">Total</span><span class="text-xl font-semibold tabular-nums" id="sum-total"></span></div>
          <div class="mt-4 pt-4 border-t border-zinc-100 no-print">
            <p class="text-xs font-medium text-zinc-500 mb-2">Interno (não vai para a impressão)</p>
            <dl class="space-y-1.5 text-sm tabular-nums">
              <div class="flex justify-between"><dt class="text-zinc-500">Custo total</dt><dd id="sum-cost"></dd></div>
              <div class="flex justify-between"><dt class="text-zinc-500">Lucro estimado</dt><dd id="sum-profit" class="font-medium"></dd></div>
              <div class="flex justify-between"><dt class="text-zinc-500">Margem sobre o custo</dt><dd id="sum-markup"></dd></div>
              <div class="flex justify-between"><dt class="text-zinc-500">Margem sobre a venda</dt><dd id="sum-margin"></dd></div>
            </dl>
          </div>
        </div>
        <div class="card p-5" id="pay-box"></div>
      </div>
    </div>`;
  },

  clientOptions(sel) {
    return opts([['', 'Sem cliente / consumidor'], ...Store.data.clients.map(c => [c.id, c.name])], sel !== undefined ? sel : this.draft.clientId);
  },

  mount() { this.renderItems(); this.renderPhotos(); this.refreshSummary(); this.renderPayments(true); },

  /* ---- Fotos ---- */
  renderPhotos() {
    const box = $('#photos-box'); if (!box) return;
    const list = this.draft.photos || [];
    box.innerHTML = list.length ? list.map(ph => `
      <div class="rounded-xl border border-zinc-200 overflow-hidden bg-white">
        <div class="relative">${Photos.get(ph.id) ? `<img src="${Photos.get(ph.id)}" alt="Foto do local" class="w-full h-28 object-cover">` : '<div class="w-full h-28 bg-zinc-100 flex items-center justify-center text-xs text-zinc-400">Foto indisponível</div>'}
          <button class="absolute top-1.5 right-1.5 btn btn-sm bg-white/90 text-red-600 shadow-sm" data-action="ed-photo-del" data-id="${ph.id}" aria-label="Remover foto">${icon('trash')}</button></div>
        <input class="w-full px-2.5 py-2 text-xs border-t border-zinc-200 focus:outline-none" data-photo-cap="${ph.id}" placeholder="Legenda (opcional)" value="${U.esc(ph.caption || '')}">
      </div>`).join('')
      : `<div class="col-span-full rounded-xl border border-dashed border-zinc-300 p-6 text-center text-sm text-zinc-500">Nenhuma foto. Toque em “Adicionar fotos” para tirar ou escolher imagens do local.</div>`;
  },
  async addPhotos(files) {
    const d = this.draft, room = 12 - d.photos.length;
    if (room <= 0) return Toast.show('Limite de 12 fotos por documento.', 'error');
    const list = files.filter(f => f.type.startsWith('image/')).slice(0, room);
    if (files.length > room) Toast.show(`Só ${room} foto(s) couberam no limite de 12.`, 'info');
    let n = 0;
    for (const f of list) {
      try { const data = await Photos.fromFile(f, 1280, 'image/jpeg', 0.78); const id = U.uid('ph'); Photos.put(id, data); d.photos.push({ id, caption: '' }); n++; }
      catch (e) { Toast.show(`Não foi possível ler "${f.name}".`, 'error'); }
    }
    if (n) { this.dirty = true; this.renderPhotos(); Toast.show(`${n} foto(s) adicionada(s). Salve o documento para manter.`, 'success'); }
  },
  rerender() { const host = $('#main > div'); host.innerHTML = this.shell(); this.mount(); },

  /* ---- Itens ---- */
  hintHtml(it, i) {
    const sug = Pricing.suggest(it.cost, it.baseMargin);
    if (Math.abs(sug - it.price) < 0.005) return '';
    return `Sugerido: ${U.money(sug)} (margem ${U.n2(it.baseMargin)}%). <button class="text-indigo-600 hover:underline" data-action="ed-restore" data-idx="${i}">Usar sugestão</button>`;
  },
  itemRow(it, i) {
    const f = (label, field, val, extra = '') => `<div><label class="label">${label}</label>${numInput(`data-item="${i}" data-f="${field}" ${extra}`, U.n2(val))}</div>`;
    return `
    <div class="rounded-xl border border-zinc-200 p-3" data-row="${i}">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-medium text-zinc-500">${TYPE_LABEL[it.type] || 'Item'}${it.productId ? '' : ' · avulso'}</span>
        <button class="btn btn-ghost btn-sm text-red-600" data-action="ed-del-item" data-idx="${i}" aria-label="Remover item">${icon('trash')}</button>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-6 gap-3">
        <div class="col-span-2 sm:col-span-6"><label class="label">Descrição</label><input class="input" data-item="${i}" data-f="name" value="${U.esc(it.name)}" placeholder="Descreva o item"></div>
        <div><label class="label">Unidade</label><select class="input" data-item="${i}" data-f="unit">${unitOpts(it.unit)}</select></div>
        ${f('Quantidade', 'qty', it.qty)}
        ${f('Custo unit.', 'cost', it.cost)}
        ${f('Margem %', 'margin', it.margin)}
        ${f('Preço unit.', 'price', it.price)}
        <div><label class="label">Total</label><div class="px-1 py-2 text-sm font-semibold tabular-nums" data-total>${U.money(Pricing.lineTotal(it))}</div></div>
      </div>
      <p class="text-xs text-zinc-500 mt-2 min-h-[1rem]" data-hint>${this.hintHtml(it, i)}</p>
    </div>`;
  },
  renderItems() {
    const box = $('#items-box'); if (!box) return;
    const d = this.draft, isSvc = it => it.type === 'servico', tab = this.tab;
    const mats = d.items.filter(i => !isSvc(i)), svcs = d.items.filter(isSvc);
    const tabBtn = (k, label, list) => `<button class="btn btn-sm ${tab === k ? 'bg-white shadow-sm text-zinc-900' : 'text-zinc-600'}" data-action="ed-tab" data-tab="${k}">${label} <span class="text-xs text-zinc-400">${list.length}</span></button>`;
    $('#items-tabs').innerHTML = tabBtn('material', 'Materiais', mats) + tabBtn('servico', 'Serviços e mão de obra', svcs);
    $('#items-actions').innerHTML = tab === 'material'
      ? `<button class="btn btn-secondary btn-sm" data-action="ed-add-catalog">${icon('box')} Do catálogo</button>
         <button class="btn btn-secondary btn-sm" data-action="ed-add-free" data-type="material">${icon('plus')} Material avulso</button>`
      : `<button class="btn btn-secondary btn-sm" data-action="ed-add-catalog">${icon('box')} Do catálogo</button>
         <button class="btn btn-secondary btn-sm" data-action="ed-add-hour">${icon('plus')} Mão de obra (hora)</button>
         <button class="btn btn-secondary btn-sm" data-action="ed-add-free" data-type="servico">${icon('plus')} Serviço avulso</button>`;
    const rows = d.items.map((it, i) => [it, i]).filter(([it]) => isSvc(it) === (tab === 'servico'));
    box.innerHTML = rows.length ? rows.map(([it, i]) => this.itemRow(it, i)).join('')
      : `<div class="rounded-xl border border-dashed border-zinc-300 p-8 text-center text-sm text-zinc-500">${tab === 'material' ? 'Nenhum material ainda. Adicione do catálogo ou crie um material avulso.' : 'Nenhum serviço ainda. Adicione do catálogo, mão de obra por hora ou um serviço avulso.'}</div>`;
    const s = $('[data-doc="segmentId"]'); if (s) s.disabled = d.items.length > 0;
  },
  syncRow(i, except) {
    const it = this.draft.items[i], row = $(`[data-row="${i}"]`); if (!row) return;
    ['cost', 'margin', 'price'].forEach(f => { if (f === except) return; const el = $(`[data-f="${f}"]`, row); if (el) el.value = U.n2(it[f]); });
    $('[data-total]', row).textContent = U.money(Pricing.lineTotal(it));
    $('[data-hint]', row).innerHTML = this.hintHtml(it, i);
  },
  addItem(it) {
    this.tab = it.type === 'servico' ? 'servico' : 'material';
    const ex = it.productId ? this.draft.items.findIndex(x => x.productId === it.productId) : -1;
    if (ex >= 0) { this.draft.items[ex].qty += 1; this.renderItems(); }
    else { this.draft.items.push(it); this.renderItems(); }
    this.dirty = true; this.refreshSummary();
  },
  onItem(t) {
    const i = +t.dataset.item, f = t.dataset.f, it = this.draft.items[i]; if (!it) return;
    this.dirty = true;
    if (f === 'name' || f === 'unit') { it[f] = t.value; return; }
    Pricing.applyChange(it, f, t.value);
    this.syncRow(i, f); this.refreshSummary();
  },
  onDocField(t) {
    const k = t.dataset.doc, d = this.draft; this.dirty = true;
    if (k === 'discount') d.discount = Math.max(0, parseFloat(t.value) || 0);
    else if (k === 'finalOverride') d.finalOverride = t.value === '' ? null : Math.max(0, parseFloat(t.value) || 0);
    else d[k] = t.type === 'checkbox' ? t.checked : t.value;
    if (['discount', 'discountType', 'finalOverride', 'status'].includes(k)) this.refreshSummary();
    if (Print.live) Print.refresh();
  },

  /* ---- Resumo ---- */
  refreshSummary() {
    const d = this.draft, t = Pricing.totals(d);
    const set = (id, v) => { const el = $('#' + id); if (el) el.textContent = v; };
    set('sum-subtotal', U.money(t.subtotal));
    set('sum-mat', U.money(U.sum(d.items.filter(i => i.type !== 'servico'), i => Pricing.lineTotal(i))));
    set('sum-svc', U.money(U.sum(d.items.filter(i => i.type === 'servico'), i => Pricing.lineTotal(i))));
    set('sum-computed', U.money(t.computed));
    set('sum-total', U.money(t.total));
    set('sum-cost', U.money(t.cost));
    set('sum-profit', U.money(t.profit));
    set('sum-markup', U.n2(t.markup) + '%');
    set('sum-margin', U.n2(t.marginOnSale) + '%');
    const p = $('#sum-profit'); if (p) p.className = 'font-medium ' + (t.profit < 0 ? 'text-red-600' : 'text-emerald-700');
    set('sum-note', t.hasOverride ? `Total ajustado à mão. Desconto efetivo: ${U.money(t.effectiveDiscount)}.` : 'Deixe vazio para usar o total calculado.');
    this.renderPayments(false);
  },

  /* ---- Pagamentos ---- */
  renderPayments(force) {
    const box = $('#pay-box'); if (!box) return;
    if (!force && box.contains(document.activeElement)) return;
    const d = this.draft;
    if (d.kind === 'orcamento') {
      box.innerHTML = `<h2 class="font-semibold text-zinc-900">Pagamentos</h2>
        <p class="text-sm text-zinc-500 mt-2">Ficam disponíveis depois que o orçamento for convertido em pedido ou ordem de serviço.</p>`;
      return;
    }
    const total = Finance.total(d), paid = Finance.paid(d), bal = Finance.balance(d), st = Finance.payStatus(d);
    const rows = d.payments.map(p => `
      <div class="flex items-center justify-between gap-2 py-2 border-t border-zinc-100 text-sm">
        <div><div class="font-medium tabular-nums">${U.money(p.amount)}</div><div class="text-xs text-zinc-500">${U.esc(p.method)} · ${U.fmtDate(p.date)}${p.note ? ' · ' + U.esc(p.note) : ''}</div></div>
        <button class="btn btn-ghost btn-sm text-red-600" data-action="ed-del-payment" data-id="${p.id}" aria-label="Remover pagamento">${icon('trash')}</button>
      </div>`).join('');
    box.innerHTML = `
      <div class="flex items-center justify-between"><h2 class="font-semibold text-zinc-900">Pagamentos</h2>${payBadge(st)}</div>
      <div class="grid grid-cols-2 gap-3 mt-4">
        <div class="rounded-xl bg-emerald-50 px-3 py-2"><p class="text-xs text-emerald-700">Recebido</p><p class="font-semibold tabular-nums text-emerald-800">${U.money(paid)}</p></div>
        <div class="rounded-xl bg-orange-50 px-3 py-2"><p class="text-xs text-orange-700">Pendente</p><p class="font-semibold tabular-nums text-orange-700">${U.money(bal)}</p></div>
      </div>
      <div class="mt-3">${rows}</div>
      ${bal > 0.004 && total > 0 ? `
      <div class="mt-3 pt-3 border-t border-zinc-100 grid grid-cols-2 gap-3">
        <div><label class="label">Valor</label>${numInput('id="pay-amount"', U.n2(bal))}</div>
        <div><label class="label">Forma</label><select class="input" id="pay-method">${opts(METHODS.map(m => [m, m]), 'Pix')}</select></div>
        <div class="col-span-2"><label class="label">Data</label><input type="date" class="input" id="pay-date" value="${U.today()}"></div>
        <button class="btn btn-primary col-span-2" data-action="ed-add-payment">Registrar pagamento</button>
      </div>` : ''}`;
  },
  addPayment() {
    const d = this.draft;
    const amt = parseFloat($('#pay-amount').value) || 0, method = $('#pay-method').value, date = $('#pay-date').value || U.today();
    if (!d.items.length) return Toast.show('Adicione itens antes de registrar pagamentos.', 'error');
    if (amt <= 0) return Toast.show('Informe um valor maior que zero.', 'error');
    if (amt > Finance.balance(d) + 0.004) return Toast.show('O valor é maior que o saldo pendente.', 'error');
    d.payments.push({ id: U.uid('pay'), date, amount: Pricing.r2(amt), method, note: '' });
    if (this.save(true)) { Toast.show('Pagamento registrado.', 'success'); this.renderPayments(true); }
    else d.payments.pop();
  },

  /* ---- Salvar, converter, excluir ---- */
  save(silent) {
    const d = this.draft;
    if (!d.items.length) { Toast.show('Adicione pelo menos um item antes de salvar.', 'error'); return false; }
    if (d.items.some(i => !String(i.name).trim())) { Toast.show('Todos os itens precisam de uma descrição.', 'error'); return false; }
    const wasNew = !Docs.exists(d.id);
    Docs.save(d); this.dirty = false;
    history.replaceState(null, '', '#/doc/' + d.id);
    if (wasNew) this.rerender();
    else { const t = $('#ed-title'); if (t) t.innerHTML = `${KINDS[d.kind].label} <span class="text-zinc-400">${U.esc(d.number)}</span>`; }
    if (!silent) Toast.show(`${KINDS[d.kind].label} ${d.number} salvo.`, 'success');
    return true;
  },
  convert(toKind) {
    if (!this.save(true)) return;
    const d = this.draft;
    d.originNumber = d.number; d.kind = toKind; d.number = Store.nextNumber(toKind);
    d.status = 'Em Andamento'; d.date = U.today();
    Docs.save(d); this.dirty = false; this.rerender();
    Toast.show(`Convertido em ${KINDS[toKind].label} ${d.number}.`, 'success');
  },

  /* ---- Seletor de catálogo ---- */
  openPicker() {
    const seg = Store.seg(this.draft.segmentId);
    const wantSvc = this.tab === 'servico';
    const prods = Store.data.products.filter(p => p.segmentId === seg.id && (p.type === 'servico') === wantSvc).sort((a, b) => prodName(a).localeCompare(prodName(b), 'pt'));
    Modal.open({
      title: (wantSvc ? 'Serviços — ' : 'Materiais — ') + seg.name, size: 'max-w-xl',
      body: `<input class="input mb-3" placeholder="Buscar item ou categoria" id="picker-q"><div id="picker-list" class="divide-y divide-zinc-100"></div>`,
      footer: `<button class="btn btn-primary" data-action="modal-close">Concluir</button>`,
      onMount: root => {
        const render = () => {
          const q = $('#picker-q', root).value.trim().toLowerCase();
          const list = prods.filter(p => (prodName(p) + ' ' + p.category).toLowerCase().includes(q));
          $('#picker-list', root).innerHTML = list.length ? list.map(p => `
            <button class="w-full text-left py-3 flex items-center justify-between gap-3 hover:bg-zinc-50 px-2 rounded-lg" data-action="ed-pick" data-id="${p.id}">
              <span class="min-w-0"><span class="block text-sm font-medium truncate">${U.esc(prodName(p))}</span><span class="block text-xs text-zinc-500">${U.esc(p.category)} · ${TYPE_LABEL[p.type]}</span></span>
              <span class="text-sm font-semibold tabular-nums">${U.money(Pricing.productPrice(p, seg))}</span></button>`).join('')
            : emptyState('Nenhum item encontrado', 'Cadastre itens na aba Catálogo deste segmento.');
        };
        $('#picker-q', root).addEventListener('input', render); render();
      }
    });
  }
};

/* ============================================================
   11. IMPRESSÃO DO DOCUMENTO (sem custos/margens)
   ============================================================ */
const Print = {
  live: false,
  MODES: [['detailed', 'Detalhado: quantidade, valor unitário e total'], ['lump', 'Lista sem preços + um total de materiais'], ['hidden', 'Lista sem valores (materiais inclusos no total)']],
  validUntil(d) {
    const co = Store.data.company;
    if (d.kind !== 'orcamento' || !Number(co.validDays)) return '';
    const [y, m, dd] = d.date.split('-').map(Number);
    return U.iso(new Date(y, m - 1, dd + Number(co.validDays)));
  },
  html(d) {
    const co = Store.data.company, seg = Store.seg(d.segmentId), cl = Store.client(d.clientId), t = Pricing.totals(d);
    const ac = seg ? seg.color : '#4f46e5', mode = d.materialMode || 'detailed';
    const mats = d.items.filter(i => i.type !== 'servico'), svcs = d.items.filter(i => i.type === 'servico');
    const sumOf = list => Pricing.r2(U.sum(list, i => Pricing.lineTotal(i)));
    const matTotal = sumOf(mats), svcTotal = sumOf(svcs);
    const priced = list => `<table class="ps-t"><thead><tr><th>Descrição</th><th class="ps-r">Qtd.</th><th>Un.</th><th class="ps-r">Valor unit.</th><th class="ps-r">Total</th></tr></thead><tbody>${list.map(i => `<tr><td>${U.esc(i.name)}</td><td class="ps-r">${U.n2(i.qty)}</td><td>${U.esc(i.unit)}</td><td class="ps-r">${U.money(i.price)}</td><td class="ps-r"><strong>${U.money(Pricing.lineTotal(i))}</strong></td></tr>`).join('')}</tbody></table>`;
    const plain = list => `<table class="ps-t"><thead><tr><th>Descrição</th><th class="ps-r">Qtd.</th><th>Un.</th></tr></thead><tbody>${list.map(i => `<tr><td>${U.esc(i.name)}</td><td class="ps-r">${U.n2(i.qty)}</td><td>${U.esc(i.unit)}</td></tr>`).join('')}</tbody></table>`;
    const sec = (title, body) => `<div class="ps-sec"><div class="ps-sec-title">${title}</div>${body}</div>`;
    const text = x => `<div class="ps-text">${U.esc(x)}</div>`;
    const row = (l, v) => `<div><span>${l}</span><span>${v}</span></div>`;
    const logo = co.logo && Photos.get('company-logo') ? `<img class="ps-logo" src="${Photos.get('company-logo')}" alt="">` : '';
    const contact = [co.phone, co.email].filter(Boolean).map(x => U.esc(x)).join(' · ');
    const valid = this.validUntil(d);
    const info = [['Data', U.fmtDate(d.date)], valid ? ['Válido até', U.fmtDate(valid)] : null, d.location ? ['Local do serviço', d.location] : null, d.deadline ? ['Prazo de execução', d.deadline] : null].filter(Boolean);
    const photos = d.showPhotos === false ? [] : (d.photos || []).filter(p => Photos.get(p.id));
    const matBody = mats.length ? (mode === 'detailed' ? priced(mats)
      : plain(mats) + (mode === 'lump' ? `<div class="ps-lump"><span>Total de materiais</span><span>${U.money(matTotal)}</span></div>` : `<div class="ps-note">Materiais e insumos inclusos no valor total.</div>`)) : '';
    return `<div class="ps" style="--ac:${U.esc(ac)}">
      <div class="ps-head">
        <div>${logo}<div class="ps-co">${U.esc(co.name)}</div>
          ${contact ? `<div class="ps-muted">${contact}</div>` : ''}
          ${co.doc ? `<div class="ps-muted">${U.esc(co.doc)}</div>` : ''}
          ${co.address ? `<div class="ps-muted">${U.esc(co.address)}</div>` : ''}</div>
        <div class="ps-doc"><div class="ps-kind">${U.esc(KINDS[d.kind].label)}</div><div class="ps-num">${U.esc(d.number || 'Rascunho')}</div></div>
      </div>
      <div class="ps-grid2">
        <div class="ps-box"><div class="ps-box-t">Cliente</div><div class="ps-strong">${cl ? U.esc(cl.name) : 'Consumidor'}</div>
          ${cl ? `<div class="ps-muted">${U.esc([cl.phone, cl.email].filter(Boolean).join(' · '))}</div>${cl.doc ? `<div class="ps-muted">${U.esc(cl.doc)}</div>` : ''}` : ''}</div>
        <div class="ps-box">${info.map(([k, v]) => `<div class="ps-kv"><span class="ps-muted">${k}</span><span>${U.esc(v)}</span></div>`).join('')}</div>
      </div>
      ${d.scope ? sec('Descrição do serviço', text(d.scope)) : ''}
      ${svcs.length ? sec('Serviços e mão de obra', priced(svcs)) : ''}
      ${mats.length ? sec('Materiais', matBody) : ''}
      <div class="ps-totals">
        ${svcs.length ? row('Serviços e mão de obra', U.money(svcTotal)) : ''}
        ${mats.length ? row('Materiais', mode === 'hidden' ? 'Inclusos' : U.money(matTotal)) : ''}
        ${t.effectiveDiscount > 0 ? row('Desconto', '− ' + U.money(t.effectiveDiscount)) : ''}
        <div class="ps-total"><span>Total</span><span>${U.money(t.total)}</span></div>
      </div>
      ${d.paymentTerms ? sec('Condições de pagamento', text(d.paymentTerms)) : ''}
      ${d.notes ? sec('Observações', text(d.notes)) : ''}
      ${photos.length ? sec('Fotos do local', `<div class="ps-photos">${photos.map(p => `<figure class="ps-photo"><img src="${Photos.get(p.id)}" alt="">${p.caption ? `<figcaption>${U.esc(p.caption)}</figcaption>` : ''}</figure>`).join('')}</div>`) : ''}
      ${d.kind !== 'pdv' ? `<div class="ps-sign"><div>Cliente — de acordo</div><div>${U.esc(co.name)}</div></div>` : ''}
      ${co.footer ? `<div class="ps-foot">${U.esc(co.footer)}</div>` : ''}
    </div>`;
  },
  refresh() {
    const box = $('#print-preview');
    if (!box) { this.live = false; return; }
    const html = this.html(Editor.draft);
    box.innerHTML = html; $('#print-root').innerHTML = html;
  },
  open(d) {
    const html = this.html(d);
    $('#print-root').innerHTML = html;
    document.body.classList.add('printing-doc');
    this.live = true;
    Modal.open({ title: 'Gerar PDF', size: 'max-w-4xl',
      body: `<div class="grid sm:grid-cols-2 gap-3 mb-4">
          <div><label class="label">Valores dos materiais no PDF</label><select class="input" data-doc="materialMode">${opts(this.MODES, d.materialMode || 'detailed')}</select></div>
          <label class="flex items-center gap-2 text-sm sm:mt-6"><input type="checkbox" class="w-4 h-4 rounded" data-doc="showPhotos" ${d.showPhotos !== false ? 'checked' : ''}> Incluir fotos do local</label></div>
        <div id="print-preview" class="border border-zinc-200 rounded-xl overflow-x-auto bg-white">${html}</div>
        <p class="text-xs text-zinc-500 mt-3">Para compartilhar: toque em “Imprimir / salvar PDF” e escolha “Salvar como PDF”. Aguarde alguns segundos; com muitas fotos a preparação demora mais.</p>
        <div id="print-hint" class="hidden mt-3 rounded-xl bg-amber-50 text-amber-800 text-sm px-4 py-3">A janela de impressão não abriu. Isso acontece quando o navegador bloqueia a impressão dentro do Claude. O documento já está pronto: abra o menu do navegador (⋮) &gt; <strong>Compartilhar</strong> &gt; <strong>Imprimir</strong> e escolha “Salvar como PDF”. A versão instalável, fora do Claude, resolve isso de vez.</div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Fechar</button><button class="btn btn-primary" data-action="print-now">${icon('printer')} Imprimir / salvar PDF</button>`,
      onClose: () => { document.body.classList.remove('printing-doc'); this.live = false; } });
  },
  now(btn) {
    const prev = document.title, d = Editor.draft;
    document.title = `${KINDS[d.kind].label} ${d.number || ''} - ${Store.data.company.name}`.replace(/\s+/g, ' ').trim();
    let started = false;
    const onBefore = () => { started = true; };
    const finish = () => {
      document.title = prev; if (btn) btn.disabled = false;
      window.removeEventListener('afterprint', finish); window.removeEventListener('beforeprint', onBefore);
    };
    window.addEventListener('beforeprint', onBefore); window.addEventListener('afterprint', finish);
    if (btn) btn.disabled = true;
    Toast.show('Preparando o PDF… aguarde.', 'info');
    setTimeout(() => {
      try { window.print(); } catch (e) { started = false; }
      setTimeout(() => {
        if (started) return;
        finish();
        const hint = $('#print-hint');
        if (hint) hint.classList.remove('hidden');
      }, 2500);
    }, 60);
  }
};

/* ============================================================
   12. VENDA RÁPIDA (PDV)
   ============================================================ */
const PDV = {
  cart: [], q: '', cat: 'all', method: 'Pix', received: '', disc: 0, discType: 'value', customer: '', dueDate: '', segId: null,
  seg() { const g = sid(); return g !== 'all' ? Store.seg(g) : (Store.seg(this.segId) || Store.data.segments[0]); },
  reset() { this.cart = []; this.received = ''; this.disc = 0; this.customer = ''; this.dueDate = ''; this.q = ''; this.cat = 'all'; },
  doc() { return { items: this.cart, discount: this.disc, discountType: this.discType, finalOverride: null }; },

  renderProducts() {
    const box = $('#pdv-products'); if (!box) return;
    const seg = this.seg(), q = this.q.trim().toLowerCase();
    const list = Store.data.products.filter(p => p.segmentId === seg.id && (this.cat === 'all' || p.category === this.cat) && (prodName(p) + ' ' + p.category).toLowerCase().includes(q))
      .sort((a, b) => prodName(a).localeCompare(prodName(b), 'pt'));
    box.innerHTML = list.length ? `<div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">${list.map(p => `
      <button class="text-left rounded-xl border border-zinc-200 bg-white p-3 shadow-sm hover:border-indigo-400 hover:shadow-md transition" data-action="pdv-add" data-id="${p.id}">
        <div class="text-sm font-medium text-zinc-900 line-clamp-2 min-h-[2.5rem]">${U.esc(prodName(p))}</div>
        <div class="mt-2 flex items-center justify-between gap-2"><span class="font-semibold tabular-nums">${U.money(Pricing.productPrice(p, seg))}</span>
        <span class="text-xs ${p.stock != null && p.stock <= 0 ? 'text-red-600' : 'text-zinc-500'}">${p.stock == null ? '' : (p.stock <= 0 ? 'sem estoque' : U.n2(p.stock) + ' ' + U.esc(p.unit))}</span></div>
      </button>`).join('')}</div>` : emptyState('Nenhum item neste segmento', 'Cadastre produtos na aba Catálogo.');
  },
  renderCart() {
    const box = $('#pdv-cart'); if (!box) return;
    const rows = this.cart.map((it, i) => `
      <div class="py-3 border-t border-zinc-100 first:border-t-0">
        <div class="flex justify-between gap-2"><div class="text-sm font-medium text-zinc-900">${U.esc(it.name)}</div>
          <button class="btn btn-ghost btn-sm text-red-600" data-action="pdv-del" data-i="${i}" aria-label="Remover">${icon('x')}</button></div>
        <div class="mt-2 flex items-center gap-2">
          <div class="flex items-center rounded-xl border border-zinc-300 bg-white">
            <button class="px-2 py-2 text-zinc-600 hover:bg-zinc-100 rounded-l-xl" data-action="pdv-dec" data-i="${i}" aria-label="Diminuir">${icon('minus')}</button>
            <input type="number" step="any" min="0" inputmode="decimal" class="w-14 text-center text-sm tabular-nums focus:outline-none py-1.5" data-pdv-item="${i}" data-f="qty" value="${U.n2(it.qty)}">
            <button class="px-2 py-2 text-zinc-600 hover:bg-zinc-100 rounded-r-xl" data-action="pdv-inc" data-i="${i}" aria-label="Aumentar">${icon('plus')}</button>
          </div>
          <span class="text-xs text-zinc-400">×</span>
          <input type="number" step="any" min="0" inputmode="decimal" class="input !w-24 !py-1.5 tabular-nums" data-pdv-item="${i}" data-f="price" value="${U.n2(it.price)}" aria-label="Preço unitário">
          <div class="ml-auto font-semibold tabular-nums text-sm">${U.money(Pricing.lineTotal(it))}</div>
        </div>
      </div>`).join('');
    const methods = [...METHODS, 'Fiado'].map(m => `<button class="btn btn-sm ${this.method === m ? 'bg-zinc-900 text-white' : 'btn-secondary'}" data-action="pdv-method" data-m="${m}">${m === 'Fiado' ? 'Fiado / Pendente' : m}</button>`).join('');
    box.innerHTML = `
      <div class="flex items-center justify-between mb-2"><h2 class="font-semibold text-zinc-900">Carrinho</h2>
        ${this.cart.length ? `<button class="text-xs text-zinc-500 hover:text-red-600" data-action="pdv-clear">Limpar</button>` : ''}</div>
      <div>${rows || '<p class="text-sm text-zinc-500 py-6 text-center">Toque em um produto para adicionar.</p>'}</div>
      <div class="mt-3 pt-3 border-t border-zinc-100 space-y-3">
        <div class="flex items-center justify-between gap-2"><span class="text-sm text-zinc-500">Desconto</span>
          <div class="flex gap-1.5"><select class="input !w-16 !px-2 !py-1.5" data-pdv="discType">${opts([['value', 'R$'], ['percent', '%']], this.discType)}</select>
          <input type="number" step="any" min="0" inputmode="decimal" class="input !w-24 !py-1.5 tabular-nums" data-pdv="disc" value="${this.disc || ''}"></div></div>
        <div class="rounded-xl bg-zinc-900 text-white px-4 py-3 flex items-center justify-between"><span class="text-sm">Total</span><span class="text-xl font-semibold tabular-nums" id="pdv-total"></span></div>
        <div><label class="label">Nome do cliente ${this.method === 'Fiado' ? '(obrigatório no fiado)' : '(opcional)'}</label>
          <input class="input" list="pdv-clients" data-pdv="customer" value="${U.esc(this.customer)}" placeholder="Digite ou escolha um cliente">
          <datalist id="pdv-clients">${Store.data.clients.map(c => `<option value="${U.esc(c.name)}">`).join('')}</datalist></div>
        <div><label class="label">Forma de pagamento</label><div class="flex flex-wrap gap-2">${methods}</div></div>
        ${this.method === 'Dinheiro' ? `<div class="grid grid-cols-2 gap-3 items-end"><div><label class="label">Valor recebido</label>
          <input type="number" step="any" min="0" inputmode="decimal" class="input tabular-nums" data-pdv="received" value="${U.esc(this.received)}" placeholder="Exato"></div>
          <div><p class="text-xs text-zinc-500">Troco</p><p class="text-lg font-semibold tabular-nums text-emerald-700" id="pdv-change"></p></div></div>` : ''}
        ${this.method === 'Fiado' ? `<div><label class="label">Data de pagamento (vencimento)</label><input type="date" class="input" data-pdv="dueDate" value="${this.dueDate}" min="${U.today()}"><p class="text-xs text-orange-700 mt-1">A venda entra em “A receber” até essa data e pode ser quitada depois no Financeiro.</p></div>` : `<p class="text-xs text-emerald-700">Pix, cartão e dinheiro são considerados pagos na hora.</p>`}
        <button class="btn btn-primary w-full py-3" data-action="pdv-finish" ${this.cart.length ? '' : 'disabled'}>${icon('check')} Finalizar venda</button>
      </div>`;
    this.refreshTotals();
  },
  refreshTotals() {
    const t = Pricing.totals(this.doc());
    const a = $('#pdv-total'); if (a) a.textContent = U.money(t.total);
    const c = $('#pdv-change');
    if (c) { const rec = this.received === '' ? t.total : parseFloat(this.received) || 0; c.textContent = U.money(Math.max(0, Pricing.r2(rec - t.total))); }
    const fab = $('#pdv-fab'); if (fab) fab.innerHTML = `${icon('cart')} ${this.cart.length} · ${U.money(t.total)}`;
  },
  onInput(t) {
    const k = t.dataset.pdv;
    if (k === 'disc') this.disc = Math.max(0, parseFloat(t.value) || 0);
    else if (k === 'discType') this.discType = t.value;
    else if (k === 'customer') this.customer = t.value;
    else if (k === 'dueDate') this.dueDate = t.value;
    else if (k === 'received') this.received = t.value;
    this.refreshTotals();
  },
  add(id) {
    const p = Store.product(id), seg = this.seg(); if (!p) return;
    const ex = this.cart.find(i => i.productId === id);
    if (ex) ex.qty += 1; else this.cart.push(Pricing.itemFromProduct(p, seg, 1));
    this.renderCart();
  },
  finish() {
    if (!this.cart.length) return;
    const seg = this.seg(), d = Docs.blank('pdv', seg.id);
    d.items = U.clone(this.cart); d.discount = this.disc; d.discountType = this.discType; d.status = 'Concluído';
    const name = this.customer.trim();
    let client = name ? Store.data.clients.find(c => c.name.toLowerCase() === name.toLowerCase()) : null;
    const t = Pricing.totals(d);
    if (t.total <= 0) return Toast.show('O total da venda precisa ser maior que zero.', 'error');
    let change = 0, note = '';
    if (this.method === 'Fiado') {
      if (!name) return Toast.show('Informe o nome de quem vai pagar depois.', 'error');
      if (!this.dueDate) return Toast.show('Informe a data de pagamento do fiado.', 'error');
      d.dueDate = this.dueDate;
    } else {
      if (this.method === 'Dinheiro') {
        const rec = this.received === '' ? t.total : parseFloat(this.received) || 0;
        if (rec < t.total - 0.004) return Toast.show('O valor recebido é menor que o total.', 'error');
        change = Pricing.r2(rec - t.total); note = `Recebido ${U.money(rec)} · troco ${U.money(change)}`;
      }
      d.payments.push({ id: U.uid('pay'), date: U.today(), amount: t.total, method: this.method, note });
    }
    if (this.method === 'Fiado' && !client) { client = { id: U.uid('cli'), name, phone: '', email: '', doc: '', notes: '' }; Store.data.clients.push(client); }
    d.clientId = client ? client.id : ''; d.customerName = name;
    Docs.save(d);
    const method = this.method;
    this.reset(); this.renderCart(); this.renderProducts();
    Modal.open({ title: 'Venda concluída', size: 'max-w-sm',
      body: `<div class="text-center py-2"><div class="mx-auto w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mb-3">${icon('check', 'w-6 h-6')}</div>

        ${name ? `<p class="text-sm text-zinc-800 mt-1">${U.esc(name)}</p>` : ''}${method === 'Fiado' ? `<p class="text-sm text-orange-700 mt-1">Vence em ${U.fmtDate(d.dueDate)}</p>` : ''}
        <p class="text-3xl font-semibold tabular-nums mt-1">${U.money(t.total)}</p>
        ${change > 0 ? `<p class="mt-3 text-sm text-zinc-500">Troco</p><p class="text-xl font-semibold text-emerald-700 tabular-nums">${U.money(change)}</p>` : ''}</div>`,
      footer: `<button class="btn btn-primary" data-action="modal-close">Nova venda</button>` });
  }
};

const Pay = {
  openReceive(docId) {
    const d = Docs.get(docId); if (!d) return;
    const bal = Finance.balance(d), cl = Store.client(d.clientId);
    const root = Modal.open({ title: `Receber — ${d.number}`, size: 'max-w-md',
      body: `<p class="text-sm text-zinc-500 mb-4">${cl ? U.esc(cl.name) + ' · ' : ''}Saldo pendente: <strong class="text-zinc-900">${U.money(bal)}</strong></p>

const dueBadge = d => {
  if (!d.dueDate) return '<span class="text-xs text-zinc-400">Sem vencimento</span>';
  if (Finance.isOverdue(d)) return badge('Atrasado', 'bg-red-50 text-red-700 ring-red-200');
  if (d.dueDate === U.today()) return badge('Vence hoje', 'bg-amber-50 text-amber-700 ring-amber-200');
  return badge('Vence ' + U.fmtDate(d.dueDate).slice(0, 5), 'bg-zinc-100 text-zinc-600 ring-zinc-200');
};

LIST.receber = () => {
  const box = $('#list-receber'); if (!box) return;
  const f = UI.f.receber, q = f.q.trim().toLowerCase(), today = U.today();
  const list = Finance.scoped(sid()).filter(d => Finance.balance(d) > 0.004)
    .filter(d => (f.client === 'all' || d.clientId === f.client) && Finance.inRange(d.date, f.from, f.to))
    .filter(d => !q || (d.number + ' ' + docWho(d)).toLowerCase().includes(q))
    .sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999') || a.date.localeCompare(b.date));
  const open = U.sum(list, d => Finance.balance(d));
  const late = U.sum(list.filter(d => Finance.isOverdue(d)), d => Finance.balance(d));
  const week = U.sum(list.filter(d => d.dueDate && d.dueDate >= today && d.dueDate <= U.addDays(7)), d => Finance.balance(d));
  const stats = `<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
    ${stat('Total a receber', U.money(open), list.length + ' documento(s) em aberto', 'text-orange-600')}
    ${stat('Atrasado', U.money(late), 'Vencimento já passou', late > 0 ? 'text-red-600' : 'text-zinc-900')}
    ${stat('Vence em 7 dias', U.money(week), 'Próximos recebimentos')}</div>`;
  let body;
  if (!list.length) body = emptyState('Nada a receber', 'Nenhum documento em aberto com esses filtros.');
  else if (f.view === 'pessoas') {
    const people = {};
    list.forEach(d => {
      const key = d.clientId || ('n:' + (d.customerName || '').toLowerCase());
      const g = people[key] || (people[key] = { clientId: d.clientId, name: docWho(d) || 'Sem cliente', docs: [], total: 0, late: 0, next: '' });
      const b = Finance.balance(d); g.docs.push(d); g.total += b;
      if (Finance.isOverdue(d)) g.late += b;
      if (d.dueDate && (!g.next || d.dueDate < g.next)) g.next = d.dueDate;
    });
    body = `<div class="hidden md:grid grid-cols-12 gap-4 px-4 py-2.5 text-xs font-medium text-zinc-500 bg-zinc-50 border-b border-zinc-100">
        <div class="col-span-4">Pessoa</div><div class="col-span-3">Situação</div><div class="col-span-3 text-right">Deve</div><div class="col-span-2"></div></div>` +
      Object.values(people).sort((a, b) => b.total - a.total).map(g => `
      <div class="grid grid-cols-2 md:grid-cols-12 gap-x-4 gap-y-1 items-center px-4 py-3 border-t border-zinc-100 first:border-t-0">
        <div class="md:col-span-4 min-w-0"><div class="font-medium text-zinc-900 truncate">${U.esc(g.name)}</div>
          <div class="text-xs text-zinc-500">${g.docs.length} documento(s)${g.next ? ' · próximo vencimento ' + U.fmtDate(g.next) : ''}</div></div>
        <div class="md:col-span-3 flex justify-end md:justify-start">${g.late > 0 ? badge('Atrasado ' + U.money(g.late), 'bg-red-50 text-red-700 ring-red-200') : ''}</div>
        <div class="md:col-span-3 text-right font-semibold text-orange-600 tabular-nums">${U.money(g.total)}</div>
        <div class="col-span-2 md:col-span-2 md:text-right"><button class="btn btn-secondary btn-sm w-full md:w-auto" data-action="rec-person" data-client="${g.clientId || ''}" data-name="${U.esc(g.name)}">Ver cobranças</button></div></div>`).join('');
  } else {
    body = `<div class="hidden md:grid grid-cols-12 gap-4 px-4 py-2.5 text-xs font-medium text-zinc-500 bg-zinc-50 border-b border-zinc-100">
        <div class="col-span-3">Documento</div><div class="col-span-3">Cliente</div><div class="col-span-2">Vencimento</div><div class="col-span-2 text-right">Pendente</div><div class="col-span-2"></div></div>` +
      list.map(d => {
        const sg = Store.seg(d.segmentId), who = docWho(d);
        return `<div class="grid grid-cols-2 md:grid-cols-12 gap-x-4 gap-y-1 items-center px-4 py-3 border-t border-zinc-100 first:border-t-0">
          <a href="#/doc/${d.id}" data-nav class="md:col-span-3 min-w-0"><div class="font-medium text-zinc-900">${U.esc(d.number)} ${payBadge(Finance.payStatus(d))}</div>
            <div class="text-xs text-zinc-500 flex items-center gap-1.5">${sg ? segDot(sg) : ''}Emitido ${U.fmtDate(d.date)}</div></a>
          <div class="md:col-span-3 text-sm text-zinc-700 truncate text-right md:text-left">${who ? U.esc(who) : '<span class="text-zinc-400">Sem cliente</span>'}</div>
          <div class="md:col-span-2 text-sm">${dueBadge(d)}</div>
          <div class="md:col-span-2 text-right"><div class="font-semibold text-orange-600 tabular-nums">${U.money(Finance.balance(d))}</div><div class="text-xs text-zinc-400 tabular-nums">de ${U.money(Finance.total(d))}</div></div>
          <div class="col-span-2 md:col-span-2 md:text-right"><button class="btn btn-primary btn-sm w-full md:w-auto" data-action="pay-open" data-id="${d.id}">Receber</button></div></div>`;
      }).join('');
  }
  box.innerHTML = stats + `<div class="card overflow-hidden">${body}</div>`;
};

    return `<div class="grid grid-cols-4 gap-2 px-4 py-3 border-t border-zinc-100 text-sm tabular-nums">

  }).join('');

  const byDay = {};

        <div class="min-w-0"><div class="font-medium">${U.fmtDate(day)} <span class="text-zinc-400 font-normal">· ${U.weekday(day)} · ${g.n} recebimento(s)</span></div>
          <div class="text-xs text-zinc-500">${Object.entries(g.m).map(([m, v]) => U.esc(m) + ' ' + U.money(v)).join(' · ')}</div></div>
        <div class="font-semibold tabular-nums text-emerald-700">${U.money(g.total)}</div></div>`; }).join('')
        : '<div class="px-4 pb-6 text-sm text-zinc-500">Nenhuma entrada no período.</div>'}</div>
    <div class="card p-5 mt-6"><h2 class="font-semibold text-zinc-900 mb-3">Por forma de pagamento</h2>
      ${methods.length ? `<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${methods.map(([m, v]) => `<div class="rounded-xl bg-zinc-50 px-3 py-2"><p class="text-xs text-zinc-500">${U.esc(m)}</p><p class="font-semibold tabular-nums">${U.money(v)}</p></div>`).join('')}</div>` : '<p class="text-sm text-zinc-500">Nenhum recebimento no período.</p>'}</div>
    <div class="card overflow-hidden mt-6">
      <div class="px-4 py-4"><h2 class="font-semibold text-zinc-900">Por segmento</h2></div>
      <div class="grid grid-cols-4 gap-2 px-4 pb-2 text-xs text-zinc-500"><div>Segmento</div><div class="text-right">Faturado</div><div class="text-right">Recebido</div><div class="text-right">Pendente</div></div>
      ${rows}</div>
    <div class="card overflow-hidden mt-6"><div class="px-4 py-4"><h2 class="font-semibold text-zinc-900">Todas as movimentações</h2></div>
      ${moves.length ? moves.map(({ d, p }) => `<div class="flex items-center justify-between gap-3 px-4 py-3 border-t border-zinc-100 text-sm">
          <div class="min-w-0"><div class="font-medium">${U.esc(d.number)} <span class="text-zinc-400 font-normal">· ${docWho(d) ? U.esc(docWho(d)) : 'Consumidor'}</span></div>

          <div class="font-semibold tabular-nums text-emerald-700">${U.money(p.amount)}</div></div>`).join('')

const Catalog = {
  fillCats(r, selected) {
    const seg = Store.seg(formData(r).segmentId);
    let list = seg.categories.length ? seg.categories.slice() : ['Geral'];
    if (selected && !list.includes(selected)) list = [selected, ...list];
    $('[name="category"]', r).innerHTML = opts(list.map(c => [c, c]), selected || list[0]);
  },
  openForm(id, mode = 'edit') {
    const cur = id ? Store.product(id) : null;
    const defSeg = cur ? cur.segmentId : (sid() === 'all' ? Store.data.segments[0].id : sid());
    const p = cur ? U.clone(cur) : { segmentId: defSeg, name: '', variant: '', type: 'material', category: '', unit: 'un', cost: '', margin: null, price: null, stock: null };
    if (!p.variant) p.variant = '';
    if (mode === 'dupe') p.name += ' (cópia)';
    if (mode === 'variant') { p.variant = ''; p.stock = null; }
    const editing = !!cur && mode === 'edit';
    const title = editing ? 'Editar item' : mode === 'dupe' ? 'Duplicar item' : mode === 'variant' ? `Nova variação de “${cur.name}”` : 'Novo item';
    const names = [...new Set(Store.data.products.map(x => x.name))];
    const hint = mode === 'variant' && cur && !cur.variant
      ? `Dê um nome à variação nova. Depois edite o item original (“${U.esc(cur.name)}”) e coloque o nome da variação dele, por exemplo “Simples”.`
      : 'Itens com o mesmo nome e variações diferentes ficam agrupados no catálogo, cada um com seu custo, margem, preço e estoque.';
    const root = Modal.open({ title, size: 'max-w-xl',
      body: `<div class="grid grid-cols-2 gap-4">
        <div class="col-span-2 sm:col-span-1"><label class="label">Segmento</label><select class="input" name="segmentId">${opts(Store.data.segments.map(s => [s.id, s.name]), p.segmentId)}</select></div>
        <div class="col-span-2 sm:col-span-1"><label class="label">Tipo</label><select class="input" name="type">${opts(Object.entries(TYPE_LABEL), p.type)}</select></div>
        <div class="col-span-2"><label class="label">Nome do item</label><input class="input" name="name" list="name-list" value="${U.esc(p.name)}" placeholder="Ex.: Tomada, Bolo"><datalist id="name-list">${names.map(n => `<option value="${U.esc(n)}">`).join('')}</datalist></div>
        <div class="col-span-2"><label class="label">Variação (opcional)</label><input class="input" name="variant" value="${U.esc(p.variant)}" placeholder="Ex.: Simples, Dupla, Cenoura"><p class="text-xs text-zinc-500 mt-1">${hint}</p></div>
        <div class="col-span-2 sm:col-span-1"><label class="label">Categoria</label>
          <div class="flex gap-2"><select class="input" name="category"></select><button class="btn btn-secondary" data-action="cat-add-category" aria-label="Nova categoria" title="Nova categoria">${icon('plus')}</button></div></div>
        <div class="col-span-2 sm:col-span-1"><label class="label">Unidade</label><select class="input" name="unit">${unitOpts(p.unit)}</select></div>
        <div><label class="label">Custo unitário (R$)</label>${numInput('name="cost"', p.cost)}</div>
        <div><label class="label">Margem própria (%)</label>${numInput('name="margin" placeholder="Padrão do segmento"', p.margin ?? '')}</div>
        <div><label class="label">Preço fixo (R$) — opcional</label>${numInput('name="price" placeholder="Usar margem"', p.price ?? '')}</div>
        <div><label class="label">Estoque — opcional</label>${numInput('name="stock" placeholder="Não controlar"', p.stock ?? '')}</div>
        <div class="col-span-2 rounded-xl bg-zinc-50 px-4 py-3 text-sm" id="cat-preview"></div>
      </div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="cat-save">${mode === 'dupe' ? 'Salvar cópia' : mode === 'variant' ? 'Salvar variação' : 'Salvar item'}</button>`,
      onMount: r => {
        const preview = () => {
          const f = formData(r), seg = Store.seg(f.segmentId), cost = parseFloat(f.cost) || 0;
          const m = f.margin !== '' ? parseFloat(f.margin) || 0 : Pricing.segMargin(seg, f.type);
          const price = f.price !== '' ? parseFloat(f.price) || 0 : Pricing.suggest(cost, m);
          $('#cat-preview', r).innerHTML = f.price !== ''
            ? `Preço fixo de <strong>${U.money(price)}</strong> — margem resultante de <strong>${U.n2(Pricing.marginOf(cost, price))}%</strong>.`

        };
        this.fillCats(r, p.category);
        r.addEventListener('input', e => {
          if (e.target.name === 'segmentId') this.fillCats(r, '');
          if (e.target.name === 'type' && !editing) { const u = $('[name="unit"]', r); if (['un', 'h'].includes(u.value)) u.value = e.target.value === 'servico' ? 'h' : 'un'; }

    const list = Store.data.products, i = list.findIndex(p => p.id === rec.id);
    if (i >= 0) list[i] = rec; else list.push(rec);
