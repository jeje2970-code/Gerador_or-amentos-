        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

  segMargin(seg, type) { return typeKind(type) === 'servico' ? seg.serviceMargin : seg.materialMargin; },
  productMargin(p, seg) { return p.margin != null ? p.margin : this.segMargin(seg, p.type); },
  productPrice(p, seg) { return p.price != null ? p.price : this.suggest(p.cost, this.productMargin(p, seg)); },

  itemFromProduct(p, seg, qty = 1) {
    const fixed = p.price != null;
    const margin = fixed ? this.marginOf(p.cost, p.price) : this.productMargin(p, seg);
    return { id: U.uid('it'), productId: p.id, name: prodName(p), type: p.type, unit: p.unit, qty, cost: p.cost,
             margin, baseMargin: margin, price: this.productPrice(p, seg), locked: fixed };
  },
  blankItem(seg, type = 'material') {
    const m = this.segMargin(seg, type);
    return { id: U.uid('it'), productId: null, name: '', type, unit: typeKind(type) === 'servico' ? 'serv' : 'un', qty: 1, cost: 0, margin: m, baseMargin: m, price: 0, locked: false };
  },
  hourItem(seg) {
    const m = seg.serviceMargin;
    return { id: U.uid('it'), productId: null, name: 'Mão de obra', type: firstType('servico'), unit: 'h', qty: 1, cost: seg.hourCost,
             margin: m, baseMargin: m, price: this.suggest(seg.hourCost, m), locked: false };
  },
  applyChange(it, field, raw) {
    const n = U.num(raw); const v = isNaN(n) ? 0 : n;
    switch (field) {
      case 'qty': it.qty = Math.max(0, v); break;
      case 'cost':
        it.cost = Math.max(0, v);
        if (it.locked) it.margin = this.marginOf(it.cost, it.price); else it.price = this.suggest(it.cost, it.margin);
        break;
      case 'margin': it.margin = Math.max(-99, v); it.locked = false; it.price = this.suggest(it.cost, it.margin); break;
      case 'price': it.price = Math.max(0, v); it.locked = true; it.margin = this.marginOf(it.cost, it.price); break;
    }
  },
  lineTotal(it) { return this.r2(it.qty * it.price); },
  totals(doc) {
    const items = doc.items || [];
    const subtotal = this.r2(U.sum(items, i => this.lineTotal(i)));
    const cost = this.r2(U.sum(items, i => i.qty * i.cost));
    /* discountType: percent (%), value (R$) ou total (o número digitado é o valor final a cobrar) */
    const type = doc.discountType, val = Number(doc.discount) || 0;
    let disc = type === 'percent' ? subtotal * val / 100 : type === 'total' ? 0 : val;
    disc = this.r2(Math.min(Math.max(disc, 0), subtotal));
    const computed = this.r2(subtotal - disc);
    const legacy = doc.finalOverride !== null && doc.finalOverride !== undefined && doc.finalOverride !== '';
    const hasOverride = (type === 'total' && val > 0) || legacy;
    const ovValue = type === 'total' && val > 0 ? val : (legacy ? Number(doc.finalOverride) : 0);
    const total = hasOverride ? this.r2(Math.max(0, ovValue)) : computed;
    const profit = this.r2(total - cost);
    return {
      subtotal, cost, discount: disc, computed, total, hasOverride,
      effectiveDiscount: this.r2(subtotal - total), profit,
      markup: cost > 0 ? this.r2((total / cost - 1) * 100) : 0,
      marginOnSale: total > 0 ? this.r2(profit / total * 100) : 0
    };
  }
};


/* ---- 02-store.js ---- */
/* ============================================================
   4. PERSISTÊNCIA (IndexedDB, com LocalStorage como reserva)
   - Os dados ficam no banco "orcapro" do navegador, uma entrada por tipo de dado
     (segmentos, produtos, clientes, documentos, despesas...). Ao salvar, só as
     entradas que mudaram são regravadas.
   - Na primeira abertura desta versão, os dados antigos do LocalStorage são copiados
     para o banco. A cópia antiga continua guardada como reserva.
   - Abas/janelas abertas ao mesmo tempo avisam umas às outras (BroadcastChannel):
     quando uma grava, as outras recarregam antes de gravar por cima.
   ============================================================ */
const DB = {
  NAME: 'orcapro', STORE: 'kv', db: null,
  open() {
    return new Promise(resolve => {
      const timer = setTimeout(() => resolve(null), 3000);
      const done = v => { clearTimeout(timer); resolve(v); };
      try {
        if (!window.indexedDB) return done(null);
        const rq = indexedDB.open(this.NAME, 1);
        rq.onupgradeneeded = () => { if (!rq.result.objectStoreNames.contains(this.STORE)) rq.result.createObjectStore(this.STORE); };
        rq.onsuccess = () => { this.db = rq.result; done(this.db); };
        rq.onerror = rq.onblocked = () => done(null);
      } catch (e) { done(null); }
    });
  },
  readAll() {
    return new Promise((resolve, reject) => {
      const out = {}, tx = this.db.transaction(this.STORE), cur = tx.objectStore(this.STORE).openCursor();
      cur.onsuccess = e => { const c = e.target.result; if (c) { out[c.key] = c.value; c.continue(); } else resolve(out); };
      cur.onerror = () => reject(cur.error);
    });
  },
  putMany(entries) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(this.STORE, 'readwrite'), st = tx.objectStore(this.STORE);
      entries.forEach(([k, v]) => st.put(v, k));
      tx.oncomplete = () => resolve(true);
      tx.onerror = tx.onabort = () => reject(tx.error);
    });
  },
  clear() {
    return new Promise(resolve => { const tx = this.db.transaction(this.STORE, 'readwrite'); tx.objectStore(this.STORE).clear(); tx.oncomplete = () => resolve(); tx.onerror = () => resolve(); });
  }
};

const Store = {
  LS_KEY: 'orcapro:v1',
  VERSION: 2,
  /* Tudo que é lista. Cada uma vira uma entrada separada no banco. */
  LISTS: ['segments', 'products', 'clients', 'documents', 'paymentTerms', 'itemTypes', 'expenses', 'expenseCategories',
    'cashSessions', 'plans', 'stockMoves', 'suppliers', 'credits'],
  OBJECTS: ['company', 'counters', 'ui', 'settings'],
  data: null,
  backend: 'idb',         // 'idb' | 'ls' | 'memory'
  rev: 0,                 // número da gravação; sobe a cada save
  lastSaved: {},          // texto salvo de cada entrada, para gravar só o que mudou
  tab: Math.random().toString(36).slice(2),
  channel: null,
  writing: Promise.resolve(),

  async load() {
    let raw = null, fromLS = false;
    const db = await DB.open();
    if (db) {
      try {
        const all = await DB.readAll();
        if (all.meta && Array.isArray(all.segments)) {
          raw = {}; [...this.LISTS, ...this.OBJECTS].forEach(k => { if (all[k] !== undefined) raw[k] = all[k]; });
          raw.version = all.meta.version; this.rev = all.meta.rev || 0;
        }
      } catch (e) { raw = null; }
    } else this.backend = 'ls';
    if (!raw) {
      try { const t = localStorage.getItem(this.LS_KEY); if (t) { raw = JSON.parse(t); fromLS = true; } }
      catch (e) { if (!db) this.backend = 'memory'; }
    }
    this.data = raw && Array.isArray(raw.segments) && Array.isArray(raw.documents) ? raw : Seed.build();
    this.migrate();
    this.lastSaved = {};
    await this.save({ force: true });
    if (fromLS && this.backend === 'idb') {
      try { localStorage.setItem('orcapro:migrado-para-indexeddb', new Date().toISOString()); } catch (e) { /* sem LocalStorage */ }
    }
    this.listen();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  },

  /* Lê de novo do banco (outra aba gravou). */
  async reload() {
    if (this.backend !== 'idb') return false;
    await this.writing;
    const all = await DB.readAll();
    if (!all.meta || all.meta.tab === this.tab) return false;
    const d = {}; [...this.LISTS, ...this.OBJECTS].forEach(k => { if (all[k] !== undefined) d[k] = all[k]; });
    d.version = all.meta.version;
    this.data = d; this.migrate(); this.rev = Math.max(this.rev, all.meta.rev || 0);
    this.lastSaved = {}; [...this.LISTS, ...this.OBJECTS].forEach(k => { this.lastSaved[k] = JSON.stringify(this.data[k]); });
    return true;
  },

  listen() {
    if (!('BroadcastChannel' in window)) return;
    this.channel = new BroadcastChannel('orcapro');
    this.channel.onmessage = async e => {
      const m = e.data || {};
      if (m.tab === this.tab || m.type !== 'saved') return;
      this.rev = Math.max(this.rev, m.rev || 0);
      if (await this.reload()) App.onExternalChange();
    };
  },

  migrate() {
    const d = this.data;
    this.LISTS.forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
    if (!d.paymentTerms.length && (d.version || 1) < 2) d.paymentTerms = Seed.terms();
    if (!d.itemTypes.length) d.itemTypes = Seed.types();
    if (!d.expenseCategories.length) d.expenseCategories = Seed.expenseCategories();
    d.company = Object.assign(Seed.company(), d.company || {});
    d.settings = Object.assign(Seed.settings(), d.settings || {});
    d.settings.pix = Object.assign(Seed.settings().pix, d.settings.pix || {});
    d.counters = Object.assign({ orcamento: 0, pedido: 0, os: 0, pdv: 0, recibo: 0 }, d.counters || {});
    d.ui = Object.assign({ segmentId: 'all' }, d.ui || {});
    d.segments.forEach(sg => { sg.color = U.color(sg.color); if (!Array.isArray(sg.categories)) sg.categories = []; });
    d.clients.forEach(c => { Seed.clientDefaults(c); });

    /* status antigos → fluxo por tipo (versão 1 tinha a mesma lista para todos) */
    const mapStatus = x => {
      const s = x.status;
      if (x.kind === 'orcamento') return ({ 'Em Andamento': 'Aprovado', 'Concluído': 'Aprovado', 'Cancelado': 'Recusado' })[s] || (STATUS_BY_KIND.orcamento.includes(s) ? s : 'Rascunho');
      if (x.kind === 'pdv') return ({ 'Concluído': 'Concluída', 'Cancelado': 'Cancelada' })[s] || (STATUS_BY_KIND.pdv.includes(s) ? s : 'Concluída');
      return ({ Rascunho: 'Aberto', Enviado: 'Aberto', Aprovado: 'Aberto', 'Em Andamento': 'Em andamento' })[s] || (STATUS_BY_KIND[x.kind].includes(s) ? s : 'Aberto');
    };
    d.documents.forEach(x => {
      if (x.finalOverride !== null && x.finalOverride !== undefined && x.finalOverride !== '') { x.discountType = 'total'; x.discount = Number(x.finalOverride); x.finalOverride = null; }
      if (!KINDS[x.kind]) x.kind = 'pedido';
      x.status = mapStatus(x);
      Docs.normalize(x);
    });

    const groups = {};
    d.products.forEach(p => {
      if (p.minStock === undefined) p.minStock = null;
      if (p.hasVariants || p.groupId) return;
      const key = p.segmentId + '|' + String(p.name || '').trim().toLowerCase();
      (groups[key] = groups[key] || []).push(p);
    });
    Object.values(groups).forEach(list => {
      if (!list.some(p => p.variant)) return;
      const f = list[0], master = { id: U.uid('grp'), segmentId: f.segmentId, name: f.name, type: f.type, category: f.category, hasVariants: true };
      d.products.push(master);
      list.forEach(p => { p.groupId = master.id; if (!p.variant) p.variant = 'Padrão'; });
    });
    d.version = this.VERSION;
  },

  /* Grava só o que mudou. Retorna uma Promise, mas quem chama não precisa esperar:
     os dados em memória já estão certos e as gravações seguem em fila. */
  save(opts = {}) {
    const entries = [];
    [...this.LISTS, ...this.OBJECTS].forEach(k => {
      const txt = JSON.stringify(this.data[k]);
      if (opts.force || this.lastSaved[k] !== txt) { entries.push([k, this.data[k]]); this.lastSaved[k] = txt; }
    });
    if (!entries.length) return this.writing;
    this.rev++;
    Undo.touch();
    const meta = { version: this.VERSION, rev: this.rev, savedAt: new Date().toISOString(), tab: this.tab };
    if (this.backend === 'memory') return this.writing;
    if (this.backend === 'ls') {
      try { localStorage.setItem(this.LS_KEY, JSON.stringify(this.data)); }
      catch (e) { Toast.show('Armazenamento do navegador cheio. Faça um backup e apague dados antigos.', 'error'); }
      return this.writing;
    }
    const plain = entries.map(([k]) => [k, this.lastSaved[k] === undefined ? null : JSON.parse(this.lastSaved[k])]);
    this.writing = this.writing.then(() => DB.putMany([...plain, ['meta', meta]]))
      .then(() => { if (this.channel) this.channel.postMessage({ type: 'saved', tab: this.tab, rev: this.rev }); })
      .catch(() => Toast.show('Não foi possível gravar no aparelho. Faça um backup em arquivo agora.', 'error'));
    return this.writing;
  },

  usageKB() { return Math.round(JSON.stringify(this.data).length / 1024); },
  nextNumber(kind) {
    const c = this.data.counters; c[kind] = (c[kind] || 0) + 1;
    const prefix = KINDS[kind] ? KINDS[kind].prefix : 'REC';
    return prefix + '-' + String(c[kind]).padStart(4, '0');
  },
  seg: id => Store.data.segments.find(s => s.id === id),
  client: id => Store.data.clients.find(c => c.id === id),
  product: id => Store.data.products.find(p => p.id === id),
  supplier: id => Store.data.suppliers.find(s => s.id === id)
};

/* ---- 03-photos-stock-docs.js ---- */
/* ============================================================
   5. ESTOQUE E DOCUMENTOS (CRUD)
   Estoque só é movimentado quando o documento é de venda (não orçamento)
   e está "Concluído". O snapshot permite desfazer/refazer sem erro.
   ============================================================ */
/* ============================================================
   FOTOS: ficam no IndexedDB (muito mais espaço que o LocalStorage).
   O documento guarda só o id; os dados vivem num cache em memória.
   ============================================================ */
const Photos = {
  db: null, cache: {},
  init() {
    return new Promise(resolve => {
      const timer = setTimeout(resolve, 2000);
      const done = () => { clearTimeout(timer); resolve(); };
      try {
        if (!window.indexedDB) return done();
        const rq = indexedDB.open('orcapro-photos', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('photos');
        rq.onerror = rq.onblocked = done;
        rq.onsuccess = () => {
          this.db = rq.result;
          const cur = this.db.transaction('photos').objectStore('photos').openCursor();
          cur.onsuccess = e => { const c = e.target.result; if (c) { this.cache[c.key] = c.value; c.continue(); } else done(); };
          cur.onerror = done;
        };
      } catch (e) { done(); }
    });
  },
  get(id) { return this.cache[id] || ''; },
  put(id, data) {
    this.cache[id] = data;
    if (this.db) { try { this.db.transaction('photos', 'readwrite').objectStore('photos').put(data, id); } catch (e) { /* segue só em memória */ } }
  },
  del(id) {
    delete this.cache[id];
    if (this.db) { try { this.db.transaction('photos', 'readwrite').objectStore('photos').delete(id); } catch (e) { /* ignora */ } }
  },
  gc() {
    const used = new Set(['company-logo']);
    const keep = d => { (d.photos || []).forEach(p => used.add(p.id)); if (d.os && d.os.signature) used.add(d.os.signature); };
    Store.data.documents.forEach(keep);
    if (typeof Editor !== 'undefined' && Editor.draft) keep(Editor.draft);
    Object.keys(this.cache).filter(id => !used.has(id)).forEach(id => this.del(id));
  },
  fromFile(file, max, type, quality) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = reject;
      fr.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
          const ctx = c.getContext('2d');
          if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
          ctx.drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL(type, quality));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
};

/* ESTOQUE
   - Baixa só em pedido/OS "Concluído" e venda balcão "Concluída".
   - stockSnapshot guarda o que este documento tirou do estoque, para devolver certo
     se o documento mudar, for cancelado ou excluído.
   - Toda mudança real de quantidade vira uma linha em stockMoves (histórico do item). */
const Stock = {
  shouldApply: d => d.kind !== 'orcamento' && isDone(d.status),
  log(data, m) {
    if (!m.qty) return;
    data.stockMoves = data.stockMoves || [];
    data.stockMoves.push(Object.assign({ id: U.uid('mv'), date: U.today(), at: U.now(), note: '' }, m));
  },
  returned(d) {
    const r = {};
    (d.refunds || []).forEach(x => (x.items || []).forEach(it => { if (it.productId) r[it.productId] = (r[it.productId] || 0) + it.qty; }));
    return r;
  },
  adjust(data, productId, delta) {
    const p = data.products.find(x => x.id === productId);
    if (!p || p.stock == null) return false;
    p.stock = Math.round((p.stock + delta) * 1000) / 1000;
    return true;
  },
  /* o snapshot guarda o que REALMENTE saiu do estoque (já descontadas as devoluções) */
  release(d, data = Store.data, silent = false) {
    if (!d.stockSnapshot) return;
    d.stockSnapshot.forEach(s => {
      if (this.adjust(data, s.productId, s.qty) && !silent) this.log(data, { productId: s.productId, qty: s.qty, type: 'devolucao', docId: d.id, note: `${d.number} cancelado/excluído` });
    });
    d.stockSnapshot = null;
  },
  sync(d, data = Store.data) {
    const old = {}; (d.stockSnapshot || []).forEach(s => { old[s.productId] = (old[s.productId] || 0) + s.qty; });
    this.release(d, data, true);
    const now = {};
    if (this.shouldApply(d)) {
      const ret = this.returned(d), need = {};
      d.items.forEach(i => { if (i.productId) need[i.productId] = (need[i.productId] || 0) + (Number(i.qty) || 0); });
      const snap = [];
      Object.entries(need).forEach(([pid, q]) => {
        const take = Math.round(Math.max(0, q - (ret[pid] || 0)) * 1000) / 1000;
        if (take && this.adjust(data, pid, -take)) { snap.push({ productId: pid, qty: take }); now[pid] = take; }
      });
      d.stockSnapshot = snap;
    }
    new Set([...Object.keys(old), ...Object.keys(now)]).forEach(pid => {
      const diff = Math.round(((now[pid] || 0) - (old[pid] || 0)) * 1000) / 1000;
      if (diff) this.log(data, { productId: pid, qty: -diff, type: diff > 0 ? 'venda' : 'devolucao', docId: d.id, note: d.number || '' });
    });
  },
  /* devolução de itens de um documento que já baixou estoque: volta ao estoque e reduz o snapshot */
  giveBack(d, productId, qty, data = Store.data) {
    const snap = (d.stockSnapshot || []).find(s => s.productId === productId);
    if (!snap) return;
    const q = Math.min(qty, snap.qty);
    if (q > 0 && this.adjust(data, productId, q)) { snap.qty = Math.round((snap.qty - q) * 1000) / 1000; this.log(data, { productId, qty: q, type: 'devolucao', docId: d.id, note: `Devolução em ${d.number}` }); }
  },
  /* quanto falta: itens do documento com quantidade maior que o estoque disponível */
  shortages(items, d) {
    const need = {};
    items.forEach(i => { if (i.productId) need[i.productId] = (need[i.productId] || 0) + (Number(i.qty) || 0); });
    const held = {}; ((d && d.stockSnapshot) || []).forEach(s => { held[s.productId] = (held[s.productId] || 0) + s.qty; });
    return Object.entries(need).map(([pid, q]) => {
      const p = Store.product(pid); if (!p || p.stock == null) return null;
      const avail = Math.round((p.stock + (held[pid] || 0)) * 1000) / 1000;
      return q > avail + 0.0005 ? { product: p, need: q, avail } : null;
    }).filter(Boolean);
  }
};

const Docs = {
  blank(kind, segmentId) {
    return this.normalize({ id: U.uid('doc'), kind, number: '', segmentId, clientId: '', date: U.today(),
      status: STATUS_DEFAULT[kind] || 'Rascunho', items: [], discount: 0, discountType: 'percent',
      finalOverride: null, notes: '', payments: [], createdAt: U.now(), stockSnapshot: null, originNumber: null,
      scope: '', location: '', deadline: '', paymentTerms: '', photos: [], materialMode: 'detailed', showPhotos: true,
      dueDate: '', customerName: '', discountLabel: '', autoDiscount: false });
  },
  /* garante que todo documento (antigo ou novo) tenha todos os campos */
  normalize(x) {
    const def = { payments: [], items: [], photos: [], events: [], installments: [], refunds: [], convertedTo: [], originId: '', originNumber: null,
      dueDate: '', customerName: '', discountLabel: '', autoDiscount: false, scope: '', location: '', deadline: '', paymentTerms: '', notes: '',
      materialMode: 'detailed', showPhotos: true, rejectReason: '', sentAt: '', creditIssued: 0, validUntil: '' };
    Object.entries(def).forEach(([k, v]) => { if (x[k] === undefined || x[k] === null) x[k] = Array.isArray(v) ? [] : v; });
    if (x.kind === 'os') x.os = Object.assign({ equipment: '', serial: '', defect: '', responsible: '', entryDate: x.date || U.today(), forecastDate: '', doneDate: '',
      warrantyDays: (Store.data && Store.data.settings ? Store.data.settings.warrantyDays : 90), checklist: [], signature: '', signedAt: '', signedBy: '' }, x.os || {});
    if (x.kind === 'orcamento' && !x.validUntil && Store.data && Store.data.company) {
      const n = Number(Store.data.company.validDays) || 0;
      if (n) x.validUntil = U.addDaysTo(x.date || U.today(), n);
    }
    if (!Array.isArray(x.fees)) x.fees = [];
    if (!x.events.length && x.number) x.events.push({ at: x.createdAt || U.now(), type: 'criado', note: '' });
    return x;
  },
  /* Orçamentos em Rascunho/Enviado com a validade vencida passam a "Expirado" sozinhos. */
  refreshExpired() {
    const today = U.today(); let n = 0;
    Store.data.documents.forEach(d => {
      if (d.kind === 'orcamento' && ['Rascunho', 'Enviado'].includes(d.status) && d.validUntil && d.validUntil < today) {
        d.events.push({ at: U.now(), type: 'status', note: `${d.status} → Expirado (validade ${U.fmtDate(d.validUntil)})` });
        d.status = 'Expirado'; n++;
      }
    });
    if (n) Store.save();
    return n;
  },
  /* Converter: cria um documento NOVO (pedido ou OS) e marca o orçamento como Convertido.
     O orçamento continua existindo, com o link para o que gerou. */
  convert(quote, toKind) {
    const nd = U.clone(quote);
    Object.assign(nd, { id: U.uid('doc'), kind: toKind, number: '', status: STATUS_DEFAULT[toKind], date: U.today(), createdAt: U.now(),
      payments: [], refunds: [], fees: [], events: [], stockSnapshot: null, convertedTo: [], originId: quote.id, originNumber: quote.number,
      validUntil: '', sentAt: '', rejectReason: '', os: undefined });
    this.normalize(nd);
    const saved = this.save(nd);
    this.event(saved, 'origem', `Gerado do orçamento ${quote.number}`);
    const q = this.get(quote.id) || quote;
    q.convertedTo = [...(q.convertedTo || []), saved.id];
    if (q.status !== 'Convertido') this.event(q, 'status', `${q.status} → Convertido`);
    q.status = 'Convertido';
    this.event(q, 'convertido', `Convertido em ${saved.number}`);
    Store.save();
    return saved;
  },
  /* Duplicar: cópia sem número, pagamentos, histórico nem estoque baixado. */
  duplicate(d) {
    const nd = U.clone(d);
    Object.assign(nd, { id: U.uid('doc'), number: '', status: STATUS_DEFAULT[d.kind], date: U.today(), createdAt: U.now(), payments: [], refunds: [], fees: [],
      events: [], installments: [], stockSnapshot: null, convertedTo: [], originId: '', originNumber: null, sentAt: '', rejectReason: '', validUntil: '', dueDate: '' });
    if (nd.os) nd.os = Object.assign(nd.os, { signature: '', signedAt: '', signedBy: '', doneDate: '', entryDate: U.today(), checklist: (nd.os.checklist || []).map(c => ({ text: c.text, done: false })) });
    nd.items.forEach(i => { i.id = U.uid('it'); });
    return this.normalize(nd);
  },
  event(d, type, note = '') { d.events = d.events || []; d.events.push({ at: U.now(), type, note }); },
  get: id => Store.data.documents.find(d => d.id === id),
  exists(id) { return !!this.get(id); },
  byNumber: n => Store.data.documents.find(d => d.number === n),
  save(d) {
    const isNew = !this.exists(d.id);
    if (!d.number) d.number = Store.nextNumber(d.kind);
    if (isNew) this.event(d, 'criado');
    const prev = this.get(d.id);
    if (prev && prev.status !== d.status) this.event(d, 'status', `${prev.status} → ${d.status}`);
    Stock.sync(d);
    const list = Store.data.documents, i = list.findIndex(x => x.id === d.id);
    if (i >= 0) list[i] = U.clone(d); else list.unshift(U.clone(d));
    Store.save(); Photos.gc();
    return list[i >= 0 ? i : 0];
  },
  remove(id) {
    const d = this.get(id); if (!d) return;
    Stock.release(d);
    Store.data.documents = Store.data.documents.filter(x => x.id !== id);
    Store.data.documents.forEach(x => { if (x.convertedTo) x.convertedTo = x.convertedTo.filter(c => c !== id); });
    Store.save(); Photos.gc();
  }
};

/* ---- 04-finance.js ---- */
/* ============================================================
   6. FINANÇAS — regras de dinheiro em um só lugar
   Vocabulário (todas as telas usam estas funções, nunca refazem a conta):
   - total(d)     : valor do documento (itens − desconto).
   - netTotal(d)  : total − mercadoria devolvida + multa/juros cobrados (fees).
   - paid(d)      : soma dos pagamentos recebidos neste documento.
   - keptPaid(d)  : pago − dinheiro devolvido − valor que virou crédito do cliente.
   - balance(d)   : quanto o cliente ainda deve (0 em orçamento e cancelado).
   - parcelas     : installments[]; os pagamentos quitam as parcelas na ordem (a mais antiga primeiro).
   - Caixa (dinheiro que entrou) = pagamentos em Pix/Dinheiro/Cartão − devoluções em dinheiro − despesas pagas.
     Pagamento com "Crédito" não é dinheiro novo: só usa o saldo a favor do cliente.
   ============================================================ */
const Finance = {
  isBillable: d => d.kind !== 'orcamento' && !isCancelled(d.status),
  total: d => Pricing.totals(d).total,
  goodsReturned: d => Pricing.r2(U.sum(d.refunds || [], r => Number(r.goods) || 0)),
  fees: d => Pricing.r2(U.sum(d.fees || [], f => Number(f.amount) || 0)),
  netTotal(d) { return Pricing.r2(Math.max(0, this.total(d) - this.goodsReturned(d) + this.fees(d))); },
  paid: d => Pricing.r2(U.sum(d.payments || [], p => Number(p.amount) || 0)),
  givenBack: d => Pricing.r2(U.sum(d.refunds || [], r => (Number(r.cashBack) || 0) + (Number(r.toCredit) || 0))),
  keptPaid(d) { return Pricing.r2(this.paid(d) - this.givenBack(d)); },
  balance(d) { return this.isBillable(d) ? Math.max(0, Pricing.r2(this.netTotal(d) - this.keptPaid(d))) : 0; },
  /* pago a mais (ex.: devolveu mercadoria de venda já paga) */
  overpaid(d) { return Math.max(0, Pricing.r2(this.keptPaid(d) - (this.isBillable(d) ? this.netTotal(d) : 0))); },
  payStatus(d) {
    const t = this.netTotal(d), p = this.keptPaid(d);
    if (t <= 0.004 && p <= 0.004) return 'Pendente';
    if (p >= t - 0.004) return 'Pago';
    return p > 0 ? 'Parcial' : 'Pendente';
  },

  /* ---- Parcelas ---- */
  schedule(d) {
    const net = this.netTotal(d);
    let list = (d.installments || []).length
      ? d.installments.slice().sort((a, b) => (a.due || '').localeCompare(b.due || '') || a.n - b.n).map(x => ({ ...x }))
      : [{ id: 'unica', n: 1, due: d.dueDate || '', amount: net }];
    const sumInst = Pricing.r2(U.sum(list, x => Number(x.amount) || 0));
    if ((d.installments || []).length && Math.abs(sumInst - net) > 0.009) {
      /* mudou o total depois de parcelar: a diferença vai para a última parcela */
      const last = list[list.length - 1]; last.amount = Pricing.r2(Math.max(0, (Number(last.amount) || 0) + net - sumInst));
    }
    let pool = this.keptPaid(d);
    return list.map(x => {
      const amt = Number(x.amount) || 0, paidPart = Pricing.r2(Math.min(amt, Math.max(0, pool)));
      pool = Pricing.r2(pool - paidPart);
      return { ...x, amount: Pricing.r2(amt), paid: paidPart, open: Pricing.r2(amt - paidPart) };
    });
  },
  openInstallments(d) { return this.isBillable(d) ? this.schedule(d).filter(x => x.open > 0.004) : []; },
  nextDue(d) { const o = this.openInstallments(d).find(x => x.due); return o ? o.due : ''; },
  overdueAmount(d, today = U.today()) { return Pricing.r2(U.sum(this.openInstallments(d).filter(x => x.due && x.due < today), x => x.open)); },
  isOverdue(d) { return this.overdueAmount(d) > 0.004; },
  daysLate(d) { const o = this.openInstallments(d).find(x => x.due && x.due < U.today()); return o ? U.daysBetween(o.due, U.today()) : 0; },
  /* multa (uma vez) + juros proporcionais aos dias, sobre cada parcela atrasada */
  lateFee(d) {
    const st = Store.data.settings, today = U.today();
    const fine = (Number(st.finePct) || 0) / 100, rate = (Number(st.interestPctMonth) || 0) / 100;
    return Pricing.r2(U.sum(this.openInstallments(d).filter(x => x.due && x.due < today), x => x.open * (fine + rate * U.daysBetween(x.due, today) / 30)));
  },

  /* ---- Crédito do cliente ---- */
  creditBalance: cid => Pricing.r2(U.sum(Store.data.credits.filter(c => c.clientId === cid), c => Number(c.amount) || 0)),
  addCredit(cid, amount, note, docId = '') { if (!cid || !amount) return; Store.data.credits.push({ id: U.uid('cr'), clientId: cid, date: U.today(), amount: Pricing.r2(amount), note, docId }); },

  /* ---- Filtros e totais ---- */
  inRange: (date, from, to) => !!date && (!from || date >= from) && (!to || date <= to),
  scoped: sid => Store.data.documents.filter(d => sid === 'all' || d.segmentId === sid),
  isCash: m => CASH_METHODS.includes(m),
  /* Todas as entradas e saídas de dinheiro, uma linha por movimento. */
  movements(sid, from, to) {
    const out = [];
    this.scoped(sid).forEach(d => {
      (d.payments || []).forEach(p => { if (this.isCash(p.method) && this.inRange(p.date, from, to)) out.push({ date: p.date, at: p.at || '', amount: Number(p.amount) || 0, method: p.method, kind: 'in', label: d.number, who: docWho(d), note: p.note || '', doc: d, segmentId: d.segmentId }); });
      (d.refunds || []).forEach(r => { if (Number(r.cashBack) > 0 && this.inRange(r.date, from, to)) out.push({ date: r.date, at: r.at || '', amount: -Number(r.cashBack), method: r.method, kind: 'refund', label: d.number, who: docWho(d), note: 'Devolução' + (r.reason ? ': ' + r.reason : ''), doc: d, segmentId: d.segmentId }); });
    });
    Store.data.expenses.forEach(e => {
      if (!e.paidAt || !(sid === 'all' || e.segmentId === sid || !e.segmentId) || !this.inRange(e.paidAt, from, to)) return;
      out.push({ date: e.paidAt, at: '', amount: -(Number(e.amount) || 0), method: e.method || '', kind: 'expense', label: e.category, who: e.supplierId && Store.supplier(e.supplierId) ? Store.supplier(e.supplierId).name : '', note: e.description, expense: e, segmentId: e.segmentId });
    });
    return out.sort((a, b) => (b.date + b.at).localeCompare(a.date + a.at));
  },
  summary(sid, from, to) {
    let billed = 0, pending = 0, cost = 0;
    this.scoped(sid).forEach(d => {
      if (this.isBillable(d) && this.inRange(d.date, from, to)) {
        billed += this.netTotal(d); pending += this.balance(d);
        cost += Pricing.totals(d).cost;
      }
    });
    const mv = this.movements(sid, from, to), byMethod = {};
    let received = 0, refunded = 0, spent = 0;
    mv.forEach(m => {
      if (m.kind === 'in') { received += m.amount; byMethod[m.method] = (byMethod[m.method] || 0) + m.amount; }
      else if (m.kind === 'refund') { refunded -= m.amount; byMethod[m.method] = (byMethod[m.method] || 0) + m.amount; }
      else spent -= m.amount;
    });
    return { billed: Pricing.r2(billed), received: Pricing.r2(received - refunded), grossIn: Pricing.r2(received), refunded: Pricing.r2(refunded),
      spent: Pricing.r2(spent), net: Pricing.r2(received - refunded - spent), pending: Pricing.r2(pending), cost: Pricing.r2(cost), profit: Pricing.r2(billed - cost), byMethod };
  },
  openReceivable(sid) { return Pricing.r2(U.sum(this.scoped(sid), d => this.balance(d))); },
  overdueTotal(sid) { return Pricing.r2(U.sum(this.scoped(sid), d => this.overdueAmount(d))); },
  clientBalance(cid) { return Pricing.r2(U.sum(Store.data.documents.filter(d => d.clientId === cid), d => this.balance(d))); },

  /* Registra um pagamento já validado. Pagamento com crédito também baixa o saldo do cliente. */
  addPayment(d, { amount, method, date, note = '', sessionId = '' }) {
    const p = { id: U.uid('pay'), date: date || U.today(), at: U.now(), amount: Pricing.r2(amount), method, note };
    const s = CashBox.current(d.segmentId);
    if (sessionId) p.sessionId = sessionId; else if (s && p.date === U.today()) p.sessionId = s.id;
    d.payments.push(p);
    if (method === 'Crédito') Finance.addCredit(d.clientId, -p.amount, `Usado em ${d.number}`, d.id);
    return p;
  },
  /* Remover pagamento feito com crédito devolve o crédito ao cliente. */
  removePayment(d, payId) {
    const p = d.payments.find(x => x.id === payId); if (!p) return null;
    d.payments = d.payments.filter(x => x.id !== payId);
    if (p.method === 'Crédito') {
      const i = Store.data.credits.findIndex(c => c.docId === d.id && Math.abs(c.amount + p.amount) < 0.005 && String(c.note).startsWith('Usado'));
      if (i >= 0) Store.data.credits.splice(i, 1);
    }
    return p;
  }
};

/* ---- 04b-ops.js ---- */
/* ============================================================
   6b. OPERAÇÕES FINANCEIRAS: caixa do balcão, contas a pagar, planos mensais
   ============================================================ */

/* CAIXA DO BALCÃO (sessão por segmento)
   abrir com troco → vender (dinheiro, Pix, cartão) → sangria/suprimento → fechar contando o dinheiro.
   Esperado na gaveta = troco inicial + vendas em dinheiro − devoluções em dinheiro + suprimentos − sangrias.
   Diferença = contado − esperado (positivo = sobrou, negativo = faltou). */
const CashBox = {
  current: segId => (Store.data && Store.data.cashSessions ? Store.data.cashSessions.find(s => !s.closedAt && s.segmentId === segId) : null),
  inWindow(s, at) { return !!at && at >= s.openedAt && (!s.closedAt || at <= s.closedAt); },
  totals(s) {
    const byMethod = {}; let refundsCash = 0, sales = 0;
    Store.data.documents.filter(d => d.segmentId === s.segmentId).forEach(d => {
      (d.payments || []).forEach(p => {
        if (!(p.sessionId === s.id || (!p.sessionId && this.inWindow(s, p.at)))) return;
        byMethod[p.method] = Pricing.r2((byMethod[p.method] || 0) + p.amount); sales++;
      });
      (d.refunds || []).forEach(r => { if (r.cashBack > 0 && r.method === 'Dinheiro' && this.inWindow(s, r.at)) refundsCash += r.cashBack; });
    });
    const sup = U.sum(s.moves.filter(m => m.type === 'suprimento'), m => m.amount);
    const san = U.sum(s.moves.filter(m => m.type === 'sangria'), m => m.amount);
    const expected = Pricing.r2(s.openingCash + (byMethod.Dinheiro || 0) - refundsCash + sup - san);
    return { byMethod, refundsCash: Pricing.r2(refundsCash), sup: Pricing.r2(sup), san: Pricing.r2(san), expected, count: sales };
  },
  open(segId, amount, note) {
    if (this.current(segId)) return null;
    const s = { id: U.uid('cx'), segmentId: segId, openedAt: U.now(), openingCash: Pricing.r2(amount), moves: [], note: note || '', closedAt: '', countedCash: null, expectedCash: null, difference: null };
    Store.data.cashSessions.push(s); Store.save();
    return s;
  },
  move(s, type, amount, reason) {
    const m = { id: U.uid('mv'), type, amount: Pricing.r2(amount), reason, at: U.now() };
    s.moves.push(m); Store.save();
    return m;
  },
  close(s, counted, note) {
    const t = this.totals(s);
    Object.assign(s, { closedAt: U.now(), countedCash: Pricing.r2(counted), expectedCash: t.expected, difference: Pricing.r2(counted - t.expected), byMethod: t.byMethod, closeNote: note || '' });
    Store.save();
    return s;
  }
};

/* CONTAS A PAGAR
   Uma despesa pode repetir todo mês (repeat 'monthly'): todas as ocorrências têm o mesmo
   repeatGroup. Ao abrir o app criamos as ocorrências que faltam até o próximo mês. */
const Expenses = {
  status(e) { if (e.paidAt) return 'Paga'; return e.due && e.due < U.today() ? 'Atrasada' : 'Em aberto'; },
  STYLE: { 'Paga': 'bg-emerald-50 text-emerald-700 ring-emerald-200', 'Atrasada': 'bg-red-50 text-red-700 ring-red-200', 'Em aberto': 'bg-orange-50 text-orange-700 ring-orange-200' },
  materialize() {
    const groups = {}, horizon = U.addMonthsTo(U.today(), 1);
    Store.data.expenses.forEach(e => { if (e.repeat === 'monthly' && e.repeatGroup) (groups[e.repeatGroup] = groups[e.repeatGroup] || []).push(e); });
    let created = 0;
    Object.values(groups).forEach(list => {
      if (list.some(e => e.stopped)) return;
      list.sort((a, b) => a.due.localeCompare(b.due));
      let last = list[list.length - 1];
      const day = Number(last.repeatDay) || Number(last.due.slice(8, 10));
      let guard = 0;
      while (last.due < horizon && guard++ < 36) {
        const next = Object.assign(U.clone(last), { id: U.uid('exp'), due: U.addMonthsTo(last.due, 1, day), paidAt: '', method: '', createdAt: U.now() });
        Store.data.expenses.push(next); last = next; created++;
      }
    });
    if (created) Store.save();
    return created;
  },
  save(rec) {
    const list = Store.data.expenses, i = list.findIndex(x => x.id === rec.id);
    if (i >= 0) list[i] = rec; else list.push(rec);
    Store.save(); this.materialize();
  },
  openTotal(sid) { return Pricing.r2(U.sum(Store.data.expenses.filter(e => !e.paidAt && (sid === 'all' || !e.segmentId || e.segmentId === sid)), e => e.amount)); },
  lateTotal(sid) { return Pricing.r2(U.sum(Store.data.expenses.filter(e => !e.paidAt && e.due < U.today() && (sid === 'all' || !e.segmentId || e.segmentId === sid)), e => e.amount)); }
};

/* PLANOS MENSAIS: para cada mês em aberto, gera um pedido "Concluído" com vencimento no dia
   combinado. O pedido entra em "A receber" como qualquer outro. */
const Plans = {
  monthKey: iso => iso.slice(0, 7),
  run() {
    const cur = this.monthKey(U.today()); let created = 0; const made = [];
    Store.data.plans.filter(p => p.active).forEach(p => {
      const client = Store.client(p.clientId); if (!client) return;
      let m = p.lastBilled ? U.addMonthsTo(p.lastBilled + '-01', 1).slice(0, 7) : p.startMonth;
      let guard = 0;
      while (m <= cur && guard++ < 24) {
        const day = Math.min(28, Math.max(1, Number(p.dayOfMonth) || 10));
        const seg = Store.seg(p.segmentId) || Store.data.segments[0];
        const d = Docs.blank('pedido', seg.id);
        const it = Pricing.blankItem(seg, firstType('servico'));
        Object.assign(it, { name: p.description, unit: 'serv', qty: 1, cost: Pricing.r2(Number(p.cost) || 0), price: Pricing.r2(p.amount), locked: true });
        it.margin = Pricing.marginOf(it.cost, it.price); it.baseMargin = it.margin;
        const [y, mm] = m.split('-');
        Object.assign(d, { clientId: client.id, date: `${m}-01` < U.today() ? `${m}-01` : U.today(), dueDate: `${y}-${mm}-${String(day).padStart(2, '0')}`, status: 'Concluído',
          items: [it], notes: `Plano mensal — ${mm}/${y}`, planId: p.id });
        if (d.date > d.dueDate) d.date = d.dueDate;
        const saved = Docs.save(d);
        made.push(saved.number);
        p.lastBilled = m; created++;
        m = U.addMonthsTo(m + '-01', 1).slice(0, 7);
      }
    });
    if (created) Store.save();
    return made;
  }
};

const Toast = {
  /* action: { label, fn } mostra um botão no aviso (ex.: Desfazer) */
  show(msg, type = 'info', action = null, ms) {
    if (!msg) return null;
    const tone = type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : type === 'warn' ? 'bg-amber-600' : 'bg-zinc-900';
    const el = document.createElement('div');
    el.className = `pointer-events-auto w-full rounded-xl px-4 py-3 text-sm text-white shadow-lg flex items-center justify-between gap-3 ${tone}`;
    el.setAttribute('role', type === 'error' ? 'alert' : 'status');
    const txt = document.createElement('span'); txt.textContent = msg; el.appendChild(txt);
    if (action) {
      const b = document.createElement('button');
      b.className = 'shrink-0 rounded-lg bg-white/15 hover:bg-white/25 px-3 py-1 font-semibold';
      b.textContent = action.label;
      b.addEventListener('click', () => { el.remove(); action.fn(); });
      el.appendChild(b);
    }
    $('#toast-root').appendChild(el);
    setTimeout(() => el.remove(), ms || (action ? 7000 : 3600));
    return el;
  }
};

/* DESFAZER: antes de uma exclusão guardamos uma cópia dos dados. Se nada mais for
   gravado nos próximos segundos, o botão "Desfazer" volta exatamente ao estado anterior.
   Se outra coisa for salva nesse meio-tempo, o desfazer é desativado (para não apagar
   o trabalho novo). */
const Undo = {
  snap: null, rev: -1, photos: null,
  capture() { this.snap = U.clone(Store.data); this.photos = Object.assign({}, Photos.cache); this.rev = -1; },
  touch() { if (this.snap && this.rev >= 0 && Store.rev !== this.rev) this.snap = null; },
  offer(msg) {
    if (!this.snap) return Toast.show(msg, 'success');
    this.rev = Store.rev;
    Toast.show(msg, 'info', { label: 'Desfazer', fn: () => this.restore() });
  },
  restore() {
    if (!this.snap || Store.rev !== this.rev) return Toast.show('Não dá mais para desfazer: algo novo foi salvo depois.', 'error');
    Store.data = this.snap; this.snap = null;
    Object.entries(this.photos || {}).forEach(([k, v]) => { if (!Photos.cache[k]) Photos.put(k, v); });
    Store.save(); App.renderSwitcher(); Router.render(); Toast.show('Exclusão desfeita.', 'success');
  }
};

/* MODAIS acessíveis: papel de diálogo, foco preso dentro da janela (Tab circula),
   Esc fecha e o foco volta para o botão que abriu. */
const Modal = {
  stack: [],
  open({ title, body, footer = '', size = 'max-w-lg', onMount, onClose }) {
    const el = document.createElement('div');
    const tid = U.uid('mt');
    el.dataset.modal = '1'; el._onClose = onClose; el._opener = document.activeElement;
    el.className = 'no-print fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4';
    el.innerHTML = `
      <div class="absolute inset-0 bg-zinc-900/40" data-action="modal-close"></div>
      <div class="relative w-full ${size} bg-white rounded-t-2xl sm:rounded-2xl shadow-xl max-h-[90vh] flex flex-col" role="dialog" aria-modal="true" aria-labelledby="${tid}">
        <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-100">
          <h2 class="text-base font-semibold text-zinc-900" id="${tid}">${U.esc(title)}</h2>
          <button class="btn btn-ghost btn-sm" data-action="modal-close" aria-label="Fechar">${icon('x')}</button>
        </div>
        <div class="px-5 py-4 overflow-y-auto" data-modal-body>${body}</div>
        ${footer ? `<div class="px-5 py-3 border-t border-zinc-100 flex flex-wrap justify-end gap-2 bg-zinc-50/60 rounded-b-2xl" style="padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px))">${footer}</div>` : ''}
      </div>`;
    $('#modal-root').appendChild(el);
    this.stack.push(el);
    if (onMount) onMount(el);
    const first = $('[data-modal-body] input:not([type=hidden]):not([readonly]), [data-modal-body] select, [data-modal-body] textarea:not([readonly])', el);
    const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    (first && !isTouch ? first : $('[role=dialog]', el)).focus({ preventScroll: true });
    $('[role=dialog]', el).tabIndex = -1;
    return el;
  },
  finish(root) {
    this.stack = this.stack.filter(x => x !== root); root.remove();
    if (root._onClose) root._onClose();
    if (root._opener && document.contains(root._opener)) root._opener.focus({ preventScroll: true });
  },
  closeFrom(el) { const root = el.closest('[data-modal]'); if (root) this.finish(root); },
  closeTop() { const el = this.stack[this.stack.length - 1]; if (el) this.finish(el); },
  closeAll() { [...this.stack].reverse().forEach(el => this.finish(el)); },
  trap(e) {
    const top = this.stack[this.stack.length - 1]; if (!top || e.key !== 'Tab') return;
    const f = $$('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])', top).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === a || !top.contains(document.activeElement))) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && (document.activeElement === z || !top.contains(document.activeElement))) { e.preventDefault(); a.focus(); }
  },
  confirm({ title = 'Confirmar', message, confirmLabel = 'Confirmar', danger = false, onConfirm, cancelLabel = 'Cancelar', onCancel }) {
    const root = this.open({
      title, size: 'max-w-md', body: `<div class="text-sm text-zinc-600">${message}</div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-cancel">${U.esc(cancelLabel)}</button>
               <button class="btn ${danger ? 'bg-red-600 text-white hover:bg-red-700' : 'btn-primary'}" data-action="modal-confirm">${U.esc(confirmLabel)}</button>`
    });
    root._onConfirm = onConfirm;
    root._onClose = () => { if (!root._confirmed && onCancel) onCancel(); };
    return root;
  }
};

/* Compartilhar ou baixar um arquivo (backup, CSV, etc.).
   No celular abre a folha de compartilhamento (WhatsApp, Drive...); no computador baixa. */
const FileOut = {
  async share(name, text, mime = 'application/json') {
    const blob = new Blob([text], { type: mime });
    try {
      const file = new File([blob], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] }) && window.matchMedia('(pointer: coarse)').matches) {
        await navigator.share({ files: [file], title: name });
        return 'shared';
      }
    } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
    this.download(name, blob);
    return 'downloaded';
  },
  download(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  },
  csv(rows) {
    const cell = v => { const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
  }
};

  pop: null, cur: null, ptr: 'mouse',
  enhance() {
    $$('label.label:not([data-h])').forEach(l => {

      if (!l.children.length && l.textContent.trim()) { const sp = document.createElement('span'); sp.className = 'label-t'; sp.textContent = l.textContent; l.textContent = ''; l.appendChild(sp); }
      const txt = l.textContent.trim().toLowerCase().replace(/\s*\(.*$/, '').replace(/[.:]+$/, '').trim();
      const hit = l.dataset.hk ? HELP.find(([k]) => k === l.dataset.hk) : HELP.find(([k]) => txt === k || txt.startsWith(k + ' ') || txt.startsWith(k + ' —'));
      if (!hit) return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'help-btn'; b.textContent = 'i';
      b.setAttribute('aria-label', 'Ajuda: ' + l.textContent.trim());

  show(b) {
    if (!this.pop) { this.pop = document.createElement('div'); this.pop.id = 'help-pop'; this.pop.setAttribute('role', 'tooltip'); document.body.appendChild(this.pop); }
    this.cur = b; this.pop.textContent = b.dataset.help; this.pop.style.display = 'block';
    const r = b.getBoundingClientRect(), pw = this.pop.offsetWidth, ph = this.pop.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    const left = Math.min(Math.max(8, r.left + r.width / 2 - pw / 2), Math.max(8, vw - pw - 8));
    let top = r.bottom + 8; if (top + ph > vh - 8) top = Math.max(8, r.top - ph - 8);
    this.pop.style.left = left + 'px'; this.pop.style.top = top + 'px';
  },

const Validate = {
  money(v) {
    if (v === '') return null;
    const n = U.num(v);
    if (isNaN(n)) return ['error', 'Digite apenas números.'];
    if (n < 0) return ['error', 'Não pode ser negativo.'];
    if (n > 9999999) return ['error', 'Valor alto demais. Confira.'];
    return null;
  },
  percent(v) {
    if (v === '') return null;
    const n = U.num(v);
    if (isNaN(n)) return ['error', 'Digite apenas números.'];
    if (n < -99) return ['error', 'A margem não pode ser menor que -99%.'];
    if (n > 10000) return ['error', 'Margem alta demais. Confira.'];
    if (n < 0) return ['warn', 'Margem negativa: você venderá abaixo do custo.'];
    return null;
  },
  required: v => (String(v).trim() ? null : ['error', 'Preencha este campo.']),
  digits: v => String(v).replace(/\D/g, ''),
  rules: {},
  key(el) { return el.dataset.vk || el.dataset.cf || el.dataset.f || el.dataset.co || el.dataset.pdv || el.dataset.doc || el.name || el.id || ''; },
  find(container, key) {
    return container && container.querySelector(`[data-cf="${key}"],[data-f="${key}"],[data-doc="${key}"],[data-pdv="${key}"],[name="${key}"],#${key}`);
  },
  mark(el, res) {
    this.clear(el);
    if (!res) return true;
    el.classList.add(res[0] === 'error' ? 'input-err' : 'input-warn');
    const m = document.createElement('p');
    m.className = 'field-msg text-xs mt-1 ' + (res[0] === 'error' ? 'text-red-600' : 'text-amber-600');
    m.textContent = res[1];
    const host = el.parentElement && el.parentElement.classList.contains('flex') ? el.parentElement : el;
    host.insertAdjacentElement('afterend', m); el._msg = m;
    return res[0] !== 'error';
  },
  clear(el) { el.classList.remove('input-err', 'input-warn'); if (el._msg) { el._msg.remove(); el._msg = null; } },
  live(el) {
    const r = this.rules[this.key(el)]; if (!r) return true;
    const ok = this.mark(el, r(el.value, el));
    const partners = { cost: ['price'], discountType: ['discount'], discType: ['disc'], date: ['dueDate'], price: [], type: [] }[this.key(el)] || [];
    const box = el.closest('[data-row]') || el.closest('.grid') || el.closest('[data-modal]') || el.closest('#main') || document;
    partners.forEach(k => { const other = this.find(box, k); if (other && other.value !== '') { const rr = this.rules[k]; if (rr) this.mark(other, rr(other.value, other)); } });
    return ok;
  },
  /* skip: seletor de uma área que NÃO entra nesta validação (ex.: o quadro de pagamento,
     que tem o próprio botão — não pode impedir de salvar o documento) */
  form(root, skip) {
    let first = null;
    $$('input,select,textarea', root).forEach(el => {
      if (el.type === 'file' || el.disabled) return;
      if (skip && el.closest(skip)) { this.clear(el); return; }
      const r = this.rules[this.key(el)]; if (!r) return;
      if (!this.mark(el, r(el.value, el)) && !first) first = el;
    });
    if (first) { first.focus(); if (first.scrollIntoView) first.scrollIntoView({ block: 'center' }); Toast.show('Corrija os campos marcados em vermelho.', 'error'); }
    return !first;
  }
};

      ${recent.length ? recent.map(docRow).join('') : emptyState('Nada por aqui ainda', 'Crie seu primeiro orçamento ou faça uma venda rápida.')}
    </div>`;
};

/* Avisos da visão geral: só aparecem quando há algo para fazer. */
const Alerts = {
  list() {
    const s = sid(), out = [], today = U.today();
    const st = Store.data.settings, last = Store.data.ui.lastBackup, every = Number(st.backupRemindDays) || 7;
    if (Store.data.documents.length && (!last || U.daysBetween(last.slice(0, 10), today) >= every))
      out.push(['amber', `${last ? `Seu último backup foi em ${U.fmtDate(last.slice(0, 10))}` : 'Você ainda não fez backup'}. Os dados ficam só neste aparelho.`, `<button class="font-medium underline" data-action="backup-file">Fazer backup agora</button>`]);
    const late = Finance.scoped(s).filter(d => Finance.isOverdue(d));
    if (late.length) out.push(['red', `${late.length} cobrança(s) atrasada(s), somando ${U.money(Finance.overdueTotal(s))}.`, `<a href="#/financeiro" data-nav data-action="fin-goto-receber" class="font-medium underline">Ver</a>`]);
    const pay = Store.data.expenses.filter(e => !e.paidAt && e.due <= U.addDays(3) && (s === 'all' || !e.segmentId || e.segmentId === s));
    if (pay.length) out.push(['orange', `${pay.length} conta(s) a pagar vencendo até ${U.fmtDate(U.addDays(3)).slice(0, 5)} (${U.money(U.sum(pay, e => e.amount))}).`, `<a href="#/financeiro" data-nav data-action="fin-goto-pagar" class="font-medium underline">Ver</a>`]);
    const low = StockOps.lowList();
    if (low.length) out.push(['amber', `${low.length} item(ns) com estoque baixo ou zerado: ${low.slice(0, 3).map(p => U.esc(prodName(p))).join(', ')}${low.length > 3 ? '…' : ''}`, `<a href="#/estoque" data-nav class="font-medium underline">Ver estoque</a>`]);
    const mm = today.slice(5, 7), bd = Store.data.clients.filter(c => c.birthday && c.birthday.slice(5, 7) === mm);
    if (bd.length) out.push(['pink', `Aniversariantes do mês: ${bd.slice(0, 4).map(c => `<a href="#/cliente/${c.id}" data-nav class="underline">${U.esc(c.name)}</a> (${c.birthday.slice(8, 10)})`).join(', ')}${bd.length > 4 ? '…' : ''}`, '']);
    const expQ = Finance.scoped(s).filter(d => d.kind === 'orcamento' && ['Rascunho', 'Enviado'].includes(d.status) && d.validUntil && d.validUntil >= today && d.validUntil <= U.addDays(2));
    if (expQ.length) out.push(['sky', `${expQ.length} orçamento(s) vencem em até 2 dias. Bom momento para falar com o cliente.`, `<a href="#/documentos" data-nav class="font-medium underline">Ver</a>`]);
    return out;
  },
  html() {
    const tone = { amber: 'bg-amber-50 text-amber-800', red: 'bg-red-50 text-red-800', orange: 'bg-orange-50 text-orange-800', pink: 'bg-pink-50 text-pink-800', sky: 'bg-sky-50 text-sky-800' };
    const l = this.list();
    return l.length ? `<div class="space-y-2 mb-6">${l.map(([t, msg, act]) => `<div class="rounded-xl ${tone[t]} text-sm px-4 py-3 flex flex-wrap items-center justify-between gap-2"><span>${msg}</span>${act ? `<span class="shrink-0">${act}</span>` : ''}</div>`).join('')}</div>` : '';
  }
};

  const f = UI.f.docs, box = $('#list-docs'); if (!box) return;

  const list = Finance.scoped(sid()).filter(d => {
    if (f.kind !== 'all' && d.kind !== f.kind) return false;
    if (f.status === 'abertos' && !['Rascunho', 'Enviado', 'Aprovado', 'Aberto', 'Em andamento'].includes(d.status)) return false;
    if (f.status !== 'all' && f.status !== 'abertos' && d.status !== f.status) return false;

/* ============================================================
   10. EDITOR DE ORÇAMENTO / PEDIDO / OS / VENDA
   - O "draft" é uma cópia em memória; só vai para o banco ao salvar.
   - A digitação atualiza a tela de forma cirúrgica (sem recriar os campos),
     para o cursor não pular.
   - Ações que mexem em dinheiro já gravado (pagamento, cancelamento com estorno,
     devolução) salvam na hora, porque não podem ficar "meio feitas".
   ============================================================ */
const EVENT_LABEL = {
  criado: 'Criado', status: 'Status', enviado: 'Enviado ao cliente', convertido: 'Convertido', origem: 'Origem',
  pagamento: 'Pagamento', 'pagamento-removido': 'Pagamento removido', devolucao: 'Devolução', cancelado: 'Cancelado',
  assinatura: 'Assinatura do cliente', parcelas: 'Parcelas', multa: 'Multa e juros', recusado: 'Recusado'
};

const Editor = {
  draft: null, dirty: false, active: false, tab: 'material', pending: null,

  open(id, kind) {
    this.active = true; this.dirty = false; this.tab = 'material';
    if (id === 'draft' && this.pending) { this.draft = this.pending; this.pending = null; this.dirty = true; return true; }
    if (id === 'new') {
      const s = sid() === 'all' ? Store.data.segments[0].id : sid();
      this.draft = Docs.blank(kind && kind !== 'pdv' && KINDS[kind] ? kind : 'orcamento', s);
      if (this.draft.kind === 'os') Docs.normalize(this.draft).os.checklist = (Store.data.settings.osChecklist || []).map(t => ({ text: t, done: false }));
      /* "Novo orçamento" a partir da ficha do cliente já vem com ele escolhido */
      if (this.presetClient && Store.client(this.presetClient)) {
        const c = Store.client(this.presetClient), d = this.draft; d.clientId = c.id;
        if (Number(c.discountPct) > 0) Object.assign(d, { discountType: 'percent', discount: Number(c.discountPct), discountLabel: c.discountLabel || 'Desconto do cliente', autoDiscount: true });
      }
      this.presetClient = null;
      return true;
    }
    const d = Docs.get(id);
    if (!d) { Toast.show('Documento não encontrado.', 'error'); return false; }
    this.draft = Docs.normalize(U.clone(d));
    if (this.draft.items.length && this.draft.items.every(i => isSvc(i))) this.tab = 'servico';
    return true;
  },

  statusOptions(d) {
    const list = STATUS_MANUAL[d.kind].slice();
    if (!list.includes(d.status)) list.push(d.status);
    return list.map(s => [s, s]);
  },

  shell() {
    const d = this.draft, k = KINDS[d.kind], exists = Docs.exists(d.id);
    const origin = d.originId && Docs.get(d.originId);
    const conv = (d.convertedTo || []).map(id => Docs.get(id)).filter(Boolean);

    return `
    <div class="flex flex-wrap items-start justify-between gap-3 mb-6">
      <div class="min-w-0">
        <a href="#/documentos" data-nav class="text-sm text-zinc-500 hover:text-zinc-900 inline-flex items-center gap-1">${icon('back')} Voltar</a>
        <h1 class="text-2xl font-semibold tracking-tight mt-1 flex flex-wrap items-center gap-2" id="ed-title">${k.label} <span class="text-zinc-400">${d.number ? U.esc(d.number) : '(novo)'}</span> <span id="ed-status-badge">${exists ? statusBadge(d.status) : ''}</span></h1>
        ${d.originNumber ? `<p class="text-sm text-zinc-500">Gerado do orçamento ${origin ? `<a href="#/doc/${origin.id}" data-nav class="text-indigo-600 hover:underline">${U.esc(d.originNumber)}</a>` : U.esc(d.originNumber)}</p>` : ''}
        ${conv.length ? `<p class="text-sm text-zinc-500">Convertido em ${conv.map(x => `<a href="#/doc/${x.id}" data-nav class="text-indigo-600 hover:underline">${U.esc(x.number)}</a>`).join(', ')}</p>` : ''}
      </div>
      <div class="flex flex-wrap gap-2 no-print">
        ${btn('ed-print', 'PDF', 'printer')}
        ${btn('ed-share', 'Enviar', 'send')}
        ${d.kind === 'os' ? btn('ed-print-tech', 'Via do técnico', 'wrench') : ''}
        ${d.kind === 'pdv' ? btn('ed-receipt', 'Cupom', 'receipt') : ''}
        ${d.kind === 'orcamento' && exists && !['Recusado'].includes(d.status) ? btn('ed-convert-open', 'Converter', 'swap') : ''}
        ${exists ? btn('ed-duplicate', 'Duplicar', 'copy') : ''}
        ${exists && Finance.isBillable(d) && isDone(d.status) && d.items.some(i => i.productId || i.qty) ? btn('ed-return', 'Devolver itens', 'undo') : ''}
        ${exists ? btn('ed-delete', 'Excluir', 'trash', 'btn-danger') : ''}
        <button class="btn btn-primary hidden lg:inline-flex" data-action="ed-save">${icon('check')} Salvar</button>

    </div>
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-6 min-w-0">

          <div class="grid grid-cols-2 gap-4">

              <button class="btn btn-secondary" data-action="ed-new-client" aria-label="Novo cliente">${icon('plus')}</button></div>
              ${!d.clientId && d.customerName ? `<p class="text-xs text-zinc-500 mt-1">Nome digitado na venda: ${U.esc(d.customerName)}</p>` : ''}</div>
