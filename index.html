/* ---- 11b-batch.js ---- */
/* ============================================================
   13b. RECEBIMENTO EM LOTE + EXTRATO DE COBRANÇA
   Ideia central: um lote NÃO substitui os pagamentos normais. Ele cria um pagamento comum
   em cada documento (marcado com batchId) e guarda um registro do lote em Store.data.batches.
   Assim saldo, parcelas, status e caixa continuam funcionando sem nenhuma regra nova, e o
   lote serve para: um recibo só, uma linha só no caixa e estorno de tudo de uma vez.
   Regra do dinheiro: o valor recebido quita os documentos do MAIS ANTIGO para o mais novo;
   se sobrar, a sobra vira crédito do cliente (somente cliente cadastrado).
   O extrato de cobrança não grava nada: é calculado na hora a partir dos documentos.
   ============================================================ */
const Batch = {
  order: docs => docs.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || String(a.number).localeCompare(String(b.number))),
  nextNumber() {
    const n = Math.max(0, ...Store.data.batches.map(b => parseInt(String(b.number).replace(/\D/g, ''), 10) || 0));
    return 'LT-' + String(n + 1).padStart(4, '0');
  },
  /* Distribui o valor pelos documentos, do mais antigo ao mais novo. Não grava nada. */
  allocate(docs, amount) {
    let left = Pricing.r2(Math.max(0, Number(amount) || 0));
    const parts = [];
    this.order(docs).forEach(d => {
      const bal = Finance.balance(d), v = Pricing.r2(Math.min(bal, left));
      if (v > 0.004) { parts.push({ doc: d, amount: v, full: v >= bal - 0.004, bal }); left = Pricing.r2(left - v); }
    });
    return { parts, excess: Math.max(0, left) };
  },
  /* Grava o lote: um pagamento por documento + registro do lote + crédito da sobra. */
  create({ clientId, name, docs, amount, method, date, note = '' }) {
    const alloc = this.allocate(docs, amount);
    if (!clientId) alloc.excess = 0;
    const number = this.nextNumber(), id = U.uid('lot');
    const seg = alloc.parts.length ? alloc.parts[0].doc.segmentId : this.order(docs)[0].segmentId;
    const s = CashBox.current(seg);
    const b = { id, number, clientId: clientId || '', name, date, at: U.now(), method, note, amount: 0, excess: Pricing.r2(alloc.excess), segmentId: seg, parts: [], creditId: '' };
    if (s && date === U.today()) b.sessionId = s.id;
    alloc.parts.forEach(({ doc, amount: v }) => {
      const p = Finance.addPayment(doc, { amount: v, method, date, note: `Lote ${number}` + (note ? ' · ' + note : '') });
      p.batchId = id;
      Docs.event(doc, 'pagamento', `${U.money(v)} em ${method} (lote ${number})`);
      b.parts.push({ docId: doc.id, payId: p.id, number: doc.number, date: doc.date, amount: v });
    });
    if (b.excess > 0.004) {
      const c = { id: U.uid('cr'), clientId, date, amount: b.excess, note: `Sobra do lote ${number}`, docId: '', batchId: id };
      Store.data.credits.push(c); b.creditId = c.id;
    }
    b.amount = Pricing.r2(U.sum(b.parts, x => x.amount) + b.excess);
    Store.data.batches.push(b);
    return b;
  },
  /* Estorno: remove os pagamentos de todos os documentos e o crédito da sobra. */
  void(id) {
    const b = Store.data.batches.find(x => x.id === id); if (!b || b.voidedAt) return;
    if (b.excess > 0.004 && Finance.creditBalance(b.clientId) < b.excess - 0.004)
      return Toast.show('O crédito gerado por este lote já foi usado em outra compra. Ajuste o crédito do cliente antes de estornar.', 'error', null, 6500);
    Undo.capture();
    b.parts.forEach(pt => {
      const d = Docs.get(pt.docId); if (!d) return;
      const p = Finance.removePayment(d, pt.payId);
      if (p) Docs.event(d, 'pagamento-removido', `${U.money(p.amount)} em ${p.method} (estorno do lote ${b.number})`);
    });
    if (b.creditId) { const i = Store.data.credits.findIndex(c => c.id === b.creditId); if (i >= 0) Store.data.credits.splice(i, 1); }
    b.voidedAt = U.now();
    Store.save(); Router.render();
    Undo.offer(`Lote ${b.number} estornado.`);
  },

  /* ---------- Janela de seleção ---------- */
  open(key) {
    const g = UI.people && UI.people[key]; if (!g) return;
    const docs = this.order(g.docs), credit = g.clientId ? Finance.creditBalance(g.clientId) : 0;
    const today = U.today();
    const row = d => `<label class="flex items-start gap-3 rounded-xl border border-zinc-200 px-3 py-2.5 cursor-pointer hover:bg-zinc-50">
        <input type="checkbox" class="w-4 h-4 mt-1 rounded shrink-0" data-bdoc="${d.id}" checked>
        <div class="min-w-0 flex-1">
          <div class="flex items-baseline justify-between gap-2"><span class="font-medium text-sm text-zinc-900">${U.esc(d.number)} <span class="text-xs font-normal text-zinc-500">· ${U.fmtDate(d.date)}</span></span>
            <span class="font-semibold tabular-nums text-orange-600 text-sm">${U.money(Finance.balance(d))}</span></div>
          <div class="text-xs text-zinc-500 truncate">${U.esc(Statement.summarize(d, 3))}</div>
          <div class="mt-1">${dueBadge(d)}</div></div></label>`;
    const root = Modal.open({ title: `Receber vários — ${g.name}`, size: 'max-w-xl',
      body: `<div class="flex flex-wrap items-center justify-between gap-2 mb-2">
          <label class="label !mb-0">Documentos a receber</label>
          <div class="flex flex-wrap gap-1.5">
            <button class="btn btn-secondary btn-sm" data-action="batch-sel" data-mode="all">Todos</button>
            <button class="btn btn-secondary btn-sm" data-action="batch-sel" data-mode="late">Só atrasados</button>
            <button class="btn btn-secondary btn-sm" data-action="batch-sel" data-mode="none">Limpar</button></div></div>
        <div class="space-y-2 max-h-60 overflow-y-auto pr-1" id="b-list">${docs.map(row).join('')}</div>
        <div class="flex items-center justify-between rounded-xl bg-zinc-50 px-3 py-2 mt-3 text-sm"><span class="text-zinc-600" id="b-count"></span><span class="font-semibold tabular-nums" id="b-total"></span></div>
        <div class="grid grid-cols-2 gap-3 mt-4">
          <div class="col-span-2"><label class="label">Valor recebido do cliente</label>${numInput('name="batchAmount"', 0)}</div>
          <div class="col-span-2 text-xs rounded-xl px-3 py-2 bg-indigo-50 text-indigo-700" id="b-preview"></div>
          <div><label class="label">Forma</label><select class="input" name="method">${opts(METHODS.map(m => [m, m]), 'Pix')}</select></div>
          <div><label class="label">Data</label><input type="date" class="input" name="date" value="${today}"></div>
          <div class="col-span-2"><label class="label">Observação do recebimento</label><input class="input" name="note" placeholder="Opcional"></div>
        </div>
        ${credit > 0.004 ? `<p class="text-xs text-zinc-500 mt-3">Este cliente tem ${U.money(credit)} de crédito. Para usá-lo, receba documento por documento escolhendo a forma “Crédito”.</p>` : ''}`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button>
        <button class="btn btn-secondary" data-action="batch-statement">${icon('send')} Extrato / cobrar</button>
        <button class="btn btn-primary" data-action="batch-save">Receber</button>`,
      onMount: r => {
        r.addEventListener('change', e => { if (e.target.dataset.bdoc) { r._dirty = false; this.sync(r); } });
        r.addEventListener('input', e => { if (e.target.name === 'batchAmount') { r._dirty = true; this.preview(r); } });
      } });
    Object.assign(root, { _docs: docs, _name: g.name, _clientId: g.clientId || '', _dirty: false });
    this.sync(root);
  },
  selected(root) { return root._docs.filter(d => { const c = root.querySelector(`[data-bdoc="${d.id}"]`); return c && c.checked; }); },
  /* Atualiza total e valor sugerido. O valor continua 100% editável: se você digitou, não mexemos mais nele. */
  sync(root) {
    const sel = this.selected(root), total = Pricing.r2(U.sum(sel, d => Finance.balance(d)));
    root._sel = sel; root._total = total;
    $('#b-count', root).textContent = `${sel.length} de ${root._docs.length} selecionado(s)`;
    $('#b-total', root).textContent = 'Total: ' + U.money(total);
    const inp = $('[name="batchAmount"]', root);
    if (!root._dirty) inp.value = U.dec(total);
    this.preview(root);
    if (inp.value !== '') Validate.live(inp);
  },
  preview(root) {
    const box = $('#b-preview', root), amt = U.num($('[name="batchAmount"]', root).value) || 0;
    if (!root._sel.length) { box.textContent = 'Marque pelo menos um documento.'; return; }
    if (amt <= 0) { box.textContent = 'Digite o valor que o cliente está pagando.'; return; }
    const a = this.allocate(root._sel, amt), full = a.parts.filter(p => p.full), part = a.parts.find(p => !p.full);
    let t = full.length ? `Quita ${full.length} documento(s)` : 'Nenhum documento será quitado por inteiro';
    if (part) t += `${full.length ? ' e paga ' : '; paga '}${U.money(part.amount)} do ${part.doc.number} (continua faltando ${U.money(Pricing.r2(part.bal - part.amount))})`;
    if (a.excess > 0.004) t += root._clientId ? `. Sobram ${U.money(a.excess)}: viram crédito do cliente.` : `. Sobram ${U.money(a.excess)}, mas este cliente não está cadastrado: reduza o valor.`;
    box.textContent = t.replace(/\.$/, '') + '.';
  },
  select(root, mode) {
    const today = U.today();
    root._docs.forEach(d => { const c = root.querySelector(`[data-bdoc="${d.id}"]`); if (c) c.checked = mode === 'all' || (mode === 'late' && Finance.overdueAmount(d, today) > 0.004); });
    root._dirty = false; this.sync(root);
  },
  save(el) {
    const root = el.closest('[data-modal]'), f = formData(root);
    this.sync(root);
    if (!root._sel.length) return Toast.show('Marque pelo menos um documento.', 'error');
    if (!Validate.form(root)) return;
    const amt = Pricing.r2(U.num(f.batchAmount) || 0);
    if (amt <= 0) return Toast.show('Informe um valor maior que zero.', 'error');
    if (!root._clientId && amt > root._total + 0.004) return Toast.show('Cliente sem cadastro: o valor não pode passar do total selecionado.', 'error');
    const b = this.create({ clientId: root._clientId, name: root._name, docs: root._sel, amount: amt, method: f.method, date: f.date || U.today(), note: (f.note || '').trim() });
    Store.save(); Modal.closeFrom(el);
    Toast.show(`Lote ${b.number} recebido: ${U.money(b.amount)}.`, 'success', { label: 'Recibo', fn: () => this.receipt(b.id) }, 8000);
    Router.render();
  },

  /* ---------- Lista de lotes (aba A receber › Lotes recebidos) ---------- */
  listHtml() {
    const all = Store.data.batches.filter(b => sid() === 'all' || b.segmentId === sid()).slice().sort((a, b) => (b.date + b.at).localeCompare(a.date + a.at));
    if (!all.length) return emptyState('Nenhum lote recebido', 'Quando você receber vários documentos de uma vez (botão “Receber vários” na lista por pessoa), eles aparecem aqui.');
    return all.map(b => `<div class="px-4 py-3 border-t border-zinc-100 first:border-t-0 ${b.voidedAt ? 'opacity-60' : ''}">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="min-w-0"><div class="font-medium text-zinc-900">${U.esc(b.number)} · ${U.esc(b.name || 'Sem nome')} ${b.voidedAt ? badge('Estornado', 'bg-zinc-100 text-zinc-600 ring-zinc-200') : badge('Recebido', 'bg-emerald-50 text-emerald-700 ring-emerald-200')}</div>
            <div class="text-xs text-zinc-500">${U.fmtDate(b.date)} · ${U.esc(b.method)} · ${b.parts.length} documento(s)${b.excess > 0.004 ? ` · ${U.money(b.excess)} viraram crédito` : ''}${b.note ? ' · ' + U.esc(b.note) : ''}</div></div>
          <div class="flex items-center gap-2"><span class="font-semibold tabular-nums ${b.voidedAt ? 'line-through text-zinc-500' : 'text-emerald-700'}">${U.money(b.amount)}</span>
            ${b.voidedAt ? '' : `<button class="btn btn-secondary btn-sm" data-action="batch-receipt" data-id="${b.id}">${icon('receipt')} Recibo</button><button class="btn btn-secondary btn-sm text-red-600" data-action="batch-void" data-id="${b.id}">Estornar</button>`}</div></div>
        <div class="text-xs text-zinc-500 mt-1 truncate">${b.parts.map(p => U.esc(p.number) + ' ' + U.money(p.amount)).join(' · ')}</div></div>`).join('');
  },
  askVoid(id) {
    const b = Store.data.batches.find(x => x.id === id); if (!b) return;
    Modal.confirm({ title: `Estornar lote ${b.number}?`, danger: true, confirmLabel: 'Estornar lote', onConfirm: () => this.void(id),
      message: `Os ${b.parts.length} pagamento(s) deste lote (${U.money(b.amount)}) serão removidos de cada documento, que voltam a ficar em aberto${b.excess > 0.004 ? `, e o crédito de ${U.money(b.excess)} será retirado do cliente` : ''}. Você poderá desfazer logo em seguida.` });
  },

  /* ---------- Recibo único do lote ---------- */
  receiptHtml(b, width) {
    const co = Store.data.company, seg = Store.seg(b.segmentId);
    const rest = b.parts.map(p => { const d = Docs.get(p.docId); return d ? Finance.balance(d) : 0; });
    const left = Pricing.r2(U.sum(rest, x => x));
    if (width === 'a4') {
      return `<div class="ps" style="--ac:${U.color(seg ? seg.color : '#4f46e5')}">${Print.header({ number: b.number }, 'Recibo de pagamento')}
        <div class="ps-sec"><div class="ps-total" style="display:flex;justify-content:space-between"><span>Valor recebido</span><span>${U.money(b.amount)}</span></div></div>
        <div class="ps-sec ps-text" style="font-size:14px;line-height:1.7">Recebi(emos) de <strong>${U.esc(b.name || 'Consumidor')}</strong> a importância de <strong>${U.money(b.amount)}</strong> (${U.esc(Extenso.reais(b.amount))}), paga em ${U.esc(b.method)} no dia ${U.fmtDate(b.date)}, referente aos documentos abaixo.</div>
        <div class="ps-sec"><table class="ps-t"><thead><tr><th>Documento</th><th>Emissão</th><th class="ps-r">Valor pago</th><th class="ps-r">Saldo restante</th></tr></thead><tbody>
          ${b.parts.map((p, i) => `<tr><td>${U.esc(p.number)}</td><td>${U.fmtDate(p.date)}</td><td class="ps-r">${U.money(p.amount)}</td><td class="ps-r">${U.money(rest[i])}</td></tr>`).join('')}
          ${b.excess > 0.004 ? `<tr><td colspan="2">Sobra mantida como crédito do cliente</td><td class="ps-r">${U.money(b.excess)}</td><td class="ps-r">—</td></tr>` : ''}
          </tbody></table></div>
        <div class="ps-grid2"><div class="ps-box"><div class="ps-kv"><span class="ps-muted">Recibo</span><span>${U.esc(b.number)}</span></div><div class="ps-kv"><span class="ps-muted">Data</span><span>${U.fmtDate(b.date)}</span></div><div class="ps-kv"><span class="ps-muted">Forma</span><span>${U.esc(b.method)}</span></div>${b.note ? `<div class="ps-kv"><span class="ps-muted">Obs.</span><span>${U.esc(b.note)}</span></div>` : ''}</div>
          <div class="ps-box"><div class="ps-kv"><span class="ps-muted">Documentos quitados</span><span>${b.parts.filter((p, i) => rest[i] <= 0.004).length} de ${b.parts.length}</span></div><div class="ps-kv"><span class="ps-muted">Saldo restante</span><span><strong>${U.money(left)}</strong></span></div></div></div>
        <div class="ps-sign" style="grid-template-columns:1fr"><div>${U.esc(co.name)}${co.doc ? ' · ' + U.esc(co.doc) : ''}</div></div>
        <div class="ps-foot">Recibo sem valor fiscal.</div></div>`;
    }
    return `<div class="rcpt w${width}">
      <div class="c b">${U.esc(co.name)}</div>${co.doc ? `<div class="c">${U.esc(co.doc)}</div>` : ''}${co.phone ? `<div class="c">${U.esc(co.phone)}</div>` : ''}
      <div class="hr"></div><div class="c b">RECIBO ${U.esc(b.number)}</div><div class="hr"></div>
      <div>Recebi de ${U.esc(b.name || 'Consumidor')} a importância de</div><div class="big c">${U.money(b.amount)}</div><div>(${U.esc(Extenso.reais(b.amount))})</div>
      <div class="row"><span>Forma</span><span>${U.esc(b.method)}</span></div><div class="row"><span>Data</span><span>${U.fmtDate(b.date)}</span></div>
      <div class="hr"></div><div class="b">Documentos pagos</div>
      ${b.parts.map(p => `<div class="row"><span>${U.esc(p.number)}</span><span>${U.money(p.amount)}</span></div>`).join('')}
      ${b.excess > 0.004 ? `<div class="row"><span>Crédito do cliente</span><span>${U.money(b.excess)}</span></div>` : ''}
      <div class="hr"></div><div class="row b"><span>Saldo restante</span><span>${U.money(left)}</span></div>
      <div style="margin-top:28px;border-top:1px solid #000;text-align:center;padding-top:2px">${U.esc(co.name)}</div>
      <div class="hr"></div>${Print.receiptFoot() ? `<div class="c">${U.esc(Print.receiptFoot())}</div>` : ''}<div class="c">Sem valor fiscal</div></div>`;
  },
  receipt(id) {
    const b = Store.data.batches.find(x => x.id === id); if (!b) return;
    let width = Store.data.settings.receiptWidth || '80';
    Print.preview({
      title: 'Recibo do lote', fileName: `Recibo ${b.number}`, paper: width === 'a4' ? 'a4' : width,
      render: () => this.receiptHtml(b, width),
      controls: `<div class="mb-3"><label class="label">Papel</label><select class="input" data-print-width>${opts([['58', 'Bobina 58 mm'], ['80', 'Bobina 80 mm'], ['a4', 'Folha A4']], width)}</select></div>`,
      onMount: r => r.addEventListener('input', e => { if (e.target.dataset.printWidth !== undefined) { width = e.target.value; Print.switchPaper(width); } })
    });
  }
};

const Statement = {
  opts: { level: 'resumido', pix: true },
  LEVELS: [['resumido', 'Resumido: o que foi pedido e o valor de cada pedido'], ['detalhado', 'Detalhado: cada item com quantidade e preço']],
  /* "2× Tomada, 1× Disjuntor e mais 3" */
  summarize(d, max = 3) {
    const its = (d.items || []).filter(i => Number(i.qty) > 0).map(i => `${U.n2(i.qty)}× ${i.name}`);
    if (!its.length) return d.scope ? String(d.scope).slice(0, 60) : KINDS[d.kind].label;
    return its.slice(0, max).join(', ') + (its.length > max ? ` e mais ${its.length - max}` : '');
  },
  /* Uma linha do extrato por documento: de onde vem o valor cobrado. Multa/juros calculados NÃO entram. */
  row(d) {
    const t = Pricing.totals(d), disc = t.effectiveDiscount, ret = Finance.goodsReturned(d), extra = Finance.fees(d), paid = Finance.keptPaid(d), bal = Finance.balance(d);
    const parts = [`Pedido ${U.money(t.subtotal)}`];
    if (disc > 0.004) parts.push(`− desconto${d.discountLabel ? ' (' + d.discountLabel + ')' : ''} ${U.money(disc)}`);
    if (ret > 0.004) parts.push(`− devolução ${U.money(ret)}`);
    if (extra > 0.004) parts.push(`+ acréscimo ${U.money(extra)}`);
    if (paid > 0.004) parts.push(`− já pago ${U.money(paid)}`);
    return { d, date: d.date, title: `${KINDS[d.kind].label} ${d.number}`, what: this.summarize(d, 3), items: (d.items || []).filter(i => Number(i.qty) > 0),
      subtotal: t.subtotal, disc, ret, extra, paid, bal, net: Finance.netTotal(d), why: parts.length > 1 ? parts.join(' ') + ` = ${U.money(bal)}` : '' };
  },
  rows: docs => Batch.order(docs).map(d => Statement.row(d)),
  total: rows => Pricing.r2(U.sum(rows, r => r.bal)),

  /* Texto amigável para o WhatsApp */
  text(docs, name, level) {
    const co = Store.data.company, rows = this.rows(docs), total = this.total(rows), first = (name || '').split(' ')[0];
    const L = [`Olá${first ? ', ' + first : ''}! Tudo bem? 😊`, `Preparei um resumo do que está em aberto com ${co.name}, para ficar tudo bem claro:`, ''];
    rows.forEach(r => {
      L.push(`📅 *${U.fmtDate(r.date)}* — ${r.title}`);
      if (level === 'detalhado') r.items.forEach(i => L.push(`   • ${U.n2(i.qty)} ${i.unit} ${i.name}: ${U.money(i.price)} cada = ${U.money(Pricing.lineTotal(i))}`));
      else L.push(`   ${r.what}`);
      if (r.why) L.push(`   ${r.why}`);
      else L.push(`   Valor: ${U.money(r.bal)}`);
      L.push(`   ➜ *Falta pagar: ${U.money(r.bal)}*`, '');
    });
    L.push(`💰 *Total em aberto: ${U.money(total)}*`);
    if (Pix.enabled() && total > 0.004) L.push('', 'Se preferir, é só pagar pelo Pix copia e cola:', Pix.payload(total, 'EXTRATO'));
    L.push('', 'Qualquer dúvida é só me chamar. Obrigado pela confiança! 🙏');
    if (co.phone) L.push(`${co.name} · ${co.phone}`);
    return L.join('\n');
  },

  /* Folha A4 do extrato */
  html(docs, name, clientId, o = this.opts) {
    const co = Store.data.company, rows = this.rows(docs), total = this.total(rows), det = o.level === 'detalhado';
    const cell = r => {
      const main = `<tr><td style="white-space:nowrap">${U.fmtDate(r.date)}</td><td><strong>${U.esc(r.title)}</strong>${det ? '' : `<div class="ps-muted">${U.esc(r.what)}</div>`}${r.why ? `<div class="ps-muted">${U.esc(r.why)}</div>` : ''}</td><td class="ps-r">${U.money(r.net)}</td><td class="ps-r">${r.paid > 0.004 ? '− ' + U.money(r.paid) : '—'}</td><td class="ps-r"><strong>${U.money(r.bal)}</strong></td></tr>`;
      if (!det) return main;
      return main + `<tr><td></td><td colspan="4"><table class="ps-t" style="margin:0"><thead><tr><th>Item</th><th class="ps-r">Qtd.</th><th class="ps-r">Valor unit.</th><th class="ps-r">Total</th></tr></thead><tbody>${r.items.map(i => `<tr><td>${U.esc(i.name)}</td><td class="ps-r">${U.n2(i.qty)} ${U.esc(i.unit)}</td><td class="ps-r">${U.money(i.price)}</td><td class="ps-r">${U.money(Pricing.lineTotal(i))}</td></tr>`).join('')}</tbody></table>
        ${r.disc > 0.004 || r.ret > 0.004 || r.extra > 0.004 ? `<div class="ps-muted" style="margin-top:3px">${r.disc > 0.004 ? `Desconto${r.d.discountLabel ? ' (' + U.esc(r.d.discountLabel) + ')' : ''}: − ${U.money(r.disc)}. ` : ''}${r.ret > 0.004 ? `Devolução: − ${U.money(r.ret)}. ` : ''}${r.extra > 0.004 ? `Acréscimo: + ${U.money(r.extra)}.` : ''}</div>` : ''}</td></tr>`;
    };
    const pix = o.pix !== false && Pix.enabled() && total > 0.004 ? (() => { const code = Pix.payload(total, 'EXTRATO'); return `<div class="ps-qr"><img src="${Pix.qr(code)}" alt="QR Code Pix"><div><div class="ps-strong">Pague com Pix: ${U.money(total)}</div><div class="ps-muted">Abra o app do banco, escolha Pix &gt; Ler QR Code ou use o código copia e cola:</div><div class="ps-code">${U.esc(code)}</div><div class="ps-muted" style="margin-top:4px">Recebedor: ${U.esc(Store.data.settings.pix.name)}</div></div></div>`; })() : '';
    return `<div class="ps" style="--ac:#4f46e5">${Print.header({ number: U.fmtDate(U.today()) }, 'Extrato de cobrança')}
      <div class="ps-grid2">${Print.clientBox({ clientId, customerName: name })}<div class="ps-box"><div class="ps-kv"><span class="ps-muted">Documentos em aberto</span><span>${rows.length}</span></div><div class="ps-kv"><span class="ps-muted">Emitido em</span><span>${U.fmtDate(U.today())}</span></div></div></div>
      <div class="ps-sec"><div class="ps-sec-title">O que está em aberto</div>
        <table class="ps-t"><thead><tr><th>Data</th><th>Pedido</th><th class="ps-r">Valor</th><th class="ps-r">Já pago</th><th class="ps-r">A pagar</th></tr></thead><tbody>${rows.map(cell).join('')}</tbody></table></div>
      <div class="ps-totals"><div class="ps-total"><span>Total a pagar</span><span>${U.money(total)}</span></div></div>
      ${pix}
      <div class="ps-foot">${co.footer ? U.esc(co.footer) + ' · ' : ''}Extrato informativo, sem valor fiscal.</div></div>`;
  },
  pdf(docs, name, clientId) {
    Print.preview({
      title: 'Extrato de cobrança', fileName: `Extrato ${name || 'cliente'}`.trim(),
      render: () => this.html(docs, name, clientId),
      controls: `<div class="grid sm:grid-cols-2 gap-3 mb-4"><div><label class="label">Nível de detalhe</label><select class="input" data-stmt="level">${opts(this.LEVELS, this.opts.level)}</select></div>
        ${Pix.enabled() ? `<label class="flex items-center gap-2 text-sm self-end pb-2"><input type="checkbox" class="w-4 h-4 rounded" data-stmt="pix" ${this.opts.pix !== false ? 'checked' : ''}> Incluir QR Code Pix</label>` : ''}</div>`,
      onMount: r => r.addEventListener('input', e => {
        const k = e.target.dataset.stmt; if (!k) return;
        this.opts[k] = k === 'pix' ? e.target.checked : e.target.value; Print.refresh();
      })
    });
  },

  /* Janela: escolher nível, ajustar a mensagem, abrir PDF ou WhatsApp */
  open(docs, name, clientId) {
    if (!docs.length) return Toast.show('Marque pelo menos um documento.', 'error');
    const c = Store.client(clientId);
    let ph = U.digits(c ? c.phone : ''); if (ph.length === 10 || ph.length === 11) ph = '55' + ph;
    const root = Modal.open({ title: `Extrato de ${name || 'cliente'}`, size: 'max-w-lg',
      body: `<div class="mb-3"><label class="label">Nível de detalhe</label><select class="input" data-stmt="level">${opts(this.LEVELS, this.opts.level)}</select></div>
        <label class="label">Mensagem do WhatsApp (pode editar)</label><textarea class="input text-sm" rows="14" id="share-text">${U.esc(this.text(docs, name, this.opts.level))}</textarea>
        <p class="text-xs text-zinc-500 mt-2" id="stmt-note">${ph ? `Vai para o WhatsApp de ${U.esc(c.name)} (${U.esc(c.phone)}).` : 'Sem telefone cadastrado: o WhatsApp vai pedir o contato.'} Trocar o nível de detalhe refaz o texto. Para mandar o PDF, use “Gerar PDF” e depois “Compartilhar”.</p>
        <p class="text-xs text-amber-700 mt-1 hidden" id="stmt-long">Mensagem longa: se o WhatsApp cortar o texto, envie o PDF.</p>`,

const Catalog = {
  st: null,
  vals: p => ({ unit: p.unit || 'un', cost: p.cost ?? '', margin: p.margin ?? '', price: p.price ?? '', stock: p.stock ?? '', minStock: p.minStock ?? '' }),
  children: id => Store.data.products.filter(p => p.groupId === id),

  fillCats(r, selected) {
    const seg = Store.seg(formData(r).segmentId);
    let list = seg.categories.length ? seg.categories.slice() : ['Geral'];
    if (selected && !list.includes(selected)) list = [selected, ...list];
    $('[name="category"]', r).innerHTML = opts(list.map(c => [c, c]), selected || list[0]);
  },

  /* mode: edit | dupe | addvar */
  openForm(id, mode = 'edit') {
    const cur = id ? Store.product(id) : null;
    const defSeg = cur ? cur.segmentId : (sid() === 'all' ? Store.data.segments[0].id : sid());
    const st = this.st = { id: null, kind: 'new', hasVariants: false, single: { unit: 'un', cost: '', margin: '', price: '', stock: '', minStock: '' }, variants: [], removed: [] };
    const p = cur ? U.clone(cur) : { segmentId: defSeg, name: '', type: 'material', category: '' };
    const dupe = mode === 'dupe';
    if (cur && cur.hasVariants) {
      st.hasVariants = true;
      st.variants = this.children(cur.id).sort((a, b) => (a.variant || '').localeCompare(b.variant || '', 'pt'))
        .map(c => ({ rid: dupe ? null : c.id, name: c.variant || '', ...this.vals(c), stock: dupe ? '' : this.vals(c).stock }));
      st.kind = dupe ? 'new' : 'master'; st.id = dupe ? null : cur.id;
    } else if (cur) {
      st.single = this.vals(cur); if (dupe) st.single.stock = '';
      st.kind = dupe ? 'new' : 'single'; st.id = dupe ? null : cur.id;
    }
    if (dupe) p.name += ' (cópia)';
    if (mode === 'addvar' && cur) {
      if (!st.hasVariants) { st.hasVariants = true; st.variants = [{ rid: cur.id, name: '', ...st.single }]; }
      const last = st.variants[st.variants.length - 1];
      st.variants.push({ ...last, rid: null, name: '', stock: '' });
    }
    const names = [...new Set(Store.data.products.filter(x => !x.groupId).map(x => x.name))];
    const root = Modal.open({ title: dupe ? 'Duplicar item' : cur ? 'Editar item' : 'Novo item', size: 'max-w-2xl',
      body: `<div class="grid grid-cols-2 gap-4">
        <div class="col-span-2 sm:col-span-1"><label class="label">Segmento</label><select class="input" name="segmentId">${opts(Store.data.segments.map(s => [s.id, s.name]), p.segmentId)}</select></div>
        <div class="col-span-2 sm:col-span-1"><label class="label">Tipo</label>
          <div class="flex gap-2"><select class="input" name="type">${opts(Store.data.itemTypes.map(t => [t.id, t.name]), p.type)}</select><button class="btn btn-secondary" data-action="type-add" aria-label="Novo tipo" title="Novo tipo">${icon('plus')}</button></div></div>
        <div class="col-span-2"><label class="label">Nome do item</label><input class="input" name="name" list="name-list" value="${U.esc(p.name)}" placeholder="Ex.: Tomada, Bolo"><datalist id="name-list">${names.map(n => `<option value="${U.esc(n)}">`).join('')}</datalist></div>
        <div class="col-span-2"><label class="label">Categoria</label>
          <div class="flex gap-2"><select class="input" name="category"></select><button class="btn btn-secondary" data-action="cat-add-category" aria-label="Nova categoria" title="Nova categoria">${icon('plus')}</button></div></div>
        <div class="col-span-2"><label class="label">Este item tem variações?</label>
          <div id="cat-mode" class="grid grid-cols-2 gap-1 rounded-xl bg-zinc-100 p-1"></div>
          <p class="text-xs text-zinc-500 mt-1" id="cat-mode-hint"></p></div>
        <div class="col-span-2" id="cat-dyn"></div>
        <p class="col-span-2 text-xs text-zinc-500">Para renomear ou excluir tipos e categorias, vá em <a href="#/config" data-nav data-action="modal-close" class="text-indigo-600 hover:underline">Configurações</a>.</p>
      </div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="cat-save">Salvar item</button>`,
      onMount: r => {
        this.fillCats(r, p.category);
        this.renderDyn(r);
        r.addEventListener('input', e => {
          const t = e.target;
          if (t.name === 'segmentId') this.fillCats(r, '');
          if (t.dataset.cf) { const tgt = t.dataset.vi !== undefined ? this.st.variants[+t.dataset.vi] : this.st.single; tgt[t.dataset.cf] = t.value; }
          if (t.name === 'type' && this.st.kind === 'new') {
            [this.st.single, ...this.st.variants].forEach(v => { if (['un', 'h'].includes(v.unit)) v.unit = typeKind(t.value) === 'servico' ? 'h' : 'un'; });
            this.renderDyn(r); return;
          }
          this.updateAllPreviews(r);
        });
      } });
    root._ctx = st;
  },

  fieldsHtml(v, key) {
    const attr = key === 'single' ? '' : `data-vi="${key}" `;
    const f = (label, field, ph = '', mode = 'dec', neg = false) => `<div><label class="label">${label}</label>${numInput(`${attr}data-cf="${field}" ${ph ? `placeholder="${ph}"` : ''}`, v[field], mode, neg)}</div>`;
    return `<div class="grid grid-cols-2 gap-3">
      <div><label class="label">Unidade</label><select class="input" ${attr}data-cf="unit">${unitOpts(v.unit)}</select></div>
      ${f('Custo unitário (R$)', 'cost')}
      ${f('Margem própria (%)', 'margin', 'Padrão do segmento')}
      ${f('Preço fixo (R$) — opcional', 'price', 'Usar margem')}
      ${f('Estoque — opcional', 'stock', 'Não controlar', 'q', true)}
      ${f('Estoque mínimo — opcional', 'minStock', 'Sem alerta', 'q')}
      <div class="col-span-2 rounded-xl bg-zinc-50 px-3 py-2 text-sm" data-prev="${key}"></div></div>`;
  },
  variantsHtml() {
    return this.st.variants.map((v, i) => `<div class="rounded-xl border border-zinc-200 p-3 mb-3">
      <div class="flex items-end gap-2 mb-3"><div class="flex-1"><label class="label">Nome da variação ${i + 1}</label>
        <input class="input" data-vi="${i}" data-cf="name" value="${U.esc(v.name)}" placeholder="Ex.: Simples, Dupla, Cenoura"></div>
        <button class="btn btn-ghost btn-sm text-red-600" data-action="cat-var-del" data-i="${i}" aria-label="Remover variação">${icon('trash')}</button></div>
      ${this.fieldsHtml(v, i)}</div>`).join('') + `<button class="btn btn-secondary btn-sm" data-action="cat-var-add">${icon('plus')} Adicionar variação</button>`;
  },
  renderDyn(r) {
    const st = this.st, locked = st.kind === 'master';
    const mb = (m, label) => `<button class="btn btn-sm ${(m === 'multi') === st.hasVariants ? 'bg-white shadow-sm text-zinc-900' : 'text-zinc-600'}" data-action="cat-mode" data-m="${m}" ${locked ? 'disabled' : ''}>${label}</button>`;
    $('#cat-mode', r).innerHTML = mb('single', 'Item único') + mb('multi', 'Com variações');
    $('#cat-mode-hint', r).textContent = locked ? 'Este item já tem variações. Para voltar a item único, exclua e cadastre de novo.'
      : st.hasVariants ? 'Cada variação tem nome, unidade, custo, margem, preço e estoque próprios. Segmento, tipo e categoria valem para todas.'
      : 'Um item só: preencha os valores abaixo.';
    $('#cat-dyn', r).innerHTML = st.hasVariants ? this.variantsHtml() : this.fieldsHtml(st.single, 'single');
    this.updateAllPreviews(r);
  },
  previewHtml(r, v) {
    const f = formData(r), seg = Store.seg(f.segmentId), cost = U.num(v.cost) || 0;
    const m = v.margin !== '' ? U.num(v.margin) || 0 : Pricing.segMargin(seg, f.type);
    const price = v.price !== '' ? U.num(v.price) || 0 : Pricing.suggest(cost, m);
    return v.price !== ''
      ? `Preço fixo de <strong>${U.money(price)}</strong> — margem resultante de <strong>${U.pct(Pricing.marginOf(cost, price))}</strong>.`
      : `Preço sugerido: <strong>${U.money(price)}</strong> (margem ${U.pct(m)} ${v.margin !== '' ? 'própria' : 'padrão do segmento'}).`;
  },
  updateAllPreviews(r) {
    $$('[data-prev]', r).forEach(el => { el.innerHTML = this.previewHtml(r, el.dataset.prev === 'single' ? this.st.single : this.st.variants[+el.dataset.prev]); });
  },

  save(el) {
    const root = el.closest('[data-modal]'), st = this.st, f = formData(root);
    if (!Validate.form(root)) return;
    const num = v => (v === '' || v == null ? null : Math.max(0, U.num(v) || 0));
    const signed = v => (v === '' || v == null || isNaN(U.num(v)) ? null : Math.round(U.num(v) * 1000) / 1000);
    const toRec = v => ({ unit: v.unit || 'un', cost: num(v.cost) || 0, margin: v.margin === '' ? null : U.num(v.margin) || 0, price: num(v.price), stock: signed(v.stock), minStock: num(v.minStock) });
    /* mudar o estoque à mão vira um "ajuste" no histórico do item */
    const logAdjust = (rec, before) => { if (before != null && rec.stock != null && Math.abs(rec.stock - before) > 0.0005) Stock.log(Store.data, { productId: rec.id, qty: Math.round((rec.stock - before) * 1000) / 1000, type: 'ajuste', note: 'Alterado no cadastro do item' }); };
    const base = { segmentId: f.segmentId, name: f.name.trim(), type: f.type, category: f.category || 'Geral' };
    const find = id => Store.data.products.find(x => x.id === id);
    if (!st.hasVariants) {
      let rec = st.id ? find(st.id) : null;
      const isNew = !rec, before = rec ? rec.stock : null;
      rec = Object.assign(rec || { id: U.uid('prod') }, base, toRec(st.single), { variant: '' });
      logAdjust(rec, before);
      delete rec.groupId; delete rec.hasVariants;
      if (isNew) Store.data.products.push(rec);
    } else {
      if (!st.variants.length) return Toast.show('Adicione pelo menos uma variação.', 'error');
      const seen = new Set();
      for (const v of st.variants) {
        const n = v.name.trim().toLowerCase();
        if (!n) return Toast.show('Dê um nome a cada variação.', 'error');
        if (seen.has(n)) return Toast.show('Há duas variações com o mesmo nome.', 'error');
        seen.add(n);
      }
      let master = st.kind === 'master' ? find(st.id) : null;
      if (!master) { master = { id: U.uid('grp') }; Store.data.products.push(master); }
      Object.assign(master, base, { hasVariants: true }); delete master.variant;
      st.variants.forEach(v => {
        let rec = v.rid ? find(v.rid) : null;
        const isNew = !rec, before = rec ? rec.stock : null;
        rec = Object.assign(rec || { id: U.uid('prod') }, base, toRec(v), { variant: v.name.trim(), groupId: master.id });
        logAdjust(rec, before);
        delete rec.hasVariants;
        if (isNew) Store.data.products.push(rec);
      });
      if (st.removed.length) Store.data.products = Store.data.products.filter(x => !st.removed.includes(x.id));
    }
    const seg = Store.seg(base.segmentId); if (!seg.categories.includes(base.category)) seg.categories.push(base.category);
    Store.save(); Modal.closeFrom(el); Toast.show('Item salvo.', 'success'); Router.render();
  }
};

LIST.catalog = () => {
  const box = $('#list-catalog'); if (!box) return;

  const kids = id => all.filter(p => p.groupId === id);
  const isLow = p => p.stock != null && (p.stock <= 0 || (p.minStock != null && p.stock <= p.minStock));
  const top = all.filter(p => !p.groupId && (sid() === 'all' || p.segmentId === sid()) && (f.cat === 'all' || p.category === f.cat))
    .filter(p => !f.low || (p.hasVariants ? kids(p.id).some(isLow) : isLow(p)))

    .sort((a, b) => a.segmentId.localeCompare(b.segmentId) || a.name.localeCompare(b.name, 'pt'));
  const plural = n => `${n} ${n === 1 ? 'variação' : 'variações'}`;
  const stockCls = (n, min) => (n != null && n <= 0 ? 'text-red-600' : n != null && min != null && n <= min ? 'text-amber-600' : '');
  const kv = (k, v, cls = '') => `<div class="rounded-lg bg-white border border-indigo-100 px-2.5 py-1.5"><div class="text-[11px] text-zinc-500">${k}</div><div class="text-sm font-semibold tabular-nums ${cls}">${v}</div></div>`;
  const actions = id => `<div class="flex flex-wrap gap-2 mt-3">

      <button class="btn btn-secondary btn-sm" data-action="cat-edit" data-id="${id}">${icon('edit')} Editar</button>
      <button class="btn btn-danger btn-sm" data-action="cat-del" data-id="${id}">${icon('trash')} Excluir</button></div>`;
  const shell = (p, sub, body) => {
    const open = !!UI.openGroups[p.id], seg = Store.seg(p.segmentId);
    return `<div class="rounded-xl border border-indigo-200 bg-white shadow-sm overflow-hidden" style="border-left:4px solid ${U.esc(seg.color)}">
      <button class="w-full flex items-center justify-between gap-3 px-3.5 py-2.5 text-left hover:bg-indigo-50/60" data-action="cat-toggle" data-id="${p.id}" aria-expanded="${open}">
        <span class="min-w-0"><span class="block font-medium text-zinc-900 truncate">${U.esc(p.name)}</span><span class="block text-xs text-zinc-500 truncate">${sub}</span></span>
        ${icon('chevron', 'w-4 h-4 text-zinc-400 transition-transform ' + (open ? 'rotate-180' : ''))}</button>
      ${open ? `<div class="border-t border-indigo-100 bg-indigo-50/40 px-3.5 py-3">${body}</div>` : ''}</div>`;
  };
  const single = p => {
    const seg = Store.seg(p.segmentId), price = Pricing.productPrice(p, seg);
    return shell(p, `${U.esc(p.category)} · ${U.esc(typeLabel(p.type))} · ${U.esc(p.unit)}`,
      `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${kv('Custo', U.money(p.cost))}${kv('Margem', U.pct(Pricing.marginOf(p.cost, price)))}
        ${kv('Preço', U.money(price) + (p.price != null ? ' <span class="text-[11px] font-normal text-zinc-400">fixo</span>' : ''))}${kv('Estoque', p.stock == null ? '—' : U.n2(p.stock) + (p.minStock != null ? ` <span class="text-[11px] font-normal text-zinc-400">mín. ${U.n2(p.minStock)}</span>` : ''), stockCls(p.stock, p.minStock))}</div>${actions(p.id)}`);
  };
  const master = m => {
    const seg = Store.seg(m.segmentId), cs = kids(m.id).sort((a, b) => (a.variant || '').localeCompare(b.variant || '', 'pt'));
    const rows = cs.map(c => {
      const price = Pricing.productPrice(c, seg);
      return `<div class="rounded-lg bg-white border border-indigo-100 px-3 py-2">
        <div class="flex items-center justify-between gap-2"><span class="text-sm font-medium text-zinc-900">${U.esc(c.variant || 'Padrão')} <span class="text-xs font-normal text-zinc-400">${U.esc(c.unit)}</span></span>
          <span class="font-semibold tabular-nums">${U.money(price)}${c.price != null ? ' <span class="text-[11px] font-normal text-zinc-400">fixo</span>' : ''}</span></div>
        <div class="text-xs text-zinc-500 mt-0.5 tabular-nums">Custo ${U.money(c.cost)} · Margem ${U.pct(Pricing.marginOf(c.cost, price))} · Estoque <span class="${stockCls(c.stock, c.minStock)}">${c.stock == null ? '—' : U.n2(c.stock)}</span></div></div>`;
    }).join('');
    return shell(m, `${U.esc(m.category)} · ${U.esc(typeLabel(m.type))} · <span class="font-medium text-indigo-600">${plural(cs.length)}</span>`,
      `<div class="space-y-2">${rows}</div>
       <div class="flex flex-wrap gap-2 mt-3"><button class="btn btn-secondary btn-sm" data-action="cat-addvar" data-id="${m.id}">${icon('plus')} Variação</button></div>${actions(m.id)}`);
  };
  box.innerHTML = top.length ? top.map(p => (p.hasVariants ? master(p) : single(p))).join('')
    : `<div class="card">${emptyState('Nenhum item cadastrado', 'Cadastre materiais, serviços e produtos para montar orçamentos mais rápido.', `<button class="btn btn-primary" data-action="cat-new">${icon('plus')} Novo item</button>`)}</div>`;
};

const ClientStats = {
  docs: cid => Store.data.documents.filter(d => d.clientId === cid),
  of(cid) {
    const docs = this.docs(cid), sales = docs.filter(d => Finance.isBillable(d)).sort((a, b) => a.date.localeCompare(b.date));
    const spent = Pricing.r2(U.sum(sales, d => Finance.netTotal(d)));
    const gaps = sales.slice(1).map((d, i) => U.daysBetween(sales[i].date, d.date)).filter(n => n >= 0);
    return {
      docs, sales, spent, count: sales.length, ticket: sales.length ? Pricing.r2(spent / sales.length) : 0,
      freq: gaps.length ? Math.round(U.sum(gaps, x => x) / gaps.length) : null,
      last: sales.length ? sales[sales.length - 1].date : '', first: sales.length ? sales[0].date : '',
      owes: Finance.clientBalance(cid), late: Pricing.r2(U.sum(docs, d => Finance.overdueAmount(d))), credit: Finance.creditBalance(cid),
      quotes: docs.filter(d => d.kind === 'orcamento').length
    };
  }
};

    if (v < 0 && Finance.creditBalance(root._cid) + v < -0.004) return Toast.show('O cliente não tem esse crédito para tirar.', 'error');
    Finance.addCredit(root._cid, v, f.creditNote.trim() || (v > 0 ? 'Crédito lançado à mão' : 'Crédito retirado à mão'));

  statement(cid) {
    const c = Store.client(cid), st = ClientStats.of(cid), co = Store.data.company;
    const lines = [];
    st.sales.forEach(d => {
      lines.push({ date: d.date, at: d.createdAt, desc: `${KINDS[d.kind].label} ${d.number}`, debit: Finance.netTotal(d), credit: 0 });
      d.payments.forEach(p => lines.push({ date: p.date, at: p.at || p.date, desc: `Pagamento ${p.method}${p.note ? ' — ' + p.note : ''} (${d.number})`, debit: 0, credit: p.amount }));
      d.refunds.forEach(r => { const back = (r.cashBack || 0) + (r.toCredit || 0); if (back) lines.push({ date: r.date, at: r.at || r.date, desc: `Devolução de valor (${d.number})`, debit: back, credit: 0 }); });

    lines.sort((a, b) => (a.date + a.at).localeCompare(b.date + b.at));

        <div class="ps-box"><div class="ps-kv"><span class="ps-muted">Total comprado</span><span>${U.money(st.spent)}</span></div><div class="ps-kv"><span class="ps-muted">Saldo devedor</span><span><strong>${U.money(st.owes)}</strong></span></div>${st.late ? `<div class="ps-kv"><span class="ps-muted">Em atraso</span><span>${U.money(st.late)}</span></div>` : ''}${st.credit ? `<div class="ps-kv"><span class="ps-muted">Crédito a favor</span><span>${U.money(st.credit)}</span></div>` : ''}</div></div>
      <div class="ps-sec"><div class="ps-sec-title">Movimentação</div><table class="ps-t"><thead><tr><th>Data</th><th>Descrição</th><th class="ps-r">Débito</th><th class="ps-r">Pago</th><th class="ps-r">Saldo</th></tr></thead><tbody>${rows || '<tr><td colspan="5">Sem movimentação.</td></tr>'}</tbody></table></div>
      ${credits.length ? `<div class="ps-sec"><div class="ps-sec-title">Crédito do cliente</div><table class="ps-t"><thead><tr><th>Data</th><th>Motivo</th><th class="ps-r">Valor</th></tr></thead><tbody>${credits.map(x => `<tr><td>${U.fmtDate(x.date)}</td><td>${U.esc(x.note)}</td><td class="ps-r">${x.amount > 0 ? '+' : '−'}${U.money(Math.abs(x.amount))}</td></tr>`).join('')}</tbody></table></div>` : ''}

  }
};

/* ============================================================
   15b. FORNECEDORES E ESTOQUE
   - Entrada de compra: soma ao estoque e recalcula o CUSTO MÉDIO:
       custo novo = (estoque atual × custo atual + qtd comprada × custo da compra) ÷ (estoque atual + qtd comprada)
     Se o estoque estava zerado ou negativo, o custo novo é o da compra.
     O preço sugerido acompanha (custo × margem), exceto itens com preço fixo.
   - Ajuste (contagem) e perda ficam no histórico com o motivo.
   ============================================================ */

const StockOps = {
  /* itens que controlam estoque (vendáveis, sem os "mestres" de variações) */
  items: () => Store.data.products.filter(p => !p.hasVariants && p.stock != null && (sid() === 'all' || p.segmentId === sid())),
  isLow: p => p.stock != null && (p.stock <= 0 || (p.minStock != null && p.stock <= p.minStock)),
  lowList() { return this.items().filter(p => this.isLow(p)); },
  value: p => Pricing.r2(Math.max(0, p.stock) * (Number(p.cost) || 0)),

  openMove(pid, type) {
    const p = Store.product(pid); if (!p) return;
    const title = { compra: 'Entrada de compra', ajuste: 'Ajustar contagem', perda: 'Registrar perda' }[type];
    const body = type === 'compra' ? `<div class="grid grid-cols-2 gap-3">
        <div><label class="label">Quantidade comprada</label>${numInput('name="qtyMove"', '', 'q')}</div>
        <div><label class="label">Custo unitário da compra</label>${numInput('name="unitCost"', p.cost)}</div>
        <div class="col-span-2"><label class="label">Fornecedor</label><select class="input" name="supplierId">${opts([['', 'Nenhum'], ...Store.data.suppliers.map(s => [s.id, s.name])], '')}</select></div>
        <label class="col-span-2 flex items-center gap-2 text-sm"><input type="checkbox" name="toPay" class="w-4 h-4 rounded" checked> Lançar em Contas a pagar</label>
        <div class="col-span-2" id="mv-pay"><label class="label">Vencimento</label><input type="date" class="input" name="payDue" value="${U.today()}">
          <label class="flex items-center gap-2 text-sm mt-2"><input type="checkbox" name="payNow" class="w-4 h-4 rounded"> Já foi paga</label></div>
        <p class="col-span-2 text-sm text-zinc-500" id="mv-prev"></p></div>`
      : type === 'ajuste' ? `<div class="space-y-3"><p class="text-sm text-zinc-500">Estoque no sistema: <strong>${U.n2(p.stock)} ${U.esc(p.unit)}</strong>. Conte o que tem de verdade e digite abaixo.</p>
        <div><label class="label">Quantidade contada</label>${numInput('name="newStock"', p.stock, 'q', true)}</div>
        <div><label class="label">Motivo</label><input class="input" name="moveNote" placeholder="Ex.: contagem do fim do mês"></div><p class="text-sm" id="mv-prev"></p></div>`
      : `<div class="space-y-3"><p class="text-sm text-zinc-500">Estoque atual: <strong>${U.n2(p.stock)} ${U.esc(p.unit)}</strong>.</p>
        <div><label class="label">Quantidade perdida</label>${numInput('name="qtyMove"', '', 'q')}</div>
        <div><label class="label">Motivo</label><input class="input" name="moveNote" placeholder="Ex.: venceu, quebrou, consumo próprio"></div><p class="text-sm text-zinc-500" id="mv-prev"></p></div>`;
    const root = Modal.open({ title: `${title} — ${prodName(p)}`, size: 'max-w-md', body,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="stock-move-save">Confirmar</button>`,
      onMount: r => { const upd = () => this.preview(r, p, type); r.addEventListener('input', upd); upd(); } });
    root._ctx = { pid, type };
  },
  avgCost(p, qty, unitCost) {
    const cur = Math.max(0, Number(p.stock) || 0);
    return cur + qty > 0 ? Pricing.r2((cur * (Number(p.cost) || 0) + qty * unitCost) / (cur + qty)) : unitCost;
  },
  preview(r, p, type) {
    const f = formData(r), el = $('#mv-prev', r); if (!el) return;
    if (type === 'compra') {
      $('#mv-pay', r).classList.toggle('hidden', !f.toPay);
      const q = U.num(f.qtyMove), c = U.num(f.unitCost);
      el.innerHTML = q > 0 && c >= 0 ? `Estoque passa de ${U.n2(p.stock)} para <strong>${U.n2(p.stock + q)}</strong>. Custo médio: ${U.money(p.cost)} → <strong>${U.money(this.avgCost(p, q, c))}</strong>${p.price == null ? '; o preço sugerido acompanha.' : ' (preço fixo continua igual).'} Total da compra: <strong>${U.money(q * c)}</strong>.` : '';
    } else if (type === 'ajuste') {
      const n = U.num(f.newStock), d = Math.round((n - p.stock) * 1000) / 1000;
      el.innerHTML = isNaN(n) ? '' : d === 0 ? '<span class="text-emerald-700">Bate com o sistema.</span>' : `<span class="${d > 0 ? 'text-emerald-700' : 'text-red-600'}">Diferença: ${d > 0 ? '+' : ''}${U.n2(d)} ${U.esc(p.unit)}</span>`;
    } else {
      const q = U.num(f.qtyMove);
      el.textContent = q > 0 ? `Estoque fica em ${U.n2(p.stock - q)} ${p.unit}. Prejuízo estimado: ${U.money(q * p.cost)}.` : '';
    }
  },
  saveMove(el) {
    const root = el.closest('[data-modal]'); if (!Validate.form(root)) return;
    const { pid, type } = root._ctx, p = Store.product(pid), f = formData(root), data = Store.data;
    if (type === 'compra') {
      const q = U.num(f.qtyMove), c = Math.max(0, U.num(f.unitCost) || 0);
      const before = p.cost;
      p.cost = this.avgCost(p, q, c);
      Stock.adjust(data, pid, q);
      Stock.log(data, { productId: pid, qty: q, type: 'compra', unitCost: c, supplierId: f.supplierId, note: `Custo médio ${U.money(before)} → ${U.money(p.cost)}` });
      if (f.toPay && q * c > 0) {
        Expenses.save({ id: U.uid('exp'), createdAt: U.now(), description: `Compra: ${U.n2(q)} ${p.unit} ${prodName(p)}`, category: 'Compra de mercadoria', supplierId: f.supplierId,
          segmentId: p.segmentId, amount: Pricing.r2(q * c), due: f.payDue || U.today(), paidAt: f.payNow ? U.today() : '', method: f.payNow ? 'Pix' : '', repeat: 'none', notes: '', purchase: { productId: pid, qty: q } });
      }
      Store.save(); Modal.closeFrom(el); Toast.show(`Entrada registrada. Estoque: ${U.n2(p.stock)} ${p.unit}.`, 'success');
    } else if (type === 'ajuste') {
      const n = Math.round(U.num(f.newStock) * 1000) / 1000, d = Math.round((n - p.stock) * 1000) / 1000;
      if (d) { p.stock = n; Stock.log(data, { productId: pid, qty: d, type: 'ajuste', note: f.moveNote.trim() || 'Contagem' }); }
      Store.save(); Modal.closeFrom(el); Toast.show(d ? 'Estoque ajustado.' : 'Contagem confere. Nada mudou.', 'success');
    } else {
      const q = U.num(f.qtyMove);
      Stock.adjust(data, pid, -q);
      Stock.log(data, { productId: pid, qty: -q, type: 'perda', unitCost: p.cost, note: f.moveNote.trim() || 'Perda' });
      Store.save(); Modal.closeFrom(el); Toast.show('Perda registrada.', 'success');
    }
    Router.render();
  },
  history(pid) {
    const p = Store.product(pid); if (!p) return;
    const mv = Store.data.stockMoves.filter(m => m.productId === pid).slice().sort((a, b) => (b.at || b.date).localeCompare(a.at || a.date)).slice(0, 100);
    Modal.open({ title: `Histórico — ${prodName(p)}`, size: 'max-w-lg',
      body: `<p class="text-sm text-zinc-500 mb-3">Estoque atual: <strong>${U.n2(p.stock)} ${U.esc(p.unit)}</strong> · custo médio ${U.money(p.cost)}</p>
        ${mv.length ? mv.map(m => { const doc = m.docId && Docs.get(m.docId), sup = m.supplierId && Store.supplier(m.supplierId); return `<div class="flex items-center justify-between gap-2 py-2 border-t border-zinc-100 text-sm">
          <div class="min-w-0"><div class="font-medium">${MOVE_LABEL[m.type] || m.type}${doc ? ` · <a href="#/doc/${doc.id}" data-nav data-action="modal-close" class="text-indigo-600 hover:underline">${U.esc(doc.number)}</a>` : ''}</div>
            <div class="text-xs text-zinc-500 truncate">${U.fmtDateTime(m.at || m.date)}${sup ? ' · ' + U.esc(sup.name) : ''}${m.unitCost != null && m.type === 'compra' ? ' · ' + U.money(m.unitCost) + '/un' : ''}${m.note ? ' · ' + U.esc(m.note) : ''}</div></div>
          <span class="tabular-nums font-semibold ${m.qty > 0 ? 'text-emerald-700' : 'text-red-600'}">${m.qty > 0 ? '+' : ''}${U.n2(m.qty)}</span></div>`; }).join('') : '<p class="text-sm text-zinc-500">Nenhuma movimentação registrada ainda.</p>'}`,
      footer: `<button class="btn btn-primary" data-action="modal-close">Fechar</button>` });
  }
};

/* ---- 13c-reports.js ---- */
/* ============================================================
   15c. RELATÓRIOS
   Duas visões de dinheiro, sempre identificadas:
   - Competência (vendas): o que foi VENDIDO no período, pela data do documento.
   - Caixa: o que ENTROU e SAIU de dinheiro no período, pela data do pagamento.
   ============================================================ */
const REP_TABS = [['resumo', 'Resumo'], ['produtos', 'Por produto'], ['clientes', 'Por cliente'], ['segmentos', 'Por segmento'], ['orcamentos', 'Orçamentos'], ['inadimplencia', 'Inadimplência'], ['resultado', 'Resultado do mês']];

const Reports = {
  sales(f) { return Finance.scoped(sid()).filter(d => Finance.isBillable(d) && Finance.inRange(d.date, f.from, f.to)); },
  /* fator de desconto do documento: valor de cada linha já com o desconto rateado */
  ratio(d) { const t = Pricing.totals(d); return t.subtotal > 0 ? Finance.netTotal(d) / t.subtotal : 0; },
  resumo(f) {
    const sales = this.sales(f), billed = U.sum(sales, d => Finance.netTotal(d)), cost = U.sum(sales, d => Pricing.totals(d).cost);
    const cash = Finance.summary(sid(), f.from, f.to);
    const quotes = Finance.scoped(sid()).filter(d => d.kind === 'orcamento' && Finance.inRange(d.date, f.from, f.to));
    const decided = quotes.filter(q => ['Convertido', 'Aprovado', 'Recusado', 'Expirado'].includes(q.status));
    const won = quotes.filter(q => ['Convertido', 'Aprovado'].includes(q.status));
    const recv = Finance.openReceivable(sid()), late = Finance.overdueTotal(sid());
    return { count: sales.length, billed: Pricing.r2(billed), cost: Pricing.r2(cost), profit: Pricing.r2(billed - cost), margin: billed > 0 ? Pricing.r2((billed - cost) / billed * 100) : 0,
      ticket: sales.length ? Pricing.r2(billed / sales.length) : 0, conv: decided.length ? Pricing.r2(won.length / decided.length * 100) : null, quotes: quotes.length, won: won.length,
      recv, late, delinquency: recv > 0 ? Pricing.r2(late / recv * 100) : 0, cash };
  },
  produtos(f) {
    const g = {};
    this.sales(f).forEach(d => {
      const k = this.ratio(d);
      d.items.forEach(i => {
        const p = i.productId && Store.product(i.productId), key = i.productId || 'n:' + i.name.toLowerCase();
        const r = g[key] || (g[key] = { name: p ? prodName(p) : i.name, unit: i.unit, qty: 0, revenue: 0, cost: 0, docs: 0 });
        r.qty += Number(i.qty) || 0; r.revenue += Pricing.lineTotal(i) * k; r.cost += i.qty * i.cost; r.docs++;
      });
    });
    return Object.values(g).map(r => ({ ...r, revenue: Pricing.r2(r.revenue), cost: Pricing.r2(r.cost), profit: Pricing.r2(r.revenue - r.cost) })).sort((a, b) => b.revenue - a.revenue);
  },
  clientes(f) {
    const g = {};
    this.sales(f).forEach(d => {
      const key = d.clientId || 'n:' + (d.customerName || 'Consumidor').toLowerCase();
      const r = g[key] || (g[key] = { name: docWho(d) || 'Consumidor', clientId: d.clientId, count: 0, revenue: 0, paid: 0, owes: 0 });
      r.count++; r.revenue += Finance.netTotal(d); r.paid += Finance.keptPaid(d); r.owes += Finance.balance(d);
    });
    return Object.values(g).map(r => ({ ...r, revenue: Pricing.r2(r.revenue), paid: Pricing.r2(r.paid), owes: Pricing.r2(r.owes), ticket: Pricing.r2(r.revenue / r.count) })).sort((a, b) => b.revenue - a.revenue);
  },
  segmentos(f) {
    return Store.data.segments.filter(s => sid() === 'all' || s.id === sid()).map(s => {
      const x = Finance.summary(s.id, f.from, f.to), sales = Store.data.documents.filter(d => d.segmentId === s.id && Finance.isBillable(d) && Finance.inRange(d.date, f.from, f.to));
      return { seg: s, count: sales.length, billed: x.billed, cost: x.cost, profit: x.profit, received: x.grossIn, spent: x.spent, refunded: x.refunded };
    });
  },
  orcamentos(f) {
    const q = Finance.scoped(sid()).filter(d => d.kind === 'orcamento' && Finance.inRange(d.date, f.from, f.to));
    const by = {}; STATUS_BY_KIND.orcamento.forEach(s => { by[s] = { n: 0, v: 0 }; });
    q.forEach(d => { by[d.status].n++; by[d.status].v += Finance.total(d); });
    return { list: q, by, reasons: q.filter(d => d.status === 'Recusado').map(d => ({ d, reason: d.rejectReason || 'Sem motivo informado' })) };
  },
  inadimplencia() {
    return Finance.scoped(sid()).filter(d => Finance.isOverdue(d)).map(d => ({ d, who: docWho(d) || 'Sem cliente', late: Finance.overdueAmount(d), days: Finance.daysLate(d), fee: Finance.lateFee(d) }))
      .sort((a, b) => b.days - a.days);
  },
  resultado(f) {
    const cash = Finance.summary(sid(), f.from, f.to), cats = {};
    Store.data.expenses.filter(e => e.paidAt && Finance.inRange(e.paidAt, f.from, f.to) && (sid() === 'all' || !e.segmentId || e.segmentId === sid())).forEach(e => { cats[e.category] = (cats[e.category] || 0) + e.amount; });
    const comp = {}; Store.data.expenses.filter(e => Finance.inRange(e.due, f.from, f.to) && (sid() === 'all' || !e.segmentId || e.segmentId === sid())).forEach(e => { comp[e.category] = (comp[e.category] || 0) + e.amount; });
    const r = this.resumo(f), compExp = U.sum(Object.values(comp), v => v);
    return { cash, cats, comp, compExp: Pricing.r2(compExp), r, compResult: Pricing.r2(r.billed - r.cost - compExp) };
  },
  /* linhas para a planilha (CSV com ; e vírgula decimal, abre direto no Excel/Planilhas) */
  rows(tab, f) {
    if (tab === 'produtos') return [['Item', 'Unidade', 'Quantidade', 'Faturado', 'Custo', 'Lucro'], ...this.produtos(f).map(r => [r.name, r.unit, r.qty, r.revenue, r.cost, r.profit])];
    if (tab === 'clientes') return [['Cliente', 'Compras', 'Faturado', 'Pago', 'Deve', 'Ticket médio'], ...this.clientes(f).map(r => [r.name, r.count, r.revenue, r.paid, r.owes, r.ticket])];
    if (tab === 'segmentos') return [['Segmento', 'Vendas', 'Faturado', 'Custo', 'Lucro bruto', 'Entrou', 'Despesas', 'Devoluções'], ...this.segmentos(f).map(r => [r.seg.name, r.count, r.billed, r.cost, r.profit, r.received, r.spent, r.refunded])];
    if (tab === 'orcamentos') return [['Número', 'Data', 'Cliente', 'Status', 'Total', 'Motivo da recusa'], ...this.orcamentos(f).list.map(d => [d.number, U.fmtDate(d.date), docWho(d), d.status, Finance.total(d), d.rejectReason || ''])];
    if (tab === 'inadimplencia') return [['Documento', 'Cliente', 'Dias de atraso', 'Atrasado', 'Multa e juros'], ...this.inadimplencia().map(x => [x.d.number, x.who, x.days, x.late, x.fee])];
    if (tab === 'resultado') { const x = this.resultado(f); return [['Linha', 'Valor'], ['Entradas (caixa)', x.cash.grossIn], ['Devoluções', -x.cash.refunded], ...Object.entries(x.cats).map(([k, v]) => ['Despesa: ' + k, -v]), ['Resultado de caixa', x.cash.net]]; }
    const r = this.resumo(f);
    return [['Indicador', 'Valor'], ['Vendas', r.count], ['Faturado', r.billed], ['Custo', r.cost], ['Lucro bruto', r.profit], ['Margem sobre a venda (%)', r.margin], ['Ticket médio', r.ticket], ['Conversão de orçamentos (%)', r.conv ?? ''], ['A receber', r.recv], ['Atrasado', r.late], ['Entradas', r.cash.grossIn], ['Saídas', r.cash.spent + r.cash.refunded], ['Saldo de caixa', r.cash.net]];
  },
  /* número em dinheiro ou em quantidade, conforme a coluna (ou a linha, nas tabelas de indicadores) */
  cell(head, label, v) {
    if (typeof v !== 'number') return U.esc(v);
    const countCol = /Quantidade|Compras|Vendas|Dias/.test(head), pctLine = /%/.test(String(label)) || /%/.test(head);
    const countLine = ['Indicador', 'Valor'].includes(head) && /^Vendas$/.test(String(label));
    if (pctLine) return U.pct(v);
    if (countCol || countLine) return U.n2(v);
    return U.money(v);
  },
  csv() {
    const f = UI.f.rel, rows = this.rows(f.tab, f);
    FileOut.share(`orcapro-${f.tab}-${f.from}-a-${f.to}.csv`, FileOut.csv(rows), 'text/csv;charset=utf-8');
  },
  print() {
    const f = UI.f.rel, rows = this.rows(f.tab, f), title = (REP_TABS.find(t => t[0] === f.tab) || [, 'Relatório'])[1];
    Print.report(`Relatório — ${title}`, `<div class="ps-head"><div><div class="ps-co">${U.esc(Store.data.company.name)}</div><div class="ps-muted">${sid() === 'all' ? 'Todos os segmentos' : U.esc(Store.seg(sid()).name)}</div></div><div class="ps-doc"><div class="ps-kind">Relatório — ${title}</div><div class="ps-num" style="font-size:15px">${U.fmtDate(f.from)} a ${U.fmtDate(f.to)}</div></div></div>
      <div class="ps-sec"><table class="ps-t"><thead><tr>${rows[0].map((h, i) => `<th class="${i ? 'ps-r' : ''}">${U.esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map((v, i) => `<td class="${i ? 'ps-r' : ''}">${this.cell(rows[0][i], r[0], v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
  }
};

      ${stat('Ticket médio', U.money(r.ticket), 'Faturado ÷ vendas')}${stat('Conversão de orçamentos', r.conv == null ? '—' : U.pct(r.conv), `${r.won} de ${r.quotes} orçamento(s) do período`)}</div>
      <p class="text-xs text-zinc-500 mb-2 mt-6">Caixa (pela data do pagamento)</p>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${stat('Entrou', U.money(r.cash.grossIn), '', 'text-emerald-700')}${stat('Saiu', U.money(r.cash.spent + r.cash.refunded), 'Despesas e devoluções', 'text-red-600')}
      ${stat('Saldo', U.money(r.cash.net), 'Entrou − saiu', r.cash.net < 0 ? 'text-red-600' : 'text-zinc-900')}${stat('Inadimplência', U.pct(r.delinquency), `${U.money(r.late)} atrasado de ${U.money(r.recv)} a receber`, r.late > 0 ? 'text-red-600' : 'text-zinc-900')}</div>`;

    const rows = Reports.produtos(f), tot = U.sum(rows, r => r.revenue);

  } else if (tab === 'clientes') {
    box.innerHTML = table(['Cliente', 'Compras', 'Faturado', 'Ticket médio', 'Deve'], Reports.clientes(f).map(r => [r.clientId ? `<a href="#/cliente/${r.clientId}" data-nav class="text-indigo-600 hover:underline">${U.esc(r.name)}</a>` : U.esc(r.name), r.count, U.money(r.revenue), U.money(r.ticket), r.owes > 0 ? `<span class="text-orange-600">${U.money(r.owes)}</span>` : U.money(0)]), [1, 2, 3, 4]);

    box.innerHTML = table(['Segmento', 'Vendas', 'Faturado', 'Lucro bruto', 'Entrou', 'Despesas'], Reports.segmentos(f).map(r => [`<span class="inline-flex items-center gap-2">${segDot(r.seg)}${U.esc(r.seg.name)}</span>`, r.count, U.money(r.billed), U.money(r.profit), U.money(r.received), U.money(r.spent)]), [1, 2, 3, 4, 5]);
  } else if (tab === 'orcamentos') {
    const o = Reports.orcamentos(f);
    box.innerHTML = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4">${Object.entries(o.by).map(([s, x]) => `<div class="card p-4"><div>${statusBadge(s)}</div><p class="mt-2 text-xl font-semibold tabular-nums">${x.n}</p><p class="text-xs text-zinc-500 tabular-nums">${U.money(x.v)}</p></div>`).join('')}</div>
      <div class="card p-5"><h2 class="font-semibold text-zinc-900">Motivos de recusa</h2>${o.reasons.length ? o.reasons.map(x => `<div class="flex justify-between gap-2 py-2 border-t border-zinc-100 text-sm mt-2"><a href="#/doc/${x.d.id}" data-nav class="text-indigo-600 hover:underline shrink-0">${U.esc(x.d.number)}</a><span class="text-zinc-600 text-right">${U.esc(x.reason)}</span></div>`).join('') : '<p class="text-sm text-zinc-500 mt-2">Nenhum orçamento recusado no período.</p>'}</div>`;
  } else if (tab === 'inadimplencia') {
    box.innerHTML = `<p class="text-sm text-zinc-500 mb-3">Situação de hoje (não depende do período).</p>` + table(['Documento', 'Cliente', 'Atraso', 'Atrasado', 'Multa e juros'], Reports.inadimplencia().map(x => [`<a href="#/doc/${x.d.id}" data-nav class="text-indigo-600 hover:underline">${U.esc(x.d.number)}</a>`, U.esc(x.who), x.days + ' dia(s)', `<span class="text-red-600">${U.money(x.late)}</span>`, U.money(x.fee)]), [2, 3, 4]);

    const x = Reports.resultado(f);

        ${Object.entries(x.comp).map(([k, v]) => line('(−) ' + U.esc(k), -v, 'text-red-600')).join('')}

  }
};

const Segments = {
  catRow: c => `<div class="flex gap-2" data-cat-row><input class="input" data-cat data-orig="${U.esc(c)}" value="${U.esc(c)}" placeholder="Nome da categoria"><button class="btn btn-secondary" data-action="seg-cat-del" aria-label="Remover categoria">${icon('trash')}</button></div>`,
  openForm(id) {
    const s = id ? Store.seg(id) : { name: '', color: SEG_COLORS[Store.data.segments.length % SEG_COLORS.length], materialMargin: 40, serviceMargin: 60, hourCost: 40, categories: [] };
    const root = Modal.open({ title: id ? 'Editar segmento' : 'Novo segmento', size: 'max-w-xl',
      body: `<div class="grid grid-cols-2 gap-4">
        <div class="col-span-2"><label class="label">Nome</label><input class="input" name="name" value="${U.esc(s.name)}" placeholder="Ex.: Elétrica e Serviços"></div>
        <div class="col-span-2"><label class="label">Cor</label><div class="flex flex-wrap gap-3">${SEG_COLORS.map(c => `
          <label class="cursor-pointer"><input type="radio" name="color" value="${c}" class="peer sr-only" ${c === s.color ? 'checked' : ''}>
          <span class="block w-8 h-8 rounded-full ring-2 ring-offset-2 ring-transparent peer-checked:ring-zinc-900" style="background:${c}"></span></label>`).join('')}</div></div>
        <div><label class="label">Margem padrão sobre materiais (%)</label>${numInput('name="materialMargin"', s.materialMargin)}</div>
        <div><label class="label">Margem padrão sobre serviços (%)</label>${numInput('name="serviceMargin"', s.serviceMargin)}</div>
        <div class="col-span-2"><label class="label">Custo da hora de trabalho (R$)</label>${numInput('name="hourCost"', s.hourCost)}</div>
        <div class="col-span-2"><label class="label">Categorias do catálogo</label>
          <div id="seg-cats" class="space-y-2">${s.categories.map(c => Segments.catRow(c)).join('')}</div>
          <button class="btn btn-secondary btn-sm mt-2" data-action="seg-cat-add">${icon('plus')} Adicionar categoria</button></div>
        <p class="col-span-2 text-xs text-zinc-500">A margem é aplicada sobre o custo: custo R$ 100 com margem de 40% sugere preço de R$ 140. Você sempre pode alterar o valor no orçamento.</p></div>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="seg-save">Salvar segmento</button>` });
    root._id = id || null;
  },
  save(el) {
    const root = el.closest('[data-modal]'), f = formData(root);
    if (!Validate.form(root)) return;
    const seen = new Set(), categories = [], renames = [];
    $$('#seg-cats [data-cat]', root).forEach(inp => {
      const v = inp.value.trim(); if (!v || seen.has(v.toLowerCase())) return;
      seen.add(v.toLowerCase()); categories.push(v);
      if (inp.dataset.orig && inp.dataset.orig !== v) renames.push([inp.dataset.orig, v]);
    });
    if (!categories.length) categories.push('Geral');
    const rec = { id: root._id || U.uid('seg'), name: f.name.trim(), color: U.color(f.color || SEG_COLORS[0]),
      materialMargin: U.num(f.materialMargin) || 0, serviceMargin: U.num(f.serviceMargin) || 0, hourCost: Math.max(0, U.num(f.hourCost) || 0), categories };
    if (root._id) renames.forEach(([a, b]) => Store.data.products.forEach(p => { if (p.segmentId === root._id && p.category === a) p.category = b; }));
    const list = Store.data.segments, i = list.findIndex(s => s.id === rec.id);
    if (i >= 0) list[i] = rec; else list.push(rec);
    Store.save(); Modal.closeFrom(el); App.renderSwitcher(); Toast.show('Segmento salvo.', 'success'); Router.render();
  }
};

const Settings = {

    const path = t.dataset.st, st = Store.data.settings;
    let v = t.type === 'checkbox' ? t.checked : t.value;
    if (['finePct', 'interestPctMonth'].includes(path)) v = Math.max(0, U.num(v) || 0);

    if (path === 'osChecklist') v = String(v).split('\n').map(x => x.trim()).filter(Boolean);
    const [a, b] = path.split('.');
    if (b) st[a][b] = v; else st[a] = v;

    if (path === 'theme') Theme.apply();
    if (a === 'pix') { const tp = $('#pix-key-type'); if (tp && path === 'pix.key') tp.textContent = v ? `Tipo: ${Pix.keyType(v)} · vai no código como ${Pix.normalizeKey(v)}` : ''; }

    if (list.some(c => c !== old && c.toLowerCase() === name.toLowerCase())) return Toast.show('Já existe essa categoria.', 'error');

    const rec = { id: id || U.uid('tp'), name, kind: f.kind };
    const i = list.findIndex(x => x.id === rec.id); if (i >= 0) list[i] = rec; else list.push(rec);
    Store.save(); Modal.closeFrom(el); Toast.show('Tipo salvo.', 'success');
    if (cb) cb(rec); else Router.render();
  },
  typeDel(id) {
    const t = Store.data.itemTypes.find(x => x.id === id), n = this.typeUsage(id);
    if (!t) return;
    if (n) return Toast.show(`“${t.name}” está em uso (${n}). Mude esses itens para outro tipo antes de excluir.`, 'error');
    if (Store.data.itemTypes.filter(x => x.kind === t.kind).length <= 1) return Toast.show('Mantenha ao menos um tipo de material e um de serviço.', 'error');

  },
  catUsage: (segId, name) => Store.data.products.filter(p => p.segmentId === segId && p.category === name && !p.groupId).length,
  catForm(segId, old) {
    const root = Modal.open({ title: old ? 'Renomear categoria' : 'Nova categoria', size: 'max-w-sm',
      body: `<label class="label">Nome da categoria</label><input class="input" name="name" value="${U.esc(old || '')}" placeholder="Ex.: Ferramentas">${old ? '<p class="text-xs text-zinc-500 mt-2">Todos os itens desta categoria passam para o novo nome.</p>' : ''}`,

    const root = el.closest('[data-modal]'); if (!Validate.form(root)) return;
    const { segId, old } = root._ctx, name = formData(root).name.trim(), seg = Store.seg(segId);

    if (old) {
      seg.categories = seg.categories.map(c => (c === old ? name : c));

/* Modelo de cadastros: leva segmentos, tipos, itens, condições (e, se quiser, clientes)
   para outra pessoa, SEM orçamentos, vendas, pagamentos, estoque, fotos ou dados da empresa. */
const Template = {
  build(root) {
    const d = Store.data, withClients = $('[data-tpl="clients"]', root).checked;
    const out = { orcapro: 'cadastros', version: 1, segments: U.clone(d.segments), itemTypes: U.clone(d.itemTypes), paymentTerms: U.clone(d.paymentTerms),
      products: d.products.map(p => ({ ...U.clone(p), stock: null })) };
    if (withClients) out.clients = U.clone(d.clients);
    return JSON.stringify(out, null, 2);
  },
  exportForm() {
    Modal.open({ title: 'Compartilhar cadastros', size: 'max-w-2xl',
      body: `<p class="text-sm text-zinc-500 mb-3">Gera um texto com seus segmentos, tipos, itens (com variações e preços), categorias e condições de pagamento. Não leva orçamentos, vendas, estoque, fotos nem os dados da sua empresa. Envie por WhatsApp para a outra pessoa.</p>
        <label class="flex items-center gap-2 text-sm mb-3"><input type="checkbox" class="w-4 h-4 rounded" data-tpl="clients"> Incluir também a lista de clientes</label>
        <textarea class="input font-mono text-xs" rows="10" readonly id="tpl-text"></textarea>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Fechar</button><button class="btn btn-primary" data-action="tpl-copy">Copiar</button>`,
      onMount: r => { const upd = () => { $('#tpl-text', r).value = this.build(r); }; r.addEventListener('input', upd); upd(); } });
  },
  copy() {
    const ta = $('#tpl-text'); ta.select();
    const ok = () => Toast.show('Texto copiado. Cole no WhatsApp.', 'success');
    const fallback = () => { try { document.execCommand('copy'); ok(); } catch (e) { Toast.show('Selecione o texto e copie manualmente.', 'error'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, fallback); else fallback();
  },
  importForm() {
    Modal.open({ title: 'Importar cadastros', size: 'max-w-2xl',
      body: `<p class="text-sm text-zinc-500 mb-3">Cole o texto recebido. Os itens são <strong>adicionados</strong> aos que você já tem; nada é apagado. Se você está começando do zero, use antes Configurações &gt; Apagar tudo.</p>
        <textarea class="input font-mono text-xs" rows="10" id="tpl-in" placeholder="Cole aqui o texto dos cadastros"></textarea>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="tpl-run">Importar</button>` });
  },
  run(el) {
    let obj;
    try { obj = JSON.parse($('#tpl-in').value.trim()); } catch (e) { return Toast.show('O texto colado não é válido.', 'error'); }
    if (!obj || obj.orcapro !== 'cadastros' || !['segments', 'products', 'itemTypes', 'paymentTerms'].every(k => Array.isArray(obj[k]))) return Toast.show('Esse texto não é um modelo de cadastros do OrçaPro.', 'error');
    const d = Store.data;
    const add = (list, items, ok) => { let n = 0; items.forEach(x => { if (x && x.id && ok(x) && !list.some(y => y.id === x.id)) { list.push(x); n++; } }); return n; };
    /* bug 9: a cor vem de fora; só aceitamos #RRGGBB */
    obj.segments.forEach(x => { if (x) x.color = U.color(x.color); });
    const nSeg = add(d.segments, obj.segments, x => typeof x.name === 'string' && Array.isArray(x.categories));
    add(d.itemTypes, obj.itemTypes, x => typeof x.name === 'string' && ['material', 'servico'].includes(x.kind));
    add(d.paymentTerms, obj.paymentTerms, x => typeof x.name === 'string' && typeof x.text === 'string');
    const nProd = add(d.products, obj.products, x => typeof x.name === 'string' && d.segments.some(sg => sg.id === x.segmentId));
    const nCli = Array.isArray(obj.clients) ? add(d.clients, obj.clients, x => typeof x.name === 'string') : 0;
    obj.products.forEach(p => { const sg = d.segments.find(x => x.id === p.segmentId); if (sg && p.category && !sg.categories.includes(p.category)) sg.categories.push(p.category); });
    if (nSeg) d.segments = d.segments.filter(sg => !(sg.name === 'Meu negócio' && sg.categories.length === 1 && sg.categories[0] === 'Geral' && !d.products.some(p => p.segmentId === sg.id) && !d.documents.some(x => x.segmentId === sg.id)));
    if (d.ui.segmentId !== 'all' && !Store.seg(d.ui.segmentId)) d.ui.segmentId = 'all';
    Store.migrate(); Store.save(); Modal.closeFrom(el); App.renderSwitcher(); Router.render();
    Toast.show(`Importado: ${nSeg} segmento(s), ${nProd} item(ns)${nCli ? ', ' + nCli + ' cliente(s)' : ''}.`, 'success');
  }
};

/* BACKUP
   - Arquivo (.json): leva os dados E as fotos/assinaturas/logo. É o backup recomendado.
   - Texto colado: formato antigo, continua aceito para restaurar backups feitos antes.
   Restaurar SUBSTITUI tudo que está no aparelho (com confirmação). */
const Backup = {
  build() { return JSON.stringify({ orcapro: 'backup', version: Store.VERSION, app: APP_VERSION, exportedAt: U.now(), data: Store.data, photos: Photos.cache }); },
  async exportFile() {
    const name = `orcapro-backup-${U.today()}.json`;
    const r = await FileOut.share(name, this.build(), 'application/json');
    if (r === 'cancelled') return;
    Store.data.ui.lastBackup = U.now(); Store.save();
    Toast.show(r === 'shared' ? 'Backup pronto. Guarde o arquivo num lugar seguro (Drive, WhatsApp).' : `Backup salvo em Downloads: ${name}`, 'success');
    if (location.hash.startsWith('#/config') || location.hash === '' || location.hash.startsWith('#/dashboard')) Router.render();
  },
  parse(text) {
    let obj; try { obj = JSON.parse(text); } catch (e) { return null; }
    const data = obj && obj.orcapro === 'backup' ? obj.data : obj;
    const ok = data && ['segments', 'products', 'clients', 'documents'].every(k => Array.isArray(data[k])) && data.company && data.counters;
    return ok ? { data, photos: obj.orcapro === 'backup' && obj.photos ? obj.photos : null, exportedAt: obj.exportedAt || '' } : null;
  },
  confirmRestore(parsed, el) {
    const n = parsed.data.documents.length, c = parsed.data.clients.length;
    Modal.confirm({ title: 'Restaurar backup', danger: true, confirmLabel: 'Substituir tudo',
      message: `O backup${parsed.exportedAt ? ' de ' + U.fmtDateTime(parsed.exportedAt) : ''} tem ${n} documento(s) e ${c} cliente(s)${parsed.photos ? ' e ' + Object.keys(parsed.photos).length + ' foto(s)' : ' (sem fotos)'}.<br><br>Os dados atuais deste aparelho serão <strong>substituídos</strong>. Continuar?`,
      onConfirm: () => {
        Store.data = parsed.data; Store.migrate();
        if (parsed.photos) { Object.keys(Photos.cache).forEach(k => Photos.del(k)); Object.entries(parsed.photos).forEach(([k, v]) => Photos.put(k, v)); }
        Store.lastSaved = {}; Store.save({ force: true });
        if (el) Modal.closeFrom(el);
        PDV.reset(); App.renderSwitcher(); Toast.show('Backup restaurado.', 'success'); Router.render();
      } });
  },
  fromFile(file) {
    const fr = new FileReader();
    fr.onload = () => { const p = this.parse(fr.result); if (!p) return Toast.show('Esse arquivo não é um backup do OrçaPro.', 'error'); this.confirmRestore(p); };
    fr.onerror = () => Toast.show('Não foi possível ler o arquivo.', 'error');
    fr.readAsText(file);
  },
  importForm() {
    Modal.open({ title: 'Restaurar de texto', size: 'max-w-2xl',
      body: `<p class="text-sm text-zinc-500 mb-3">Cole o conteúdo de um backup antigo (texto). Para backups em arquivo, use “Restaurar de arquivo”.</p><textarea class="input font-mono text-xs" rows="12" id="backup-in"></textarea>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="backup-run">Restaurar</button>` });
  },
  run(el) {
    const p = this.parse($('#backup-in').value);
    if (!p) return Toast.show('O texto colado não é um backup válido do OrçaPro.', 'error');
    this.confirmRestore(p, el);
  }
};
