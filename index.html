/* TEMA: claro, escuro ou automático (segue o celular) */
const Theme = {
  mq: window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null,
  apply() {
    const pref = (Store.data && Store.data.settings && Store.data.settings.theme) || 'auto';
    const dark = pref === 'dark' || (pref === 'auto' && this.mq && this.mq.matches);
    document.documentElement.classList.toggle('dark', dark);
    const m = $('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#18181b' : '#4f46e5');
  }
};

const Router = {
  current: '',
  guard: false,
  /* volta do celular, link ou digitação: se o documento tem alteração não salva, pergunta antes de sair */
  onHash() {
    const target = location.hash;
    if (this.guard) { this.guard = false; return; }
    if (Editor.active && Editor.dirty && this.current.startsWith('#/doc/') && target !== this.current) {
      history.replaceState(null, '', this.current);
      Modal.confirm({ title: 'Descartar alterações?', confirmLabel: 'Descartar', danger: true, message: 'Há alterações não salvas neste documento. Se sair agora, elas serão perdidas.',
        cancelLabel: 'Continuar editando', onConfirm: () => { Editor.dirty = false; location.hash = target; } });
      return;
    }
    this.render();
  },
  render() {
    const parts = (location.hash || '#/dashboard').replace(/^#\/?/, '').split('/').map(decodeURIComponent);
    const name = parts[0] || 'dashboard';
    let html = '', mount = null, title = '';
    Editor.active = false;
    if (Modal.stack.length && !Modal.stack.some(m => m._print)) Modal.closeAll();
    $('#main').classList.remove('has-bottom-bar');
    switch (name) {
      case 'documentos': Docs.refreshExpired(); html = Views.documentos(); mount = LIST.docs; title = 'Orçamentos e pedidos'; break;
      case 'doc':
        if (!Editor.open(parts[1], parts[2])) { location.hash = '#/documentos'; return; }
        html = Editor.shell(); mount = () => Editor.mount(); title = KINDS[Editor.draft.kind].label; break;
      case 'pdv': html = Views.pdv(); mount = () => { PDV.renderProducts(); PDV.renderCart(); }; title = 'Venda rápida'; break;
      case 'financeiro': if (!FIN_TABS.some(t => t[0] === UI.tab)) UI.tab = 'receber'; html = Views.financeiro(); mount = () => LIST[UI.tab === 'balcao' ? 'balcao' : UI.tab](); title = 'Financeiro'; break;
      case 'relatorios': html = Views.relatorios(); mount = LIST.rel; title = 'Relatórios'; break;
      case 'catalogo': html = Views.catalogo(); mount = LIST.catalog; title = 'Catálogo'; break;
      case 'estoque': html = Views.estoque(); mount = LIST.estoque; title = 'Estoque'; break;
      case 'clientes': html = Views.clientes(); mount = LIST.clients; title = 'Clientes'; break;
      case 'cliente': html = Views.cliente(parts[1]); title = 'Cliente'; break;
      case 'fornecedores': html = Views.fornecedores(); title = 'Fornecedores'; break;
      case 'busca': html = Views.busca(); mount = () => { LIST.busca(); const i = $('#search-q'); if (i && !window.matchMedia('(pointer: coarse)').matches) i.focus(); }; title = 'Buscar'; break;
      case 'config': html = Views.config(); title = 'Configurações'; break;
      default: Docs.refreshExpired(); html = Views.dashboard(); title = 'Visão geral';
    }
    $('#main').innerHTML = `<div class="max-w-6xl mx-auto">${html}</div>`;
    if (mount) mount();
    const map = { doc: 'documentos', cliente: 'clientes' };
    const active = map[name] || (NAV.some(n => n[0] === name) ? name : (name === 'busca' ? '' : 'dashboard'));
    $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.route === active));
    $('#mobile-title').textContent = title;
    this.current = location.hash || '#/dashboard';
    window.scrollTo(0, 0);
  }
};

const App = {
  openMenu() { $('#sidebar').classList.remove('-translate-x-full'); $('#scrim').classList.remove('hidden'); },
  closeMenu() { $('#sidebar').classList.add('-translate-x-full'); $('#scrim').classList.add('hidden'); },
  renderSwitcher() {
    const d = Store.data;
    if (d.ui.segmentId !== 'all' && !Store.seg(d.ui.segmentId)) d.ui.segmentId = 'all';
    $('#segSwitch').innerHTML = opts([['all', 'Todos os segmentos'], ...d.segments.map(s => [s.id, s.name])], d.ui.segmentId);
    $('#brand-company').textContent = d.company.name;
  },
  renderStorageNote() {
    $('#storage-note').innerHTML = Store.backend === 'memory' ? 'Armazenamento indisponível: dados só nesta sessão.'
      : `Dados salvos neste aparelho (${Store.backend === 'idb' ? 'IndexedDB' : 'LocalStorage'}).<br><span class="text-zinc-400">Versão ${APP_VERSION}</span>`;
  },
  /* outra aba gravou: atualiza a tela, sem perder o que está sendo digitado */
  onExternalChange() {
    this.renderSwitcher();
    if (Editor.active && Editor.dirty) { Toast.show('Os dados foram alterados em outra aba. Este documento continua como está; ao salvar, só ele é gravado.', 'warn'); return; }
    if (Modal.stack.length) return;
    Router.render();
  },
  /* tarefas automáticas: orçamentos vencidos, despesas que repetem, planos mensais */
  routine(announce) {
    const exp = Docs.refreshExpired(), rep = Expenses.materialize(), made = Plans.run();
    if (announce && made.length) Toast.show(`Planos mensais: ${made.length} cobrança(s) gerada(s) (${made.slice(0, 3).join(', ')}${made.length > 3 ? '…' : ''}).`, 'info');
    return exp + rep + made.length;
  },
  registerSW() {
    if (!('serviceWorker' in navigator) || location.protocol.indexOf('http') !== 0) return;
    /* só recarrega quando a pessoa tocou em "Atualizar" (na 1ª instalação o SW também assume a página, sem precisar recarregar) */
    let wanted = false, reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (wanted && !reloading) { reloading = true; location.reload(); } });
    const offer = w => {
      Toast.show('Nova versão do OrçaPro disponível.', 'info', { label: 'Atualizar', fn: () => {
        if (Editor.active && Editor.dirty) return Toast.show('Salve o documento antes de atualizar.', 'error');
        wanted = true; w.postMessage('skip-waiting');
      } }, 600000);
    };
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
      });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  },
  async init() {
    await Store.load();
    await Photos.init(); Photos.gc();
    Theme.apply();
    if (Theme.mq && Theme.mq.addEventListener) Theme.mq.addEventListener('change', () => Theme.apply());
    $('#nav').innerHTML = NAV.map(([r, l, i]) => `<a href="#/${r}" data-nav data-route="${r}" class="nav-link">${icon(i, 'w-4 h-4')}${l}</a>`).join('');
    $('[data-action="menu-open"]').innerHTML = icon('menu', 'w-5 h-5');
    $('[data-action="search-open"]').innerHTML = icon('search', 'w-5 h-5');
    this.renderSwitcher(); this.renderStorageNote();
    this.routine(true);
    window.addEventListener('hashchange', () => Router.onHash());
    window.addEventListener('beforeunload', e => { if (Editor.active && Editor.dirty) { e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (this.routine(true) && !(Editor.active && Editor.dirty) && !Modal.stack.length) Router.render();
    });
    Router.render();
    this.registerSW();
  }
};

  'backup-file': () => Backup.exportFile(),
  'backup-file-import': () => $('#backup-file-input').click(),
  'backup-import': () => Backup.importForm(),
  'backup-run': el => Backup.run(el),
  'reset-demo': () => Modal.confirm({ title: 'Carregar exemplos', danger: true, confirmLabel: 'Substituir tudo', message: 'Isso substitui todos os dados atuais pelos dados de exemplo. Faça um backup antes, se precisar.',
    onConfirm: () => { const st = Store.data.settings; Store.data = Seed.build(); Store.data.settings = st; Store.migrate(); Store.save(); Photos.gc(); PDV.reset(); App.renderSwitcher(); Router.render(); Toast.show('Dados de exemplo carregados.', 'success'); } }),
  'reset-empty': () => Modal.confirm({ title: 'Apagar tudo', danger: true, confirmLabel: 'Apagar tudo', message: 'Todos os clientes, itens, orçamentos, vendas, despesas e caixas serão apagados. Suas configurações (empresa, Pix) continuam. Essa ação não pode ser desfeita.',
    onConfirm: () => { const st = Store.data.settings, co = Store.data.company; Store.data = Seed.empty(); Store.data.settings = st; Store.data.company = co; Store.migrate(); Store.save(); Photos.gc(); PDV.reset(); App.renderSwitcher(); Router.render(); Toast.show('Dados apagados.', 'success'); } })
};

/* ---- 17-events.js ---- */
/* ============================================================
   19. EVENTOS GLOBAIS (um ouvinte para a página toda — "delegação")
   ============================================================ */
document.addEventListener('click', e => {
  const hb = e.target.closest('[data-help]');
  if (hb && hb.classList.contains('help-btn')) { e.preventDefault(); if (Help.ptr === 'mouse') Help.show(hb); else if (Help.cur === hb) Help.hide(); else Help.show(hb); return; }
  const jump = e.target.closest('a[data-jump]');
  if (jump) { e.preventDefault(); const t = $(jump.getAttribute('href')); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const link = e.target.closest('a[data-nav]');
  if (link && link.dataset.client) Editor.presetClient = link.dataset.client;
  const a = e.target.closest('[data-action]');
  if (a) { const fn = Actions[a.dataset.action]; if (fn) fn(a, e); if (a.tagName !== 'A') return; }
  if (link && e.target.closest('#sidebar')) App.closeMenu();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) { const ok = Validate.live(t); if ((t.dataset.co || t.dataset.st) && !ok) return; }
  if (t.id === 'segSwitch') {
    Store.data.ui.segmentId = t.value; Store.save(); PDV.reset();
    if (!Editor.active) Router.render();
    return;
  }
  if (t.id === 'search-q') { UI.search = t.value; LIST.busca(); return; }
  if (t.dataset.filter) {
    const [g, k] = t.dataset.filter.split('.'); UI.f[g][k] = t.value;
    if (['caixa', 'rel'].includes(g) && (k === 'from' || k === 'to')) UI.f[g].preset = 'custom';
    const map = { docs: 'docs', catalog: 'catalog', clients: 'clients', receber: 'receber', pagar: 'pagar', caixa: 'caixa', rel: 'rel', estoque: 'estoque' };
    if (LIST[map[g]]) LIST[map[g]]();
    return;
  }
  if (t.dataset.filterCheck) { const [g, k] = t.dataset.filterCheck.split('.'); UI.f[g][k] = t.checked; LIST.catalog(); return; }
  if (t.dataset.co) {
    Store.data.company[t.dataset.co] = t.dataset.co === 'validDays' ? Math.round(U.num(t.value) || 0) : t.value;
    Store.save(); App.renderSwitcher(); return;
  }
  if (t.dataset.st) { Settings.set(t); return; }
  if (t.dataset.printOpt) { Print.opts[t.dataset.printOpt] = t.checked; Print.refresh(); return; }
  if (t.dataset.pdvSearch !== undefined) { PDV.q = t.value; PDV.renderProducts(); return; }
  if (t.dataset.pdvItem !== undefined) { PDV.onItemInput(t); return; }
  if (t.dataset.pdv) { PDV.onInput(t); return; }
  if (t.id === 'cx-count') { CashUI.diff(); return; }
  if (Editor.active && Editor.draft) {
    if (t.dataset.item !== undefined) Editor.onItem(t);
    else if (t.dataset.doc) Editor.onDocField(t);
    else if (t.dataset.os !== undefined || t.dataset.osCheck !== undefined || t.dataset.osText !== undefined) Editor.onOsField(t);
    else if (t.dataset.inst !== undefined) Editor.onInst(t);
    else if (t.dataset.photoCap) {
      const ph = Editor.draft.photos.find(x => x.id === t.dataset.photoCap);
      if (ph) { ph.caption = t.value; Editor.dirty = true; }
    } else if (t.dataset.termSelect !== undefined) {
      const tm = Store.data.paymentTerms.find(x => x.id === t.value);
      if (tm) { Editor.draft.paymentTerms = tm.text; Editor.dirty = true; const ta = $('[data-doc="paymentTerms"]'); if (ta) ta.value = tm.text; }
    }
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pdv === 'customer') { PDV.onCustomer(); return; }
  if (t.id === 'ed-photo-input' && Editor.active) { Editor.addPhotos(Array.from(t.files)); t.value = ''; return; }
  if (t.id === 'backup-file-input' && t.files[0]) { Backup.fromFile(t.files[0]); t.value = ''; return; }
  if (t.id === 'logo-input' && t.files[0]) {
    Photos.fromFile(t.files[0], 360, 'image/png').then(data => {
      Photos.put('company-logo', data); Store.data.company.logo = true; Store.save(); Router.render(); Toast.show('Logo salva.', 'success');
    }).catch(() => Toast.show('Não foi possível ler essa imagem.', 'error'));
    return;
  }
  if (t.dataset.actionSelect === 'pdv-seg') { PDV.segId = t.value; PDV.reset(); Router.render(); return; }
  if (t.dataset.actionSelect === 'balcao-seg') { UI.balcaoSeg = t.value; Router.render(); return; }
  if (t.dataset.pdvItem !== undefined) { PDV.onItemChange(t); return; }
  if (t.id === 'side-search') return;
});

/* ao sair de um campo numérico, reescreve no formato brasileiro (49,9 → 49,90) */
document.addEventListener('focusout', e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.num || t.value.trim() === '') return;
  const n = U.num(t.value); if (isNaN(n)) return;
  const v = numVal(n, t.dataset.num);
  if (v !== t.value) t.value = v;
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (Help.cur) Help.hide(); else if (Modal.stack.length) Modal.closeTop(); return; }
  if (e.key === 'Tab') Modal.trap(e);
  const t = e.target;
  if (t.id === 'side-search' && e.key === 'Enter') { UI.search = t.value; t.blur(); if (location.hash === '#/busca') Router.render(); else location.hash = '#/busca'; return; }
  /* campos numéricos: bloqueia letras e o sinal de menos (exceto onde negativo é permitido) */
  if (t.tagName === 'INPUT' && t.dataset.num && !e.ctrlKey && !e.metaKey && e.key.length === 1) {
    const allowed = t.dataset.num === 'int' ? /[0-9]/ : /[0-9.,]/;
    if (!(allowed.test(e.key) || (e.key === '-' && t.dataset.neg))) e.preventDefault();
  }
});
document.addEventListener('pointerdown', e => { Help.ptr = e.pointerType || 'mouse'; if (!e.target.closest('[data-help]')) Help.hide(); });
document.addEventListener('pointerover', e => { if (e.pointerType === 'mouse') { const b = e.target.closest && e.target.closest('.help-btn'); if (b) Help.show(b); } });
document.addEventListener('pointerout', e => { if (e.pointerType === 'mouse' && e.target.closest && e.target.closest('.help-btn')) Help.hide(); });
window.addEventListener('scroll', () => Help.hide(), true);
let helpQueued = false;
new MutationObserver(() => {
  if (helpQueued) return; helpQueued = true;
  requestAnimationFrame(() => { helpQueued = false; Help.enhance(); });
}).observe(document.body, { childList: true, subtree: true });

/* acesso para os testes automáticos (só com ?test=1 no endereço) */
if (location.search.includes('test=1')) window.OP = { Store, Docs, Finance, Pricing, Stock, Pix, Share, Editor, PDV, Print, Expenses, Plans, CashBox, Reports, Backup, Photos, Router, Clients, StockOps, Extenso, U, Seed, Undo, Alerts, Search, Template, UI };

App.init();

})();
</script>
