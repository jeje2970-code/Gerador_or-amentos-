const Backup = {
  exportJson() {
    const root = Modal.open({ title: 'Backup dos dados', size: 'max-w-2xl',
      body: `<p class="text-sm text-zinc-500 mb-3">Copie o texto abaixo e guarde em um arquivo seguro. Para restaurar, use “Restaurar backup” e cole o conteúdo.</p>
        <textarea class="input font-mono text-xs" rows="12" readonly id="backup-text">${U.esc(JSON.stringify(Store.data, null, 2))}</textarea>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Fechar</button><button class="btn btn-primary" data-action="backup-copy">Copiar</button>` });
    return root;
  },
  copy() {
    const ta = $('#backup-text'); ta.select();
    const ok = () => Toast.show('Backup copiado.', 'success');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, () => { try { document.execCommand('copy'); ok(); } catch (e) { Toast.show('Selecione o texto e copie manualmente.', 'error'); } });
    else { try { document.execCommand('copy'); ok(); } catch (e) { Toast.show('Selecione o texto e copie manualmente.', 'error'); } }
  },
  importForm() {
    Modal.open({ title: 'Restaurar backup', size: 'max-w-2xl',
      body: `<p class="text-sm text-zinc-500 mb-3">Cole o conteúdo do backup. Os dados atuais serão substituídos.</p><textarea class="input font-mono text-xs" rows="12" id="backup-in"></textarea>`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="backup-run">Restaurar</button>` });
  },
  run(el) {
    let obj;
    try { obj = JSON.parse($('#backup-in').value); } catch (e) { return Toast.show('O texto colado não é um backup válido.', 'error'); }
    const ok = obj && ['segments', 'products', 'clients', 'documents'].every(k => Array.isArray(obj[k])) && obj.counters && obj.company && obj.ui;
    if (!ok) return Toast.show('O backup está incompleto ou é de outro sistema.', 'error');
    Store.data = obj; Store.migrate(); Store.save(); Modal.closeFrom(el); App.renderSwitcher(); Toast.show('Backup restaurado.', 'success'); Router.render();
  }
};

/* ============================================================
   17. ROTEADOR + APP
   ============================================================ */
const NAV = [
  ['dashboard', 'Visão geral', 'home'], ['documentos', 'Orçamentos e pedidos', 'file'], ['pdv', 'Venda rápida', 'cart'],
  ['financeiro', 'Financeiro', 'dollar'], ['catalogo', 'Catálogo', 'box'], ['clientes', 'Clientes', 'users'], ['config', 'Configurações', 'sliders']
];

const Router = {
  render() {
    const parts = (location.hash || '#/dashboard').replace(/^#\/?/, '').split('/');
    const name = parts[0] || 'dashboard';
    let html = '', mount = null, title = '';
    Editor.active = false;
    switch (name) {
      case 'documentos': html = Views.documentos(); mount = LIST.docs; title = 'Orçamentos e pedidos'; break;
      case 'doc':
        if (!Editor.open(parts[1], parts[2])) { location.hash = '#/documentos'; return; }
        html = Editor.shell(); mount = () => Editor.mount(); title = KINDS[Editor.draft.kind].label; break;
      case 'pdv': html = Views.pdv(); mount = () => { PDV.renderProducts(); PDV.renderCart(); }; title = 'Venda rápida'; break;
      case 'financeiro': html = Views.financeiro(); mount = () => (UI.tab === 'receber' ? LIST.receber() : LIST.caixa()); title = 'Financeiro'; break;
      case 'catalogo': html = Views.catalogo(); mount = LIST.catalog; title = 'Catálogo'; break;
      case 'clientes': html = Views.clientes(); mount = LIST.clients; title = 'Clientes'; break;
      case 'config': html = Views.config(); title = 'Configurações'; break;
      default: html = Views.dashboard(); title = 'Visão geral';
    }
    $('#main').innerHTML = `<div class="max-w-6xl mx-auto">${html}</div>`;
    if (mount) mount();
    const active = name === 'doc' ? 'documentos' : (NAV.some(n => n[0] === name) ? name : 'dashboard');
    $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.route === active));
    $('#mobile-title').textContent = title;
    window.scrollTo(0, 0);
  }
};

const App = {
  openMenu() { $('#sidebar').classList.remove('-translate-x-full'); $('#scrim').classList.remove('hidden'); },
  closeMenu() { $('#sidebar').classList.add('-translate-x-full'); $('#scrim').classList.add('hidden'); },
  renderSwitcher() {
    const d = Store.data;
    if (d.ui.segmentId !== 'all' && !Store.seg(d.ui.segmentId)) d.ui.segmentId = 'all';
    $('#segSwitch').innerHTML = opts([['all', 'Todos os segmentos'], ...d.segments.map(s => [s.id, s.name])], d.ui.segmentId);
    $('#brand-company').textContent = d.company.name;
  },
  renderStorageNote() {
    $('#storage-note').textContent = Store.memoryOnly ? 'Armazenamento indisponível: dados só nesta sessão.' : 'Dados salvos neste navegador (LocalStorage).';
  },
  async init() {
    Store.load();
    await Photos.init(); Photos.gc();
    $('#nav').innerHTML = NAV.map(([r, l, i]) => `<a href="#/${r}" data-nav data-route="${r}" class="nav-link">${icon(i, 'w-4 h-4')}${l}</a>`).join('');
    $('[data-action="menu-open"]').innerHTML = icon('menu', 'w-5 h-5');
    this.renderSwitcher(); this.renderStorageNote();
    window.addEventListener('hashchange', () => Router.render());
    Router.render();
  }
};

/* ============================================================
   18. AÇÕES (delegação de eventos)
   ============================================================ */
const Actions = {
  'menu-open': () => App.openMenu(),
  'menu-close': () => App.closeMenu(),
  'modal-close': el => Modal.closeFrom(el),
  'modal-confirm': el => { const root = el.closest('[data-modal]'), fn = root._onConfirm; Modal.closeFrom(el); if (fn) fn(); },

  /* editor */
  'ed-save': () => Editor.save(false),
  'ed-print': () => Print.open(Editor.draft),
  'print-now': el => Print.now(el),
  'ed-add-catalog': () => Editor.openPicker(),
  'ed-add-hour': () => Editor.addItem(Pricing.hourItem(Store.seg(Editor.draft.segmentId))),
  'ed-add-free': el => Editor.addItem(Pricing.blankItem(Store.seg(Editor.draft.segmentId), el.dataset.type || 'material')),
  'ed-photo-add': () => $('#ed-photo-input').click(),
  'ed-photo-del': el => { Editor.draft.photos = Editor.draft.photos.filter(x => x.id !== el.dataset.id); Editor.dirty = true; Editor.renderPhotos(); },
  'logo-pick': () => $('#logo-input').click(),
  'logo-del': () => { Photos.del('company-logo'); Store.data.company.logo = false; Store.save(); Router.render(); },
  'term-new': () => Terms.openForm(null),
  'term-edit': el => Terms.openForm(el.dataset.id),
  'term-save': el => Terms.save(el),
  'term-del': el => Modal.confirm({ title: 'Excluir condição', danger: true, confirmLabel: 'Excluir', message: 'Excluir esta condição de pagamento? Orçamentos já criados não são afetados.',
    onConfirm: () => { Store.data.paymentTerms = Store.data.paymentTerms.filter(t => t.id !== el.dataset.id); Store.save(); Router.render(); } }),
  'ed-tab': el => { Editor.tab = el.dataset.tab; Editor.renderItems(); },
  'ed-pick': el => {
    const p = Store.product(el.dataset.id), seg = Store.seg(Editor.draft.segmentId);
    Editor.addItem(Pricing.itemFromProduct(p, seg, 1)); Toast.show(`${p.name} adicionado.`, 'success');
  },
  'ed-del-item': el => { Editor.draft.items.splice(+el.dataset.idx, 1); Editor.dirty = true; Editor.renderItems(); Editor.refreshSummary(); },
  'ed-restore': el => {
    const i = +el.dataset.idx, it = Editor.draft.items[i];
    it.margin = it.baseMargin; it.locked = false; it.price = Pricing.suggest(it.cost, it.margin);
    Editor.dirty = true; Editor.syncRow(i, null); Editor.refreshSummary();
  },
  'ed-clear-override': () => { Editor.draft.finalOverride = null; $('#ed-override').value = ''; Editor.dirty = true; Editor.refreshSummary(); },
  'ed-add-payment': () => Editor.addPayment(),
  'ed-del-payment': el => {
    const d = Editor.draft, removed = d.payments.find(p => p.id === el.dataset.id);
    d.payments = d.payments.filter(p => p.id !== el.dataset.id);
    if (Docs.exists(d.id)) Editor.save(true);
    Editor.renderPayments(true); Toast.show(removed ? 'Pagamento removido.' : '', 'info');
  },
  'ed-new-client': () => Clients.openForm(null, rec => {
    Editor.draft.clientId = rec.id; Editor.dirty = true;
    const sel = $('#ed-client'); if (sel) sel.innerHTML = Editor.clientOptions(rec.id);
  }),
  'ed-delete': () => Modal.confirm({ title: 'Excluir documento', danger: true, confirmLabel: 'Excluir',
    message: `Excluir ${U.esc(Editor.draft.number)} definitivamente? O estoque movimentado será devolvido e os pagamentos registrados serão apagados.`,
    onConfirm: () => { Docs.remove(Editor.draft.id); Editor.dirty = false; Toast.show('Documento excluído.', 'success'); location.hash = '#/documentos'; } }),
  'ed-convert-open': () => Modal.open({ title: 'Converter orçamento', size: 'max-w-md',
    body: `<p class="text-sm text-zinc-600">O documento será salvo e passará a contar no faturamento, com status “Em Andamento”. Escolha o destino:</p>`,
    footer: `<button class="btn btn-secondary" data-action="ed-convert" data-kind="pedido">Pedido de venda</button><button class="btn btn-primary" data-action="ed-convert" data-kind="os">Ordem de serviço</button>` }),
  'ed-convert': el => { Modal.closeFrom(el); Editor.convert(el.dataset.kind); },

  /* pdv */
  'pdv-add': el => PDV.add(el.dataset.id),
  'pdv-inc': el => { PDV.cart[+el.dataset.i].qty += 1; PDV.renderCart(); },
  'pdv-dec': el => { const it = PDV.cart[+el.dataset.i]; it.qty = Math.max(0, it.qty - 1); if (it.qty === 0) PDV.cart.splice(+el.dataset.i, 1); PDV.renderCart(); },
  'pdv-del': el => { PDV.cart.splice(+el.dataset.i, 1); PDV.renderCart(); },
  'pdv-clear': () => { PDV.cart = []; PDV.renderCart(); },
  'pdv-method': el => { PDV.method = el.dataset.m; PDV.renderCart(); },
  'pdv-cat': el => { PDV.cat = el.dataset.cat; Router.render(); },
  'pdv-finish': () => PDV.finish(),
  'pdv-scroll': () => $('#pdv-cart').scrollIntoView({ behavior: 'smooth', block: 'start' }),

  /* financeiro */
  'fin-tab': el => { UI.tab = el.dataset.tab; Router.render(); },
  'rec-view': el => { UI.f.receber.view = el.dataset.v; Router.render(); },
  'rec-clear': () => { Object.assign(UI.f.receber, { q: '', client: 'all', from: '', to: '' }); Router.render(); },
  'rec-person': el => {
    const f = UI.f.receber; f.view = 'docs';
    if (el.dataset.client) { f.client = el.dataset.client; f.q = ''; } else { f.client = 'all'; f.q = el.dataset.name; }
    Router.render();
  },
  'pay-open': el => Pay.openReceive(el.dataset.id),
  'pay-save': el => Pay.save(el),
  'caixa-preset': el => {
    const p = el.dataset.p, f = UI.f.caixa; f.preset = p;
    if (p === 'hoje') { f.from = f.to = U.today(); }
    else if (p === '7d') { f.from = U.addDays(-6); f.to = U.today(); }
    else if (p === 'mes') { const m = U.monthRange(); f.from = m.from; f.to = m.to; }
    Router.render();
  },
  'caixa-print': () => window.print(),

  /* catálogo, clientes, segmentos */
  'cat-new': () => Catalog.openForm(null),
  'cat-edit': el => Catalog.openForm(el.dataset.id),
  'cat-save': el => Catalog.save(el),
  'cat-dup': el => Catalog.openForm(el.dataset.id, 'dupe'),
  'cat-variant': el => Catalog.openForm(el.dataset.id, 'variant'),
  'cat-add-category': el => {
    const parent = el.closest('[data-modal]');
    const root = Modal.open({ title: 'Nova categoria', size: 'max-w-sm',
      body: `<label class="label">Nome da categoria</label><input class="input" name="catname" placeholder="Ex.: Ferramentas">`,
      footer: `<button class="btn btn-secondary" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="cat-add-category-save">Adicionar</button>` });
    root._parent = parent; root._segId = formData(parent).segmentId;
  },
  'cat-add-category-save': el => {
    const root = el.closest('[data-modal]'), name = formData(root).catname.trim();
    if (!name) return Toast.show('Informe o nome da categoria.', 'error');
    const seg = Store.seg(root._segId), found = seg.categories.find(c => c.toLowerCase() === name.toLowerCase());
    if (!found) seg.categories.push(name);
    Store.save(); Catalog.fillCats(root._parent, found || name); Modal.closeFrom(el);
  },
  'seg-cat-add': el => {
    const root = el.closest('[data-modal]'), box = $('#seg-cats', root);
    box.insertAdjacentHTML('beforeend', Segments.catRow('')); box.lastElementChild.querySelector('input').focus();
  },
  'seg-cat-del': el => {
    const row = el.closest('[data-cat-row]'), root = el.closest('[data-modal]'), orig = $('[data-cat]', row).dataset.orig;
    const used = orig && root._id ? Store.data.products.filter(p => p.segmentId === root._id && p.category === orig).length : 0;
    if (used) return Toast.show(`${used} item(ns) usam esta categoria. Mude a categoria deles no catálogo antes de remover.`, 'error');
    row.remove();
  },
  'cat-del': el => Modal.confirm({ title: 'Excluir item', danger: true, confirmLabel: 'Excluir', message: 'Excluir este item do catálogo? Orçamentos já criados não são afetados.',
    onConfirm: () => { Store.data.products = Store.data.products.filter(p => p.id !== el.dataset.id); Store.save(); Router.render(); } }),
  'client-new': () => Clients.openForm(null),
  'client-edit': el => Clients.openForm(el.dataset.id),
  'client-save': el => Clients.save(el),
  'client-del': el => {
    const used = Store.data.documents.some(d => d.clientId === el.dataset.id);
    Modal.confirm({ title: 'Excluir cliente', danger: true, confirmLabel: 'Excluir',
      message: used ? 'Este cliente possui documentos. Eles continuarão existindo, mas ficarão sem cliente vinculado.' : 'Excluir este cliente?',
      onConfirm: () => {
        Store.data.documents.forEach(d => { if (d.clientId === el.dataset.id) d.clientId = ''; });
        Store.data.clients = Store.data.clients.filter(c => c.id !== el.dataset.id); Store.save(); Router.render();
      } });
  },
  'seg-new': () => Segments.openForm(null),
  'seg-edit': el => Segments.openForm(el.dataset.id),
  'seg-save': el => Segments.save(el),
  'seg-del': el => {
    const id = el.dataset.id, d = Store.data;
    if (d.segments.length <= 1) return Toast.show('Mantenha pelo menos um segmento.', 'error');
    if (d.products.some(p => p.segmentId === id) || d.documents.some(x => x.segmentId === id)) return Toast.show('Este segmento tem itens ou documentos e não pode ser excluído.', 'error');
    Modal.confirm({ title: 'Excluir segmento', danger: true, confirmLabel: 'Excluir', message: 'Excluir este segmento?',
      onConfirm: () => { d.segments = d.segments.filter(s => s.id !== id); Store.save(); App.renderSwitcher(); Router.render(); } });
  },

  /* backup */
  'backup-export': () => Backup.exportJson(),
  'backup-copy': () => Backup.copy(),
  'backup-import': () => Backup.importForm(),
  'backup-run': el => Backup.run(el),
  'reset-demo': () => Modal.confirm({ title: 'Carregar exemplos', danger: true, confirmLabel: 'Substituir tudo', message: 'Isso substitui todos os dados atuais pelos dados de exemplo.',
    onConfirm: () => { Store.data = Seed.build(); Store.save(); Photos.gc(); PDV.reset(); App.renderSwitcher(); Router.render(); Toast.show('Dados de exemplo carregados.', 'success'); } }),
  'reset-empty': () => Modal.confirm({ title: 'Apagar tudo', danger: true, confirmLabel: 'Apagar tudo', message: 'Todos os clientes, itens, orçamentos e vendas serão apagados. Essa ação não pode ser desfeita.',
    onConfirm: () => { Store.data = Seed.empty(); Store.save(); Photos.gc(); PDV.reset(); App.renderSwitcher(); Router.render(); Toast.show('Dados apagados.', 'success'); } })
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (a) { const fn = Actions[a.dataset.action]; if (fn) fn(a, e); return; }
  const link = e.target.closest('a[data-nav]');
  if (link) {
    if (Editor.active && Editor.dirty && location.hash.startsWith('#/doc/')) {
      e.preventDefault();
      const href = link.getAttribute('href');
      Modal.confirm({ title: 'Descartar alterações?', confirmLabel: 'Descartar', danger: true, message: 'Há alterações não salvas neste documento.',
        onConfirm: () => { Editor.dirty = false; location.hash = href; } });
      return;
    }
    if (e.target.closest('#sidebar')) App.closeMenu();
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'segSwitch') {
    Store.data.ui.segmentId = t.value; Store.save(); PDV.reset();
    if (!Editor.active) Router.render();
    return;
  }
  if (t.dataset.filter) {
    const [g, k] = t.dataset.filter.split('.'); UI.f[g][k] = t.value;
    if (g === 'caixa' && (k === 'from' || k === 'to')) UI.f.caixa.preset = 'custom';
    if (LIST[g]) LIST[g]();
    return;
  }
  if (t.dataset.co) { Store.data.company[t.dataset.co] = t.value; Store.save(); App.renderSwitcher(); return; }
  if (t.dataset.pdvSearch !== undefined) { PDV.q = t.value; PDV.renderProducts(); return; }
  if (t.dataset.pdv) { PDV.onInput(t); return; }
  if (Editor.active && Editor.draft) {
    if (t.dataset.item !== undefined) Editor.onItem(t);
    else if (t.dataset.doc) Editor.onDocField(t);
    else if (t.dataset.photoCap) {
      const ph = Editor.draft.photos.find(x => x.id === t.dataset.photoCap);
      if (ph) { ph.caption = t.value; Editor.dirty = true; }
    } else if (t.dataset.termSelect !== undefined) {
      const tm = Store.data.paymentTerms.find(x => x.id === t.value);
      if (tm) { Editor.draft.paymentTerms = tm.text; Editor.dirty = true; const ta = $('[data-doc="paymentTerms"]'); if (ta) ta.value = tm.text; }
    }
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ed-photo-input' && Editor.active) { Editor.addPhotos(Array.from(t.files)); t.value = ''; return; }
  if (t.id === 'logo-input' && t.files[0]) {
    Photos.fromFile(t.files[0], 360, 'image/png').then(data => {
      Photos.put('company-logo', data); Store.data.company.logo = true; Store.save(); Router.render(); Toast.show('Logo salva.', 'success');
    }).catch(() => Toast.show('Não foi possível ler essa imagem.', 'error'));
    return;
  }
  if (t.dataset.actionSelect === 'pdv-seg') { PDV.segId = t.value; PDV.reset(); Router.render(); return; }
  if (t.dataset.pdvItem !== undefined) {
    const it = PDV.cart[+t.dataset.pdvItem]; if (!it) return;
    Pricing.applyChange(it, t.dataset.f, t.value);
    if (it.qty <= 0) PDV.cart.splice(+t.dataset.pdvItem, 1);
    PDV.renderCart();
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && Modal.stack.length) Modal.closeTop(); });

App.init();
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
